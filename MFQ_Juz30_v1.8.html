luar, padang tumbuh, gunung terpancang, lalu manusia dan ternak menikmatinya. Kemudian Malapetaka Terbesar datang.","memoryColor":"green"},{"range":[35,39],"title":"Mini-story 8 — Jalan Jahim","cue":"Ingat Usaha → Jahim → Melampaui Batas → Dunia → Jahim Tempat","keywords":["Ingat Usaha","Jahim","Melampaui Batas","Dunia","Jahim Tempat"],"memoryEmoji":"🔥","memoryScene":"Saat malapetaka datang, manusia teringat usahanya dan Jahim tampak. Orang yang melampaui batas karena mengutamakan dunia menuju Jahim sebagai tempat tinggal.","memoryColor":"rose"},{"range":[40,44],"title":"Mini-story 9 — Jalan Surga dan Waktu","cue":"Tahan Nafsu → Surga → Tanya Kiamat → Menyebut Waktu → Kepada Tuhan","keywords":["Tahan Nafsu","Surga","Tanya Kiamat","Menyebut Waktu","Kepada Tuhan"],"memoryEmoji":"🛤️","memoryScene":"Di jalur lain, orang yang takut dan menahan nafsu menuju surga. Orang bertanya kapan Kiamat; pertanyaan tentang waktunya berakhir pada Tuhan sebagai penentu kesudahan.","memoryColor":"green"},{"range":[45,46],"title":"Mini-story 10 — Peringatan Singkat","cue":"Pemberi Peringatan → Petang-Pagi","keywords":["Pemberi Peringatan","Petang-Pagi"],"memoryEmoji":"⏳","memoryScene":"Dari pertanyaan itu tersisa tugas memberi peringatan. Ketika Kiamat terlihat, hidup dunia terasa hanya seperti satu petang atau pagi.","memoryColor":"sand"}],"verses":[{"n":1,"a":"وَالنّٰزِعٰتِ غَرْقًاۙ","l":"Wan-nāzi‘āti garqā(n).","t":"Demi (malaikat) yang mencabut (nyawa orang kafir) dengan keras,"},{"n":2,"a":"وَّالنّٰشِطٰتِ نَشْطًاۙ","l":"Wan-nāsyiṭāti nasyṭā(n).","t":"demi (malaikat) yang mencabut (nyawa orang mukmin) dengan lemah lembut,"},{"n":3,"a":"وَّالسّٰبِحٰتِ سَبْحًاۙ","l":"Was-sābiḥāti sabḥā(n).","t":"demi (malaikat) yang cepat (menunaikan tugasnya) dengan mudah,"},{"n":4,"a":"فَالسّٰبِقٰتِ سَبْقًاۙ","l":"Fas-sābiqāti sabqā(n).","t":"(malaikat) yang bergegas (melaksanakan perintah Allah) dengan cepat,"},{"n":5,"a":"فَالْمُدَبِّرٰتِ اَمْرًاۘ","l":"Fal-mudabbirāti amrā(n).","t":"dan (malaikat) yang mengatur urusan (dunia),"},{"n":6,"a":"يَوْمَ تَرْجُفُ الرَّاجِفَةُۙ","l":"Yauma tarjufur-rājifah(tu).","t":"(kamu benar-benar akan dibangkitkan) pada hari ketika tiupan pertama mengguncang (alam semesta)."},{"n":7,"a":"تَتْبَعُهَا الرَّادِفَةُ ۗ","l":"Tatba‘uhar-rādifah(tu).","t":"(Tiupan pertama) itu diiringi oleh tiupan kedua."},{"n":8,"a":"قُلُوْبٌ يَّوْمَىِٕذٍ وَّاجِفَةٌۙ","l":"Qulūbuy yauma'iżiw wājifah(tun).","t":"Hati manusia pada hari itu merasa sangat takut;"},{"n":9,"a":"اَبْصَارُهَا خَاشِعَةٌ ۘ","l":"Abṣāruhā khāsyi‘ah(tun).","t":"pandangannya tertunduk."},{"n":10,"a":"يَقُوْلُوْنَ ءَاِنَّا لَمَرْدُوْدُوْنَ فِى الْحَافِرَةِۗ","l":"Yaqūlūna a'innā lamardūdūna fil-ḥāfirah(ti).","t":"Mereka berkata, “Apakah kita benar-benar akan dikembalikan pada kehidupan yang semula?"},{"n":11,"a":"ءَاِذَا كُنَّا عِظَامًا نَّخِرَةً ۗ","l":"A'iżā kunnā ‘iẓāman nakhirah(tan).","t":"Apakah (akan dibangkitkan juga) apabila kita telah menjadi tulang-belulang yang hancur?”"},{"n":12,"a":"قَالُوْا تِلْكَ اِذًا كَرَّةٌ خَاسِرَةٌ ۘ","l":"Qālū tilka iżan karratun khāsirah(tun).","t":"Mereka berkata, “Kalau demikian, itu adalah pengembalian yang merugikan.”"},{"n":13,"a":"فَاِنَّمَا هِيَ زَجْرَةٌ وَّاحِدَةٌۙ","l":"Fa innamā hiya zajratuw wāḥidah(tun).","t":"Sesungguhnya ia hanya dengan sekali tiupan."},{"n":14,"a":"فَاِذَا هُمْ بِالسَّاهِرَةِۗ","l":"Fa iżā hum bis-sāhirah(ti).","t":"Seketika itu, mereka hidup kembali di bumi (yang baru)."},{"n":15,"a":"هَلْ اَتٰىكَ حَدِيْثُ مُوْسٰىۘ","l":"Hal atāka ḥadīṡu mūsā.","t":"Sudah sampaikah kepadamu (Nabi Muhammad) kisah Musa?"},{"n":16,"a":"اِذْ نَادٰىهُ رَبُّهٗ بِالْوَادِ الْمُقَدَّسِ طُوًىۚ","l":"Iż nādāhu rabbuhū bil-wādil-muqaddasi ṭuwā(n).","t":"Ketika Tuhan memanggilnya (Musa) di lembah suci, yaitu Lembah Tuwa,"},{"n":17,"a":"اِذْهَبْ اِلٰى فِرْعَوْنَ اِنَّهٗ طَغٰىۖ","l":"Iżhab ilā fir‘auna innahū ṭagā.","t":"“Pergilah engkau kepada Fir‘aun! Sesungguhnya dia telah melampaui batas."},{"n":18,"a":"فَقُلْ هَلْ لَّكَ اِلٰٓى اَنْ تَزَكّٰىۙ","l":"Fa qul hal laka ilā an tazakkā.","t":"Katakanlah (kepada Fir‘aun), ‘Apakah engkau mau menyucikan diri (dari kesesatan)"},{"n":19,"a":"وَاَهْدِيَكَ اِلٰى رَبِّكَ فَتَخْشٰىۚ","l":"Wa ahdiyaka ilā rabbika fa takhsyā.","t":"dan aku akan menunjukimu ke (jalan) Tuhanmu agar engkau takut (kepada-Nya)?’”"},{"n":20,"a":"فَاَرٰىهُ الْاٰيَةَ الْكُبْرٰىۖ","l":"Fa arāhul-āyatal-kubrā.","t":"Lalu, Musa memperlihatkan kepadanya mukjizat yang besar."},{"n":21,"a":"فَكَذَّبَ وَعَصٰىۖ","l":"Fa każżaba wa ‘aṣā.","t":"Akan tetapi, dia (Fir‘aun) mendustakan dan mendurhakai."},{"n":22,"a":"ثُمَّ اَدْبَرَ يَسْعٰىۖ","l":"Ṡumma adbara yas‘ā.","t":"Kemudian, dia berpaling seraya berusaha (menantang Musa)."},{"n":23,"a":"فَحَشَرَ فَنَادٰىۖ","l":"Fa ḥasyara fanādā.","t":"Kemudian, dia mengumpulkan (pembesar-pembesarnya), lalu berseru,"},{"n":24,"a":"فَقَالَ اَنَا۠ رَبُّكُمُ الْاَعْلٰىۖ","l":"Fa qāla ana rabbukumul-a‘lā.","t":"seraya berkata, “Akulah Tuhanmu yang paling tinggi.”"},{"n":25,"a":"فَاَخَذَهُ اللّٰهُ نَكَالَ الْاٰخِرَةِ وَالْاُوْلٰىۗ","l":"Fa akhażahullāhu nakālal-ākhirati wal-ūlā.","t":"Maka, Allah menghukumnya dengan azab di akhirat dan (siksaan) di dunia."},{"n":26,"a":"اِنَّ فِيْ ذٰلِكَ لَعِبْرَةً لِّمَنْ يَّخْشٰى ۗ ࣖ","l":"Inna fī żālika la‘ibratal limay yakhsyā.","t":"Sesungguhnya pada yang demikian itu terdapat pelajaran bagi orang yang takut (kepada Allah)."},{"n":27,"a":"ءَاَنْتُمْ اَشَدُّ خَلْقًا اَمِ السَّمَاۤءُ ۚ بَنٰىهَاۗ","l":"A'antum asyaddu khalqan amis-samā'u banāhā.","t":"Apakah penciptaan kamu yang lebih hebat ataukah langit yang telah dibangun-Nya?"},{"n":28,"a":"رَفَعَ سَمْكَهَا فَسَوّٰىهَاۙ","l":"Rafa‘a samkahā fa sawwāhā.","t":"Dia telah meninggikan bangunannya, lalu menyempurnakannya."},{"n":29,"a":"وَاَغْطَشَ لَيْلَهَا وَاَخْرَجَ ضُحٰىهَاۖ","l":"Wa agṭasya lailahā wa akhraja ḍuḥāhā.","t":"Dia menjadikan malamnya (gelap gulita) dan menjadikan siangnya (terang benderang)."},{"n":30,"a":"وَالْاَرْضَ بَعْدَ ذٰلِكَ دَحٰىهَاۗ","l":"Wal-arḍa ba‘da żāl  mati dan tidak hidup. Di sisi lain, orang yang menyucikan diri beruntung, mengingat Tuhan, lalu salat.","memoryColor":"rose"},{"range":[16,19],"title":"Mini-story 4 — Dunia dan Suhuf","cue":"Dunia → Akhirat Lebih Kekal → Suhuf Terdahulu → Ibrahim–Musa","keywords":["Dunia","Akhirat Lebih Kekal","Suhuf Terdahulu","Ibrahim–Musa"],"memoryEmoji":"📚","memoryScene":"Dua papan pilihan muncul: dunia diutamakan, tetapi akhirat ditandai lebih baik dan kekal. Papan akhirat membuka lembaran terdahulu bertuliskan Ibrahim dan Musa.","memoryColor":"sand"}],"verses":[{"n":1,"a":"سَبِّحِ اسْمَ رَبِّكَ الْاَعْلَىۙ","l":"Sabbiḥisma rabbikal-a‘lā.","t":"Sucikanlah nama Tuhanmu Yang Maha Tinggi,"},{"n":2,"a":"الَّذِيْ خَلَقَ فَسَوّٰىۖ","l":"Allażī khalaqa fasawwā.","t":"yang menciptakan, lalu menyempurnakan (ciptaan-Nya),"},{"n":3,"a":"وَالَّذِيْ قَدَّرَ فَهَدٰىۖ","l":"Wal-lażī qaddara fahadā.","t":"yang menentukan kadar (masing-masing) dan memberi petunjuk,"},{"n":4,"a":"وَالَّذِيْٓ اَخْرَجَ الْمَرْعٰىۖ","l":"Wal-lażī akhrajal-mar‘ā.","t":"dan yang menumbuhkan (rerumputan) padang gembala,"},{"n":5,"a":"فَجَعَلَهٗ غُثَاۤءً اَحْوٰىۖ","l":"Fa ja‘alahū guṡā'an aḥwā.","t":"lalu menjadikannya kering kehitam-hitaman."},{"n":6,"a":"سَنُقْرِئُكَ فَلَا تَنْسٰىٓ ۖ","l":"Sanuqri'uka falā tansā.","t":"Kami akan membacakan (Al-Qur’an) kepadamu (Nabi Muhammad) sehingga engkau tidak akan lupa,"},{"n":7,"a":"اِلَّا مَا شَاۤءَ اللّٰهُ ۗاِنَّهٗ يَعْلَمُ الْجَهْرَ وَمَا يَخْفٰىۗ","l":"Illā mā syā'allāh(u), innahū ya‘lamul-jahra wa mā yakhfā.","t":"kecuali jika Allah menghendaki. Sesungguhnya Dia mengetahui yang terang dan yang tersembunyi."},{"n":8,"a":"وَنُيَسِّرُكَ لِلْيُسْرٰىۖ","l":"Wa nuyassiruka lil-yusrā.","t":"Kami akan melapangkan bagimu jalan kemudahan (dalam segala urusan)."},{"n":9,"a":"فَذَكِّرْ اِنْ نَّفَعَتِ الذِّكْرٰىۗ","l":"Fa żakkir in nafa‘atiż-żikrā.","t":"Maka, sampaikanlah peringatan jika peringatan itu bermanfaat."},{"n":10,"a":"سَيَذَّكَّرُ مَنْ يَّخْشٰىۙ","l":"Sayażżakkaru may yakhsyā.","t":"Orang yang takut (kepada Allah) akan mengambil pelajaran,"},{"n":11,"a":"وَيَتَجَنَّبُهَا الْاَشْقَىۙ","l":"Wa yatajannabuhal-asyqā.","t":"sedangkan orang-orang yang celaka (kafir) akan menjauhinya,"},{"n":12,"a":"الَّذِيْ يَصْلَى النَّارَ الْكُبْرٰىۚ","l":"Allażī yaṣlan-nāral-kubrā.","t":"(yaitu) orang yang akan memasuki api (neraka) yang besar."},{"n":13,"a":"ثُمَّ لَا يَمُوْتُ فِيْهَا وَلَا يَحْيٰىۗ","l":"Ṡumma lā yamūtu fīhā wa lā yaḥyā.","t":"Selanjutnya, dia tidak mati dan tidak (pula) hidup di sana."},{"n":14,"a":"قَدْ اَفْلَحَ مَنْ تَزَكّٰىۙ","l":"Qad aflaḥa man tazakkā.","t":"Sungguh, beruntung orang yang menyucikan diri (dari kekafiran)"},{"n":15,"a":"وَذَكَرَ اسْمَ رَبِّهٖ فَصَلّٰىۗ","l":"Wa żakarasma rabbihī fa ṣallā.","t":"dan mengingat nama Tuhannya, lalu dia salat."},{"n":16,"a":"بَلْ تُؤْثِرُوْنَ الْحَيٰوةَ الدُّنْيَاۖ","l":"Bal tu'ṡirūnal-ḥayātad-dun-yā.","t":"Adapun kamu (orang-orang kafir) mengutamakan kehidupan dunia,"},{"n":17,"a":"وَالْاٰخِرَةُ خَيْرٌ وَّاَبْقٰىۗ","l":"Wal-ākhiratu khairuw wa abqā.","t":"padahal kehidupan akhirat itu lebih baik dan lebih kekal."},{"n":18,"a":"اِنَّ هٰذَا لَفِى الصُّحُفِ الْاُوْلٰىۙ","l":"Inna hāżā lafiṣ-ṣuḥufil-ūlā.","t":"Sesungguhnya (penjelasan) ini terdapat dalam suhuf (lembaran-lembaran) yang terdahulu,"},{"n":19,"a":"صُحُفِ اِبْرٰهِيْمَ وَمُوْسٰى ࣖ","l":"Ṣuḥufi ibrāhīma wa mūsā.","t":"(yaitu) suhuf (yang diturunkan kepada) Ibrahim dan Musa."}],"movie":{"title":"Botol — Al-A'la Short Story","intro":"Lima ayat menjadi satu urutan: tasbih kepada Yang Maha Tinggi → penciptaan → ukuran dan petunjuk → padang gembala → kering kehitaman.","events":[{"n":1,"keyword":"Maha Tinggi","emoji":"🌱","place":"Maha Tinggi","text":"Pada Botol menyala tulisan MAHA TINGGI dan tanda TASBIH."},{"n":2,"keyword":"Mencipta–Menyempurnakan","emoji":"🌱","place":"Mencipta–Menyempurnakan","text":"Mesin membentuk ciptaan dengan sempurna."},{"n":3,"keyword":"Menentukan–Petunjuk","emoji":"🌱","place":"Menentukan–Petunjuk","text":" ","l":"lam yakunillażīna kafarụ min ahlil-kitābi wal-musyrikīna munfakkīna ḥattā ta`tiyahumul-bayyinah","t":"Orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik tidak akan meninggalkan (agama mereka) sampai datang kepada mereka bukti yang nyata,"},{"n":2,"a":"رَسُوْلٌ مِّنَ اللّٰهِ يَتْلُوْا صُحُفًا مُّطَهَّرَةًۙ","l":"rasụlum minallāhi yatlụ ṣuḥufam muṭahharah","t":"(yaitu) seorang Rasul dari Allah (Muhammad) yang membacakan lembaran-lembaran yang suci (Al-Qur'an),"},{"n":3,"a":"فِيْهَا كُتُبٌ قَيِّمَةٌ ۗ","l":"fīhā kutubung qayyimah","t":"di dalamnya terdapat (isi) kitab-kitab yang lurus (benar)."},{"n":4,"a":"وَمَا تَفَرَّقَ الَّذِيْنَ اُوْتُوا الْكِتٰبَ اِلَّا مِنْۢ بَعْدِ مَا جَاۤءَتْهُمُ الْبَيِّنَةُ ۗ","l":"wa mā tafarraqallażīna ụtul-kitāba illā mim ba'di mā jā`at-humul-bayyinah","t":"Dan tidaklah terpecah-belah orang-orang Ahli Kitab melainkan setelah datang kepada mereka bukti yang nyata."},{"n":5,"a":"وَمَآ اُمِرُوْٓا اِلَّا لِيَعْبُدُوا اللّٰهَ مُخْلِصِيْنَ لَهُ الدِّيْنَ ەۙ حُنَفَاۤءَ وَيُقِيْمُوا الصَّلٰوةَ وَيُؤْتُوا الزَّكٰوةَ وَذٰلِكَ دِيْنُ الْقَيِّمَةِۗ","l":"wa mā umirū illā liya'budullāha mukhliṣīna lahud-dīna ḥunafā`a wa yuqīmuṣ-ṣalāta wa yu`tuz-zakāta wa żālika dīnul-qayyimah","t":"Padahal mereka hanya diperintah menyembah Allah dengan ikhlas menaati-Nya semata-mata karena (menjalankan) agama, dan juga agar melaksanakan salat dan menunaikan zakat; dan yang demikian itulah agama yang lurus (benar)."},{"n":6,"a":"اِنَّ الَّذِيْنَ كَفَرُوْا مِنْ اَهْلِ الْكِتٰبِ وَالْمُشْرِكِيْنَ فِيْ نَارِ جَهَنَّمَ خٰلِدِيْنَ فِيْهَاۗ اُولٰۤىِٕكَ هُمْ شَرُّ الْبَرِيَّةِۗ","l":"innallażīna kafarụ min ahlil-kitābi wal-musyrikīna fī nāri jahannama khālidīna fīhā, ulā`ika hum syarrul-bariyyah","t":"Sungguh, orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik (akan masuk) ke neraka Jahanam; mereka kekal di dalamnya selama-lamanya. Mereka itu adalah sejahat-jahat makhluk."},{"n":7,"a":"اِنَّ الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الص ng tertulis.","memoryColor":"sky"},{"range":[21,25],"title":"Mini-story 5 — Kenikmatan","cue":"Disaksikan Didekatkan → Kenikmatan → Dipan → Wajah Nikmat → Minuman Murni","keywords":["Disaksikan Didekatkan","Kenikmatan","Dipan","Wajah Nikmat","Minuman Murni"],"memoryEmoji":"🌿","memoryScene":"Catatan Illiyyin disaksikan yang didekatkan; orang berbakti masuk ke kenikmatan, duduk di dipan, wajahnya tampak nikmat, lalu menerima minuman murni yang disegel.","memoryColor":"green"},{"range":[26,30],"title":"Mini-story 6 — Kesturi dan Ejekan","cue":"Kesturi → Tasnim → Mata Air → Pendosa Menertawakan → Saling Mengedip","keywords":["Kesturi","Tasnim","Mata Air","Pendosa Menertawakan","Saling Mengedip"],"memoryEmoji":"💧","memoryScene":"Segel minuman beraroma kesturi dan campurannya dari Tasnim, mata air bagi yang didekatkan. Adegan berganti kepada pendosa yang menertawakan orang beriman dan saling mengedip mengejek.","memoryColor":"soft"},{"range":[31,35],"title":"Mini-story 7 — Keadaan Berbalik","cue":"Kembali Bergembira → Menganggap Sesat → Bukan Penjaga → Mukmin Menertawakan → Dipan Menyaksikan","keywords":["Kembali Bergembira","Menganggap Sesat","Bukan Penjaga","Mukmin Menertawakan","Dipan Menyaksikan"],"memoryEmoji":"🔄","memoryScene":"Para pengejek kembali kepada kaumnya dengan gembira dan menuduh orang beriman sesat, padahal mereka bukan penjaga. Pada hari itu keadaan berbalik: mukmin menertawakan kafir dari dipan mereka.","memoryColor":"violet"},{"range":[36,36],"title":"Mini-story 8 — Balasan","cue":"Kafir Dibalas","keywords":["Kafir Dibalas"],"memoryEmoji":"✅","memoryScene":"Halaman terakhir bertanya apakah orang kafir telah dibalas atas apa yang mereka kerjakan.","memoryColor":"sand"}],"verses":[{"n":1,"a":"وَيْلٌ لِّلْمُطَفِّفِيْنَۙ","l":"Wailul lil-muṭaffifīn(a).","t":"Celakalah orang-orang yang curang (dalam menakar dan menimbang)!"},{"n":2,"a":"الَّذِيْنَ اِذَا اكْتَالُوْا عَلَى النَّاسِ يَسْتَوْفُوْنَۖ","l":"Allażīna iżaktālū ‘alan-nāsi yastaufūn(a).","t":"(Mereka adalah) orang-orang yang apabila menerima takaran dari orang lain, mereka minta dipenuhi."},{"n":3,"a":"وَاِذَا كَالُوْهُمْ اَوْ وَّزَنُوْهُمْ يُخْسِرُوْنَۗ","l":"Wa iżā kālūhum au wazanūhum yukhsirūn(a).","t":"(Sebaliknya,) apabila mereka menakar atau menimbang untuk orang lain, mereka kurangi."},{"n":4,"a":"اَلَا يَظُنُّ اُولٰۤىِٕكَ اَنَّهُمْ مَّبْعُوْثُوْنَۙ","l":"Alā yaẓunnu ulā’ika annahum mab‘ūṡūn(a).","t":"Tidakkah mereka mengira (bahwa) sesungguhnya mereka akan dibangkitkan"},{"n":5,"a":"لِيَوْمٍ عَظِيْمٍۙ","l":"Liyaumin ‘aẓīm(in).","t":"pada suatu hari yang besar (Kiamat),"},{"n":6,"a":"يَّوْمَ يَقُوْمُ النَّاسُ لِرَبِّ الْعٰلَمِيْنَۗ","l":"Yauma yaqūmun-nāsu lirabbil-‘ālamīn(a).","t":"(yaitu) hari (ketika) manusia bangkit menghadap Tuhan seluruh alam?"},{"n":7,"a":"كَلَّآ اِنَّ كِتٰبَ الْفُجَّارِ لَفِيْ سِجِّيْنٍۗ","l":"Kallā inna kitābal-fujjāri lafī sijjīn(in).","t":"Jangan sekali-kali begitu! Sesungguhnya catatan orang yang durhaka benar-benar (tersimpan) dalam Sijjīn."},{"n":8,"a":"وَمَآ اَدْرٰىكَ مَا سِجِّيْنٌۗ","l":"Wa mā adrāka mā sijjīn(un).","t":"Tahukah engkau apakah Sijjīn itu?"},{"n":9,"a":"كِتٰبٌ مَّرْقُوْمٌۗ","l":"Kitābum marqūm(un).","t":"(Sijjīn adalah) kitab yang berisi catatan (amal)."},{"n":10,"a":"وَيْلٌ يَّوْمَىِٕذٍ لِّلْمُكَذِّبِيْنَۙ","l":"Wailuy yauma’iżil lil-mukażżibīn(a).","t":"Celakalah pada hari itu bagi orang-orang yang mendustakan,"},{"n":11,"a":"الَّذِيْنَ يُكَذِّبُوْنَ بِيَوْمِ الدِّيْنِۗ","l":"Allażīna yukażżibūna biyaumid-dīn(i).","t":"(yaitu) orang-orang yang mendustakan hari Pembalasan."},{"n":12,"a":"وَمَا يُكَذِّبُ بِهٖٓ اِلَّا كُلُّ مُعْتَدٍ اَثِيْمٍۙ","l":"Wa mā yukażżibu bihī illā kullu mu‘tadin aṡīm(in).","t":"Tidak ada yang mendustakannya, kecuali setiap orang yang melampaui batas lagi sangat berdosa."},{"n":13,"a":"اِذَا تُتْلٰى عَلَيْهِ اٰيٰتُنَا قَالَ اَسَاطِيْرُ الْاَوَّلِيْنَۗ","l":"Iżā tutlā ‘alaihi āyātunā qāla asāṭīrul-awwalīn(a).","t":"Apabila dibacakan kepadanya ayat-ayat Kami, dia berkata, “(Itu adalah) dongeng orang-orang dahulu.”"},{"n":14,"a":"كَلَّا بَلْ ۜ رَانَ عَلٰى قُلُوْبِهِمْ مَّا كَانُوْا يَكْسِبُوْنَ","l":"Kallā bal rāna ‘alā qulūbihim mā kānū yaksibūn(a).","t":"Sekali-kali tidak! Bahkan, apa yang selalu mereka kerjakan itu telah menutupi hati mereka."},{"n":15,"a":"كَلَّآ اِنَّهُمْ عَنْ رَّبِّهِمْ يَوْمَىِٕذٍ لَّمَحْجُوْبُوْنَۗ","l":"Kallā innahum ‘ar rabbihim yauma’iżil lamaḥjūbūn(a).","t":"Sekali-kali tidak! Sesungguhnya mereka pada hari itu benar-benar terhalang dari (melihat) Tuhannya."},{"n":16,"a":"ثُمَّ اِنَّهُمْ لَصَالُوا الْجَحِيْمِۗ","l":"Ṡumma innahum laṣālul-jaḥīm(i).","t":"Kemudian, sesungguhnya mereka benar-benar masuk neraka."},{"n":17,"a":"ثُمَّ يُقَالُ هٰذَا الَّذِيْ كُنْتُمْ بِهٖ تُكَذِّبُوْنَۗ","l":"Ṡumma yuqālu hāżallażī kuntum bihī tukażżibūn(a).","t":"Kemudian, dikatakan (kepada mereka), “Inilah (azab) yang dahulu selalu kamu dustakan.”"},{"n":18,"a":"كَلَّآ اِنَّ كِتٰبَ الْاَبْرَارِ لَفِيْ عِلِّيِّيْنَۗ","l":"Kallā inna kitābal-abrāri lafī ‘illiyyīn(a).","t":"Jangan sekali-kali begitu! Sesungguhnya catatan orang-orang yang berbakti benar-benar tersimpan dalam ‘Illiyyīn."},{"n":19,"a":"وَمَآ اَدْرٰىكَ مَا عِلِّيُّوْنَۗ","l":"Wa mā adrāka mā ‘illiyyūn(a).","t":"Tahukah engkau apakah ‘Illiyyīn itu?"},{"n":20,"a":"كِتٰبٌ مَّرْقُوْمٌۙ","l":"Kitābum marqūm(un).","t":"(Itulah) kitab yang berisi catatan (amal),"},{"n":21,"a":"يَّشْهَدُهُ الْمُقَرَّبُوْنَۗ","l":"Yasyhaduhul-muqarrabūn(a).","t":"yang disaksikan oleh (malaikat-malaikat) yang didekatkan (kepada Allah)."},{"n":22,"a":"اِنَّ الْاَبْرَارَ لَفِيْ نَعِيْمٍۙ","l":"Innal-abrāra lafī na‘īm(in).","t":"Sesungguhnya orang-orang yang berbakti benar-benar berada dalam (surga yang penuh) kenikmatan."},{"n":23,"a":"عَلَى الْاَرَاۤىِٕكِ يَنْظُرُوْنَۙ","l":"‘Alal-arā’iki yanẓurūn(a).","t":"Mereka (duduk) di atas dipan-dipan melepas pandangan."},{"n":24,"a":"تَعْرِفُ فِيْ وُجُوْهِهِمْ نَضْرَةَ النَّعِيْمِۚ","l":"Ta‘rifu fī wujūhihim naḍratan-na‘īm(i).","t":"Kamu dapat mengetahui dari wajah mereka kesenangan hidup yang penuh kenikmatan."},{"n":25,"a":"يُسْقَوْنَ مِنْ رَّحِيْقٍ مَّخْتُوْمٍۙ","l":"Yusqauna mir raḥīqim makhtūm(in).","t":"Mereka diberi minum dari khamar murni (tidak memabukkan) yang (tempatnya) masih dilak (disegel)."},{"n":26,"a":"خِتٰمُهٗ مِسْكٌ ۗ وَفِيْ ذٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُوْنَۗ","l":"Khitāmuhū misk(un), wa fī żālika falyatanāfasil-mutanāfisūn(a).","t":"Laknya terbuat dari kesturi. Untuk (mendapatkan) yang demikian itu hendaknya orang berlomba-lomba."},{"n":27,"a":"وَمِزَاجُهٗ مِنْ تَسْنِيْمٍۙ","l":"Wa mizājuhū min tasnīm(in).","t":"Campurannya berasal dari Tasnim,"},{"n":28,"a":"عَيْنًا يَّشْرَبُ بِهَا الْمُقَرَّبُوْنَۗ","l":"‘Ainay yasyrabu bihal-muqarrabūn(a).","t":"(yaitu) mata air yang diminum oleh mereka yang didekatkan (kepada Allah)."},{"n":29,"a":"اِنَّ الَّذِيْنَ اَجْرَمُوْا كَانُوْا مِنَ الَّذِيْنَ اٰمَنُوْا يَضْحَكُوْنَۖ","l":"Innallażīna ajramū kānū minallażīna āmanū yaḍḥakūn(a).","t":"Sesungguhnya orang-orang yang berdosa dahulu selalu menertawakan orang-orang yang beriman."},{"n":30,"a":"وَاِذَا مَرُّوْا بِهِمْ يَتَغَامَزُوْنَۖ","l":"Wa iżā marrū bihim yatagāmazūn(a).","t":"Apabila mereka (orang-orang beriman) berlalu di hadapan mereka, mereka saling mengedip-ngedipkan mata (untuk mengejek)."},{"n":31,"a":"وَاِذَا انْقَلَبُوْٓا اِلٰٓى اَهْلِهِمُ انْقَلَبُوْا فَكِهِيْنَۖ","l":"Wa iżanqalabū ilā ahlihimunqalabū fakihīn(a).","t":"Apabila kembali kepada kaumnya, mereka kembali dengan gembira ria."},{"n":32,"a":"وَاِذَا رَاَوْهُمْ قَالُوْٓا اِنَّ هٰٓؤُلَاۤءِ لَضَاۤلُّوْنَۙ","l":"Wa iżā ra’auhum qālū inna hā’ulā’i laḍāllūn(a).","t":"Apabila melihat (orang-orang mukmin), mereka mengatakan, “Sesungguhnya mereka benar-benar orang-orang sesat,”"},{"n":33,"a":"وَمَآ اُرْسِلُوْا عَلَيْهِمْ حٰفِظِيْنَۗ","l":"Wa mā ursilū ‘alaihim ḥāfiẓīn(a).","t":"padahal (orang-orang yang berdosa itu) tidak diutus sebagai penjaga (orang-orang mukmin)."},{"n":34,"a":"فَالْيَوْمَ الَّذِيْنَ اٰمَنُوْا مِنَ الْكُفَّارِ يَضْحَكُوْن const REVIEW_DAYS=[1,3,7,14,30];
const STAGE_LABEL=['Baru','Sudah dibaca','Dengan bantuan','Tanpa melihat','Lulus Bridge','Hafal kuat'];
let route={screen:'home',surah:null,tab:'journey'};

function load(k,d){try{let x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let prefs=load(KEYS.prefs,load('mfq30_prefs_v01',{latin:true,translation:true}));
if(typeof prefs.keyword==='undefined')prefs.keyword=true;
function migrateV01(){if(load(KEYS.migrated,false))return;let old=load('mfq30_progress_v01',{}),m=load(KEYS.mastery,{});Object.keys(old).forEach(k=>{if(old[k]&&!m[k])m[k]={stage:2}});save(KEYS.mastery,m);save(KEYS.migrated,true)}
migrateV01();
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(dateStr,n){let [y,m,d]=dateStr.split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function mastery(){return load(KEYS.mastery,{})}
function rec(sn,an){return mastery()[sn+'-'+an]||{stage:0}}
function setRec(sn,an,obj){let m=mastery(),k=sn+'-'+an;m[k]=Object.assign({},m[k]||{stage:0},obj);save(KEYS.mastery,m)}
function ensureSchedule(r){if((r.stage||0)>=3&&!r.masteredAt){r.masteredAt=today();r.reviewIndex=0;r.nextReview=addDays(r.masteredAt,REVIEW_DAYS[0])}return r}
function setStage(sn,an,stage){let r=rec(sn,an);r.stage=Math.max(r.stage||0,stage);r=ensureSchedule(r);setRec(sn,an,r)}
function reviewPass(sn,an){let r=ensureSchedule(rec(sn,an));r.stage=Math.max(r.stage||0,5);r.lastReview=today();let idx=Number.isInteger(r.reviewIndex)?r.reviewIndex:0;idx++;r.reviewIndex=idx;r.nextReview=idx<REVIEW_DAYS.length?addDays(r.masteredAt,REVIEW_DAYS[idx]):null;setRec(sn,an,r)}
function reviewFail(sn,an){let r=ensureSchedule(rec(sn,an));r.lastReview=today();r.nextReview=addDays(today(),1);setRec(sn,an,r)}
function dueItems(sn=null){let out=[];Object.values(SURAH).forEach(s=>{if(sn&&s.number!=sn)return;s.verses.forEach(v=>{let r=rec(s.number,v.n);if((r.stage||0)>=3&&r.nextReview&&r.nextReview<=today())out.push({sn:s.number,an:v.n,due:r.nextReview})})});return out}
function masteryPct(sn){let s=SURAH[sn],sum=s.verses.reduce((a,v)=>a+(rec(sn,v.n).stage||0),0);return Math.round(sum/(s.verses.length*5)*100)}
function strongCount(sn){return SURAH[sn].verses.filter(v=>(rec(sn,v.n).stage||0)>=5).length}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function kw(sn,an){return (KEYWORD_MAP[String(sn)]||{})[String(an)]||null}
function hl(text,term){text=String(text??'');term=String(term??'');if(!prefs.keyword||!term)return esc(text);let low=text.toLocaleLowerCase(),tl=term.toLocaleLowerCase(),i=low.indexOf(tl);if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark class="kw">'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length))}
function keywordBadge(sn,an){let k=kw(sn,an);return k?`<span class="kw-label">🔑 ${esc(k.label)}</span>`:''}
function keywordMapRows(s,c){let vs=s.verses.filter(v=>v.n>=c.range[0]&&v.n<=c.range[1]);return `<div class="kw-map">${vs.map(v=>{let k=kw(s.number,v.n);return k?`<div class="kw-row"><div class="kw-row-head"><b>Ayat ${v.n}</b><span class="kw-label">🔑 ${esc(k.label)}</span></div><div class="kw-frags"><div class="ka">${esc(k.a)}</div><div><i>${esc(k.l)}</i></div><div>${esc(k.t)}</div></div></div>`:''}).join('')}</div>`}
function arabicTrigger(a,n=2){return a.trim().split(/\s+/).slice(0,n).join(' ')}
function tailArabic(a,n=3){let w=a.trim().split(/\s+/);return w.slice(-Math.min(n,w.length)).join(' ')}
function rand(max){return Math.floor(Math.random()*max)}
function header(back=false,title='MFQ Juz 30'){return `<div class="header">${back?'<button class="back" onclick="goHome()">← Beranda</button>':'<div class="logo">MFQ</div>'}<div><h1>${title}</h1><div class="sub">Eksperimen hafalan • Qur’an Kemenag RI • v1.8</div></div></div>`}
function toggleHowto(){let p=document.getElementById('howtoPanel');if(!p)return;p.classList.toggle('hidden');if(!p.classList.contains('hidden'))setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'start'}),0)}
function sourceBlock(){return `<div class="source"><b>Baseline Qur’an:</b> Kementerian Agama Republik Indonesia. Teks Arab, transliterasi Latin, dan terjemahan surat tambahan divalidasi terhadap Qur’an Kemenag; tampilan data pembanding menggunakan sumber yang menyatakan data Al-Qur’annya berasal dari Kemenag RI. <b>MFQ Official Anchor:</b> MFQ v3.2 FINAL. <b>Memory Movie</b>, Short Story, Kata Kunci, Arabic Trigger, latihan, dan sistem mastery adalah lapisan eksperimen dan tidak mengubah Official Object/Scene/Story/Meaning MFQ.<br><br><b>Catatan penting:</b> Cerita Hafalan adalah mnemonic visual untuk urutan ayat, <b>bukan tafsir</b> dan bukan penggambaran hakikat perkara gaib. Audio belum diaktifkan agar prototipe tetap ringan. Validasi akhir langsung terhadap sumber resmi Kemenag tetap wajib sebelum distribusi publik.</div>`}

<section class="card howto-launch"><div class="toprow"><div><b>Baru pertama menggunakan aplikasi?</b><div class="meta">Panduan singkat tersedia bila diperlukan.</div></div><button class="btn alt" onclick="toggleHowto()">ⓘ Cara Menggunakan</button></div></section>
<section id="howtoPanel" class="card howto hidden"><div class="toprow"><div><span class="badge">CARA MENGGUNAKAN</span><h2 style="margin-top:8px">Mulai dari sini 👇</h2></div><button class="chip" onclick="toggleHowto()" aria-label="Tutup panduan">Tutup ×</button></div><p class="howto-intro">Tidak perlu mempelajari semua menu. Ikuti alur ini; aplikasi akan mengurangi bantuan sedikit demi sedikit sampai ayat dapat dilafalkan tanpa melihat.</p><div class="howto-grid">

<div class="howto-step"><div class="howto-num">2</div><div><b>Baca Short Story terlebih dahulu</b><p>Lihat Official Object MFQ sebagai pintu masuk, lalu ikuti mini-story dari awal sampai akhir. Ingat <b>urutan kejadian</b>; kata kunci hanya penanda ayat, bukan daftar baru untuk dihafal.</p></div></div>

<div class="howto-step"><div class="howto-num">5</div><div><b>Uji Recall</b><p>Coba mulai bukan hanya dari ayat pertama. Aplikasi menguji <b>Forward, Position, dan Bridge Recall</b> agar hafalan tidak bergantung pada satu jalur.</p></div></div>
<div class="howto-step"><div class="howto-num">6</div><div><b>Lakukan murajaah saat muncul di Beranda</b><p>Bila ada kartu <b>Murajaah Hari Ini</b>, kerjakan terlebih dahulu. Jadwal pengulangan mengikuti siklus H0 → H1 → H3 → H7 → H14 → H30.</p></div></div>

function levelSection(title,subtitle,ids){return `<section class="level-block"><div class="level-head"><h2>${title}</h2><small>${subtitle}</small></div><div class="surah-list">${ids.map(n=>surahCard(SURAH[n])).join('')}</div></section>`}
function surahCard(s){let p=masteryPct(s.number);return `<section class="card surah-card"><div class="obj">${s.objectEmoji}</div><div onclick="openSurah(${s.number})"><span class="badge">${s.level}</span><h3>${s.name} <small class="muted">${s.number}</small></h3><div class="meta">${s.verses.length} ayat • MFQ ${s.mfq.object} (${s.mfq.code}) • ${strongCount(s.number)} hafal kuat</div><div class="progress-line"><i style="width:${p}%"></i></div></div><button class="arrow" onclick="openSurah(${s.number})" aria-label="Buka">›</button></section>`}
function goHome(){route={screen:'home',surah:null,tab:'journey'};guideState=null;reviewState=null;movieState=null;window.scrollTo(0,0);render()}
function openSurah(n){route={screen:'surah',surah:n,tab:'journey'};window.scrollTo(0,0);render()}
function setTab(t){route.tab=t;render();setTimeout(()=>window.scrollTo({top:80,behavior:'smooth'}),0)}
function tabs(){let ts=[['journey','Short Story'],['ayat','Ayat'],['bridge','Bridge'],['recall','Recall'],['progress','Progress']];return `<div class="tabs">${ts.map(([k,l])=>`<button class="tab ${route.tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`}
function nextGuideAyah(sn){let s=SURAH[sn],v=s.verses.find(x=>(rec(sn,x.n).stage||0)<3);if(v)return v.n;v=s.verses.find(x=>(rec(sn,x.n).stage||0)<5);return v?v.n:1}
function surahView(){let s=SURAH[route.surah],p=masteryPct(s.number),next=nextGuideAyah(s.number);return `${header(true)}<section class="card hero"><div class="toprow"><span class="badge">${s.level} • ${s.difficulty}</span><span style="font-size:12px">${p}% mastery</span></div><h2>${s.name} <span style="opacity:.55">${s.number}</span></h2><p>${s.verses.length} ayat • Jangkar MFQ: ${s.objectEmoji} ${s.mfq.object} • ${strongCount(s.number)} ayat hafal kuat</p></section>
<section class="card startbox"><h3>▶ Mulai / Lanjut Menghafal</h3><p>Sebelum menghafal, ingat kembali alur cerita. Lalu aplikasi membawa dari ayat ${next}: <b>adegan → ayat → recall → sambungkan</b>.</p><div class="controls"><button class="btn gold" onclick="startMovie(${s.number})">🧠 Baca Short Story</button><button class="btn" onclick="startGuide(${s.number})">Mulai ayat ${next}</button></div></section>${tabs()}${tabContent(s)}${sourceBlock()}`}
function tabContent(s){if(route.tab==='journey')return journey(s);if(route.tab==='ayat')return ayatList(s);if(route.tab==='bridge')return bridge(s);if(route.tab==='recall')return recallView(s);return progressView(s)}
function journey(s){return `<section class="card official"><div class="official-label">MFQ Official Anchor • v3.2 FINAL</div><div class="anchor-grid"><div class="mini"><b>MFQ Code</b>${s.mfq.code}</div><div class="mini"><b>Official Object</b>${s.objectEmoji} ${s.mfq.object}</div><div class="mini"><b>Official Meaning</b>${s.mfq.meaning}</div><div class="mini"><b>Surah</b>${s.number}. ${s.name}</div></div><p class="quote"><b>Official Scene:</b> ${esc(s.mfq.scene)}</p><p class="quote"><b>Official Story:</b> ${esc(s.mfq.story)}</p></section>
<section class="card movie-launch"><span class="story-label">🧠 Short Story Hafalan • Eksperimen</span><h2 class="movie-title">${esc(s.movie.title)}</h2><p class="quote">${esc(s.movie.intro)}</p><div class="mnemonic-warning">Cerita ini hanya <b>jalur memori</b>. Ia tidak menggantikan makna ayat, tafsir, atau bacaan Al-Qur’an. Jika ada <b>jembatan mnemonic</b>, bagian itu adalah alat penghubung ingatan dan bukan makna literal ayat.</div><div class="kw-help"><b>🔑 Keyword Mapping:</b> setiap keyword dipetakan pada tiga lapisan yang dapat dilihat pengguna: <b>Arab → Latin → terjemahan Indonesia</b>. Highlight dapat dimatikan ketika hafalan mulai kuat.</div><div class="notice" style="margin-top:9px"><b>Jangan hafalkan kalimat cerita.</b> Pegang hanya kata kunci dan urutan peristiwanya. Cerita hanyalah jembatan menuju ayat.</div><button class="btn gold full" style="margin-top:12px" onclick="startMovie(${s.number})">▶ Baca mini-story dari awal</button><details class="details-map"><summary>Lihat ringkasan peta setelah memahami cerita</summary><div class="cue"><b>Peta kompresi:</b> ${esc(s.movie.summary)}</div></details></section>
<div class="notice" style="margin-bottom:10px"><b>Mini-story:</b> pegang kata kunci dan urutan kejadiannya. Setiap mini-story dibuat sesingkat mungkin dan tetap tersambung dengan mini-story berikutnya.</div>${s.chunks.map((c,i)=>stationCard(s,c,i)).join('')}`}
function stationCard(s,c,i){let vs=s.verses.filter(v=>v.n>=c.range[0]&&v.n<=c.range[1]),ev=s.movie.events.filter(e=>e.n>=c.range[0]&&e.n<=c.range[1]);return `<section class="card station ${c.memoryColor||'soft'}"><div class="station-icon">${c.memoryEmoji||'🧠'}</div><div><div class="range">Mini-story ${i+1} • Ayat ${c.range[0]}–${c.range[1]}</div><h3>${esc(c.title)}</h3><div class="triggers" style="margin:8px 0">${ev.map(e=>`<span class="chip">${e.n} · ${esc(e.keyword||e.place)}</span>`).join('')}</div><div class="scene">${esc(c.memoryScene)}</div><details class="details-map"><summary>🔑 Lihat peta keyword Arab–Latin–Arti</summary>${keywordMapRows(s,c)}<div class="kw-help">Bagian yang disorot adalah <b>jembatan memori</b>, bukan pengganti makna lengkap ayat. Jika satu keyword merupakan konsep/frasa, yang ditandai adalah fragmen ayat yang paling langsung mewakilinya.</div></details><details class="details-map"><summary>Lihat Arabic Trigger (opsional)</summary><div class="triggers">${vs.map(v=>`<span class="trigger" title="Ayat ${v.n}">${v.n} · ${esc(arabicTrigger(v.a,2))}</span>`).join('')}</div></details><button class="chip" style="margin-top:10px" onclick="startGuide(${s.number},${c.range[0]})">Mulai mini-story ini →</button></div></section>`}
function eventFor(s,an){return s.movie.events.find(e=>e.n===an)||s.movie.events[0]}
function startMovie(sn,an=1){let s=SURAH[sn],ci=s.chunks.findIndex(c=>Number(an)>=c.range[0]&&Number(an)<=c.range[1]);movieState={sn:Number(sn),idx:Math.max(0,ci),full:false};route={screen:'movie',surah:Number(sn),tab:'journey'};window.scrollTo(0,0);render()}
function movieMove(d){let s=SURAH[movieState.sn];movieState.idx=Math.max(0,Math.min(s.chunks.length-1,movieState.idx+d));window.scrollTo({top:0,behavior:'smooth'});render()}
function movieJump(i){movieState.idx=i;render()}
function movieFull(){movieState.full=!movieState.full;render()}
function movieView(){let s=SURAH[movieState.sn],c=s.chunks[movieState.idx],ev=s.movie.events.filter(e=>e.n>=c.range[0]&&e.n<=c.range[1]),first=movieState.idx===0,last=movieState.idx===s.chunks.length-1;return `${header(true,'Short Story')}<section class="card movie-stage"><span class="story-label">${s.objectEmoji} ${esc(s.mfq.object)} • ${esc(s.movie.title)}</span><div class="movie-emoji">${c.memoryEmoji||'🧠'}</div><div class="movie-place">Mini-story ${movieState.idx+1} • Ayat ${c.range[0]}–${c.range[1]}</div><div class="triggers" style="justify-content:center;margin:12px 0">${ev.map(e=>`<span class="chip">${e.n} · ${esc(e.keyword||e.place)}</span>`).join('')}</div><div class="movie-text">${esc(c.memoryScene)}</div><div class="score">Ingat urutan peristiwa, bukan kalimat persisnya.</div></section><div class="movie-trail">${s.chunks.map((x,i)=>`<button class="movie-dot ${i<movieState.idx?'done':''} ${i===movieState.idx?'now':''}" onclick="movieJump(${i})" title="Mini-story ${i+1}: ayat ${x.range[0]}-${x.range[1]}">${i+1}</button>`).join('')}</div><div class="movie-controls"><button class="btn alt" ${first?'disabled':''} onclick="movieMove(-1)">← Mini-story sebelumnya</button>${last?`<button class="btn gold" onclick="startGuide(${s.number},1)">Mulai hafalkan ayat →</button>`:`<button class="btn" onclick="movieMove(1)">Mini-story berikutnya →</button>`}</div><section class="card" style="margin-top:12px"><button class="chip" onclick="movieFull()">${movieState.full?'Sembunyikan':'Baca'} semua short story</button>${movieState.full?`<div class="movie-full" style="margin-top:12px">${s.chunks.map((x,i)=>`<p><b>${i+1}. Ayat ${x.range[0]}–${x.range[1]}:</b> ${esc(x.memoryScene)}</p>`).join('')}</div>`:''}</section><div class="mnemonic-warning"><b>Aturan:</b> jangan hafalkan teks cerita. Cukup bayangkan urutan kejadian dari kata kunci ke kata kunci. Setelah ayat kuat, biarkan cerita memudar.</div><button class="back" onclick="openSurah(${s.number})">← Kembali ke surah</button>${sourceBlock()}`}
function prefsBar(){return `<div class="toolbar" style="margin-bottom:11px"><button class="chip ${prefs.keyword?'active':''}" onclick="togglePref('keyword')">🔑 Keyword ${prefs.keyword?'✓':''}</button><button class="chip ${prefs.latin?'active':''}" onclick="togglePref('latin')">Latin ${prefs.latin?'✓':''}</button><button class="chip ${prefs.translation?'active':''}" onclick="togglePref('translation')">Arti ${prefs.translation?'✓':''}</button><button class="chip" onclick="focusMode()">Mode Fokus</button></div>`}
function togglePref(k){prefs[k]=!prefs[k];save(KEYS.prefs,prefs);render()}
function focusMode(){prefs={latin:false,translation:false,keyword:false};save(KEYS.prefs,prefs);render()}
function ayatList(s){return `${prefsBar()}<div class="notice" style="margin-bottom:10px">Daftar ayat untuk referensi. Untuk proses hafalan utama gunakan tombol <b>Mulai/Lanjut Menghafal</b>, agar bantuan dikurangi bertahap.</div>${s.verses.map(v=>ayahCard(s,v)).join('')}`}
function ayahCard(s,v){let st=rec(s.number,v.n).stage||0,k=kw(s.number,v.n);return `<article class="card ayah"><div class="ayah-head"><span class="anum">${v.n}</span><span class="stage-tag s${st}">${STAGE_LABEL[st]}</span></div>${keywordBadge(s.number,v.n)}<div class="arabic">${k?hl(v.a,k.a):esc(v.a)}</div><div class="latin ${prefs.latin?'':'hidden'}">${k?hl(v.l,k.l):esc(v.l)}</div><div class="translation ${prefs.translation?'':'hidden'}">${k?hl(v.t,k.t):esc(v.t)}</div>${v.note&&prefs.translation?`<div class="footnote">${esc(v.note)}</div>`:''}</article>`}
function stationFor(s,an){let idx=s.chunks.findIndex(c=>an>=c.range[0]&&an<=c.range[1]);return {idx:Math.max(0,idx),c:s.chunks[Math.max(0,idx)]}}
function startGuide(sn,an=null){let s=SURAH[sn];guideState={sn:Number(sn),an:an||nextGuideAyah(sn),phase:'read',revealed:false};route={screen:'guide',surah:Number(sn),tab:'journey'};window.scrollTo(0,0);render()}
function guidePhase(p){guideState.phase=p;guideState.revealed=false;render()}
function guideAdvance(){let s=SURAH[guideState.sn],cur=guideState.an;if(cur>=s.verses.length){route={screen:'surah',surah:s.number,tab:'progress'};guideState=null;render();return}guideState={sn:s.number,an:cur+1,phase:'read',revealed:false};render()}
function guideView(){let s=SURAH[guideState.sn],v=s.verses[guideState.an-1],sf=stationFor(s,v.n),c=sf.c,st=rec(s.number,v.n).stage||0;let body='';if(guideState.phase==='read'){body=`<div class="guide-step">Langkah 1 • Lihat & baca</div><h2 class="guide-title">Kenali ayat ${v.n}</h2><div style="margin-bottom:8px">${keywordBadge(s.number,v.n)}</div><div class="guide-box"><div class="arabic">${(()=>{let k=kw(s.number,v.n);return k?hl(v.a,k.a):esc(v.a)})()}</div><div class="latin">${(()=>{let k=kw(s.number,v.n);return k?hl(v.l,k.l):esc(v.l)})()}</div><div class="translation">${(()=>{let k=kw(s.number,v.n);return k?hl(v.t,k.t):esc(v.t)})()}</div></div><div class="notice">Baca perlahan <b>3 kali</b>. Latin adalah bantuan, bukan pengganti belajar bacaan yang benar.</div><button class="btn full big" style="margin-top:12px" onclick="setStage(${s.number},${v.n},1);guidePhase('assist')">Sudah dibaca 3× →</button>`}
else if(guideState.phase==='assist'){body=`<div class="guide-step">Langkah 2 • Kurangi bantuan</div><h2 class="guide-title">Ayat ${v.n} dengan teks Arab</h2><div style="margin-bottom:8px">${keywordBadge(s.number,v.n)}</div><div class="guide-box"><div class="arabic">${(()=>{let k=kw(s.number,v.n);return k?hl(v.a,k.a):esc(v.a)})()}</div></div><div class="cue"><b>Arabic Trigger:</b> <span class="arabic" style="font-size:24px;text-align:left;display:inline">${esc(arabicTrigger(v.a,2))}</span></div><p class="hint">Baca lagi 3×. Perhatikan bunyi awal ayat sebagai pemicu, bukan sebagai mnemonic pengganti lafaz.</p><button class="btn full big" onclick="setStage(${s.number},${v.n},2);guidePhase('recall')">Sekarang coba tanpa melihat →</button>`}
else if(guideState.phase==='recall'){body=`<div class="guide-step">Langkah 3 • Recall</div><h2 class="guide-title">Ucapkan ayat ${v.n} tanpa melihat</h2><div class="guide-box covered"><div><div class="covered-icon">🧠</div><div class="hint">Pemicu awal</div><div class="arabic" style="font-size:26px;text-align:center">${esc(arabicTrigger(v.a,2))}</div></div></div>${guideState.revealed?`<div class="answer">${keywordBadge(s.number,v.n)}<div class="arabic">${(()=>{let k=kw(s.number,v.n);return k?hl(v.a,k.a):esc(v.a)})()}</div><div class="latin">${(()=>{let k=kw(s.number,v.n);return k?hl(v.l,k.l):esc(v.l)})()}</div></div><div class="controls"><button class="btn alt" onclick="guidePhase('assist')">Belum lancar</button><button class="btn" onclick="setStage(${s.number},${v.n},3);${v.n>c.range[0]?"guidePhase('chain')":"guideAdvance()"}">Bisa tanpa melihat ✓</button></div>`:`<button class="btn gold full" onclick="guideState.revealed=true;render()">Tampilkan untuk cek</button>`}`}
else{let prev=s.verses[v.n-2];body=`<div class="guide-step">Langkah 4 • Chain & Bridge</div><h2 class="guide-title">Sambungkan ayat ${v.n-1} → ${v.n}</h2><div class="prompt"><div class="hint">Akhir ayat ${v.n-1}</div><div class="arabic">${esc(tailArabic(prev.a))}</div><div class="hint">Lanjutkan ayat berikutnya, lalu ulang dari ayat ${c.range[0]} sampai ${v.n} tanpa melihat.</div></div>${guideState.revealed?`<div class="answer"><div class="arabic">${esc(v.a)}</div></div><div class="controls"><button class="btn alt" onclick="guidePhase('recall')">Ulangi</button><button class="btn" onclick="setStage(${s.number},${v.n},4);guideAdvance()">Bridge & chain lancar ✓</button></div>`:`<button class="btn gold full" onclick="guideState.revealed=true;render()">Cek ayat ${v.n}</button>`}`}
let me=eventFor(s,v.n);return `${header(true,'Mode Menghafal')}<section class="card checkpoint"><div class="guide-head"><div class="station-icon">${me.emoji}</div><div><div class="range">Ayat ${v.n} • Mini-story ${sf.idx+1}</div><b>${esc(me.keyword||me.place)}</b></div></div><div class="scene-link"><b>Kata kunci ayat ${v.n}:</b> ${esc(me.keyword||me.place)}<br><span class="hint">Mini-story: ${esc(c.memoryScene)}</span></div>${v.n>1?`<div class="hint">Ingat kata kunci sebelumnya → kata kunci ini → lalu lafalkan ayat ${v.n}.</div>`:''}</section><section class="card">${body}<div class="stagebar">${[1,2,3,4,5].map(x=>`<span class="${st>=x?'on':''}"></span>`).join('')}</div><div class="score">Status ayat ${v.n}: ${STAGE_LABEL[rec(s.number,v.n).stage||0]}</div></section><button class="back" onclick="openSurah(${s.number})">← Keluar dari mode menghafal</button>${sourceBlock()}`}
function bridgeCandidates(s){let arr=[];for(let n=2;n<=s.verses.length;n++){let boundary=s.chunks.some(c=>c.range[0]===n);arr.push(n);if(boundary){arr.push(n,n)}}return arr}
function bridgeQuestion(s,newQ=false){let k='b'+s.number;if(newQ||!practiceState[k]){let c=bridgeCandidates(s);practiceState[k]=c[rand(c.length)]}let n=practiceState[k];return {prev:s.verses[n-2],next:s.verses[n-1],boundary:s.chunks.some(c=>c.range[0]===n)}}
function bridge(s){let q=bridgeQuestion(s);return `${prefsBar()}<section class="card"><span class="badge">AYAT BRIDGE ${q.boundary?'• BATAS MINI-STORY':''}</span><h3>Apa awal ayat berikutnya?</h3><div class="prompt"><div class="hint">Akhir ayat ${q.prev.n}</div><div class="arabic">${esc(tailArabic(q.prev.a))}</div></div><div id="bridgeAns" class="answer hidden">${keywordBadge(s.number,q.next.n)}<div class="arabic">${(()=>{let k=kw(s.number,q.next.n);return k?hl(q.next.a,k.a):esc(q.next.a)})()}</div><div class="latin ${prefs.latin?'':'hidden'}">${(()=>{let k=kw(s.number,q.next.n);return k?hl(q.next.l,k.l):esc(q.next.l)})()}</div></div><button class="btn gold full" onclick="document.getElementById('bridgeAns').classList.remove('hidden')">Cek Jawaban</button><div class="controls" style="margin-top:8px"><button class="btn alt" onclick="newBridge(${s.number})">Belum / soal baru</button><button class="btn" onclick="bridgePass(${s.number},${q.next.n})">Bisa menyambung ✓</button></div><p class="score">Batas antar-mini-story muncul lebih sering karena biasanya di situlah posisi mudah terputus.</p></section>`}
function newBridge(sn){bridgeQuestion(SURAH[sn],true);render()}
function bridgePass(sn,an){setStage(sn,an,4);bridgeQuestion(SURAH[sn],true);render()}
function recallQuestion(s,newQ=false){let k='r'+s.number;if(newQ||!practiceState[k]){let modes=['forward','position','bridge'],mode=modes[rand(modes.length)],n=1+rand(s.verses.length);if(mode==='bridge'&&n===1)n=2;practiceState[k]={mode,n}}return practiceState[k]}
function recallView(s){let q=recallQuestion(s),v=s.verses[q.n-1],sf=stationFor(s,v.n),prev=s.verses[Math.max(0,v.n-2)],title,prompt;if(q.mode==='forward'){title='Forward Recall';prompt=`<div class="hint">Mulai dari ayat ${v.n}. Pemicu awal:</div><div class="arabic">${esc(arabicTrigger(v.a,2))}</div><div class="hint">Lafalkan ayat ini lalu teruskan sejauh yang mampu.</div>`}else if(q.mode==='position'){title='Position Recall';prompt=`<div class="hint">Kata kunci ayat ${v.n}: <b>${esc(eventFor(s,v.n).keyword||eventFor(s,v.n).place)}</b><br><br>Ayat apa yang terhubung dengan kata kunci ini?</div>`}else{title='Bridge Recall';prompt=`<div class="hint">Setelah akhir ayat ${prev.n}:</div><div class="arabic">${esc(tailArabic(prev.a))}</div><div class="hint">Lanjutkan ayat berikutnya.</div>`}return `${prefsBar()}<section class="card"><span class="badge">3-MODE RECALL</span><h3>${title}</h3><div class="prompt">${prompt}</div><div id="recallAns" class="answer hidden">${keywordBadge(s.number,v.n)}<div class="arabic">${(()=>{let k=kw(s.number,v.n);return k?hl(v.a,k.a):esc(v.a)})()}</div><div class="latin ${prefs.latin?'':'hidden'}">${(()=>{let k=kw(s.number,v.n);return k?hl(v.l,k.l):esc(v.l)})()}</div></div><button class="btn gold full" onclick="document.getElementById('recallAns').classList.remove('hidden')">Cek Jawaban</button><div class="controls" style="margin-top:8px"><button class="btn alt" onclick="newRecall(${s.number})">Belum lancar</button><button class="btn" onclick="recallPass(${s.number},${v.n})">Lancar ✓</button></div><p class="score">Tidak ada tes dari terjemahan. Recall sekarang menguji posisi, pemicu lafaz, dan sambungan ayat.</p></section>`}
function newRecall(sn){recallQuestion(SURAH[sn],true);render()}
function recallPass(sn,an){setStage(sn,an,5);recallQuestion(SURAH[sn],true);render()}
function progressView(s){let due=dueItems(s.number);return `<section class="card"><div class="toprow"><div><b>Mastery ${masteryPct(s.number)}%</b><div class="meta">${strongCount(s.number)} dari ${s.verses.length} ayat hafal kuat</div></div>${due.length?`<button class="btn gold" onclick="startReview(${s.number})">Murajaah ${due.length}</button>`:'<span class="badge">Tidak ada due</span>'}</div><div class="verse-grid" style="margin-top:14px">${s.verses.map(v=>{let st=rec(s.number,v.n).stage||0;return `<div class="vcell s${st}" title="Ayat ${v.n}: ${STAGE_LABEL[st]}">${v.n}</div>`}).join('')}</div></section>
<section class="card"><h3 style="margin-top:0">Tahap penguasaan</h3><div class="mastery-legend">${[0,1,2,3,4,5].map(i=>`<div class="legend"><b>${i}</b>${STAGE_LABEL[i]}</div>`).join('')}</div><p class="notice" style="margin-top:12px">Tahap 3 memulai jadwal murajaah. Tahap 4 berarti sambungan ayat sudah lolos Bridge. Tahap 5 diperoleh dari Recall.</p></section>
<section class="card"><h3 style="margin-top:0">Jadwal ayat yang sudah mulai dikuasai</h3>${s.verses.filter(v=>(rec(s.number,v.n).stage||0)>=3).map(v=>{let r=rec(s.number,v.n);return `<div class="review-item">Ayat ${v.n} • ${STAGE_LABEL[r.stage]} • ${r.nextReview?'ulang '+r.nextReview:'cycle selesai ✓'}</div>`}).join('')||'<div class="empty">Belum ada ayat yang masuk siklus murajaah.</div>'}<button class="danger-link" onclick="resetSurah(${s.number})">Reset progress surah ini</button></section>`}
function resetSurah(sn){if(!confirm('Reset seluruh progress surah ini?'))return;let m=mastery();Object.keys(m).filter(k=>k.startsWith(sn+'-')).forEach(k=>delete m[k]);save(KEYS.mastery,m);render()}
function startReview(sn=null){let q=dueItems(sn);if(!q.length){alert('Belum ada murajaah yang jatuh tempo.');return}reviewState={queue:q,idx:0,revealed:false,mode:'position'};route={screen:'review',surah:sn||null,tab:'progress'};window.scrollTo(0,0);render()}
function reviewCurrent(){return reviewState.queue[reviewState.idx]}
function reviewAnswer(ok){let q=reviewCurrent();ok?reviewPass(q.sn,q.an):reviewFail(q.sn,q.an);reviewState.idx++;reviewState.revealed=false;if(reviewState.idx>=reviewState.queue.length){reviewState.done=true}else{reviewState.mode=['position','bridge','trigger'][rand(3)]}render()}
function reviewView(){if(reviewState.done)return `${header(true,'Murajaah')}<section class="card checkpoint"><div class="success">✓</div><h2 style="text-align:center">Murajaah selesai</h2><p class="hint" style="text-align:center">Ayat yang lancar sudah dijadwalkan ke siklus berikutnya. Yang belum lancar akan muncul kembali lebih cepat.</p><button class="btn full" onclick="goHome()">Kembali ke Beranda</button></section>`;let q=reviewCurrent(),s=SURAH[q.sn],v=s.verses[q.an-1],sf=stationFor(s,v.n),prev=s.verses[Math.max(0,v.n-2)],prompt;if(reviewState.mode==='bridge'&&v.n>1)prompt=`<div class="hint">Sambungkan setelah akhir ayat ${v.n-1}</div><div class="arabic">${esc(tailArabic(prev.a))}</div>`;else if(reviewState.mode==='trigger')prompt=`<div class="hint">Pemicu awal ayat ${v.n}</div><div class="arabic">${esc(arabicTrigger(v.a,2))}</div>`;else prompt=`<div class="hint">${s.name} • Kata kunci ayat ${v.n}: <b>${esc(eventFor(s,v.n).keyword||eventFor(s,v.n).place)}</b><br><br>Ucapkan ayat yang terhubung dengan kata kunci ini tanpa melihat.</div>`;return `${header(true,'Murajaah')}<section class="card"><div class="toprow"><span class="badge">${reviewState.idx+1}/${reviewState.queue.length}</span><span class="meta">${s.name} • ayat ${v.n}</span></div><div class="prompt">${prompt}</div>${reviewState.revealed?`<div class="answer">${keywordBadge(s.number,v.n)}<div class="arabic">${(()=>{let k=kw(s.number,v.n);return k?hl(v.a,k.a):esc(v.a)})()}</div><div class="latin">${(()=>{let k=kw(s.number,v.n);return k?hl(v.l,k.l):esc(v.l)})()}</div></div><div class="controls" style="margin-top:8px"><button class="btn alt" onclick="reviewAnswer(false)">Belum lancar</button><button class="btn" onclick="reviewAnswer(true)">Lancar ✓</button></div>`:`<button class="btn gold full" onclick="reviewState.revealed=true;render()">Cek Jawaban</button>`}</section><p class="notice">Murajaah memakai Position/Trigger/Bridge secara acak. Tujuannya agar hafalan tidak hanya kuat bila dimulai dari ayat pertama.</p>`}
function render(){let app=document.getElementById('app');if(route.screen==='home')app.innerHTML=home();else if(route.screen==='surah')app.innerHTML=surahView();else if(route.screen==='movie')app.innerHTML=movieView();else if(route.screen==='guide')app.innerHTML=guideView();else app.innerHTML=reviewView()}
render();
</script></body></html>
