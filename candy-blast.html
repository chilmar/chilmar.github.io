<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Candy Blast — Permen Meletup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --bg-deep:#140a26;
  --bg-mid:#1f0f3d;
  --panel:#241640;
  --panel-line:rgba(255,255,255,.08);
  --gold:#ffd54a;
  --gold-dim:#8a6d1f;
  --red:#ff4b6e;
  --orange:#ff9a3d;
  --yellow:#ffd93d;
  --green:#4ade80;
  --blue:#3fc1ff;
  --purple:#c084fc;
  --text:#f4eefe;
  --text-dim:#b3a4d6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(ellipse at 20% -10%, #3a1f66 0%, transparent 55%),
    radial-gradient(ellipse at 90% 110%, #4a1650 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}
h1,h2,h3{font-family:'Baloo 2',sans-serif; margin:0;}

/* ---------- TOP BAR ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px 6px;
}
.brand{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:.3px;
  background:linear-gradient(90deg,var(--gold),var(--orange));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.credit{
  font-size:10px; color:var(--text-dim); letter-spacing:.3px;
}

/* ---------- SCREENS ---------- */
.screen{
  flex:1;
  display:none;
  flex-direction:column;
  padding:0 16px 20px;
  animation:fadeIn .35s ease;
}
.screen.active{display:flex;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- HOME ---------- */
#home-screen{align-items:center; justify-content:center; text-align:center; gap:18px;}
.jar-wrap{position:relative; width:150px; height:150px; margin:0 auto;}
.jar-candy{
  position:absolute; width:26px; height:26px; border-radius:50%;
  animation:pour 2.6s ease-in-out infinite;
}
.tagline{color:var(--text-dim); font-size:14px; max-width:280px; line-height:1.5;}
.big-btn{
  font-family:'Baloo 2',sans-serif;
  font-weight:700; font-size:18px;
  color:#2a1200;
  background:linear-gradient(180deg, var(--gold), #f2a92a);
  border:none; border-radius:18px;
  padding:16px 40px;
  box-shadow:0 6px 0 var(--gold-dim), 0 10px 20px rgba(0,0,0,.35);
  cursor:pointer;
  transition:transform .08s ease;
}
.big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--gold-dim);}
.ghost-btn{
  font-family:'Nunito',sans-serif; font-weight:700; font-size:14px;
  color:var(--text); background:var(--panel);
  border:1px solid var(--panel-line); border-radius:14px;
  padding:10px 20px; cursor:pointer;
}

/* ---------- LEVEL SELECT ---------- */
#levels-screen h2{font-size:22px; text-align:center; margin-bottom:4px;}
.sub{text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:18px;}
.level-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  overflow-y:auto; padding-bottom:10px;
}
.level-node{
  aspect-ratio:1/1; border-radius:20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--panel-line);
  position:relative; cursor:pointer;
}
.level-node .num{font-family:'Baloo 2',sans-serif; font-size:24px; font-weight:800;}
.level-node .stars{display:flex; gap:2px; margin-top:4px; font-size:11px;}
.level-node.locked{opacity:.4; pointer-events:none;}
.level-node.active-node{
  background:linear-gradient(160deg,#3a2166,#241640);
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,213,74,.15);
}

/* ---------- GAME SCREEN ---------- */
#game-screen{padding:0 12px 14px;}
.hud{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 4px 8px;
}
.hud-btn{
  width:36px; height:36px; border-radius:12px;
  background:var(--panel); border:1px solid var(--panel-line);
  color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.hud-stat{
  background:var(--panel); border:1px solid var(--panel-line);
  border-radius:14px; padding:6px 14px; text-align:center; min-width:64px;
}
.hud-stat .lbl{font-size:9px; color:var(--text-dim); letter-spacing:.5px; text-transform:uppercase;}
.hud-stat .val{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;}
.hud-stat.moves .val{color:var(--gold);}

.goal-bar-wrap{
  background:var(--panel); border:1px solid var(--panel-line);
  border-radius:14px; padding:8px 12px; margin:0 4px 10px;
}
.goal-top{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.goal-track{height:10px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden;}
.goal-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--gold)); width:0%; transition:width .4s ease;}

#board{
  position:relative;
  display:grid;
  gap:4px;
  margin:0 auto;
  padding:8px;
  background:rgba(0,0,0,.25);
  border-radius:18px;
  border:1px solid var(--panel-line);
  touch-action:none;
}
.cell{
  border-radius:8px;
  background:rgba(255,255,255,.03);
}
.candy{
  position:absolute;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:inset -3px -4px 6px rgba(0,0,0,.25), inset 3px 3px 6px rgba(255,255,255,.25), 0 3px 6px rgba(0,0,0,.35);
  transition:left .18s ease, top .18s ease, transform .12s ease, opacity .18s ease;
}
.candy.selected{transform:scale(1.12); box-shadow:0 0 0 3px #fff, inset -3px -4px 6px rgba(0,0,0,.25);}
.candy.pop{transform:scale(0); opacity:0;}
.candy .shine{
  position:absolute; top:14%; left:20%; width:35%; height:22%;
  background:rgba(255,255,255,.55); border-radius:50%; filter:blur(1px);
}
.candy.striped::after{
  content:''; position:absolute; inset:0; border-radius:50%;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 4px, transparent 4px 9px);
}
.candy.bomb{box-shadow:0 0 14px 4px rgba(255,255,255,.6), inset -3px -4px 6px rgba(0,0,0,.3);}
.candy.bomb::before{
  content:'★'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:60%; color:#fff;
}

.score-pop{
  position:absolute; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
  color:#fff; pointer-events:none; animation:floatUp .7s ease forwards; z-index:20;
  text-shadow:0 2px 4px rgba(0,0,0,.5);
}
@keyframes floatUp{
  from{opacity:1; transform:translateY(0);}
  to{opacity:0; transform:translateY(-38px);}
}
.combo-banner{
  position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(.6);
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:28px;
  color:var(--gold); text-shadow:0 3px 10px rgba(0,0,0,.6);
  opacity:0; pointer-events:none; z-index:30;
}
.combo-banner.show{animation:comboPop .6s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes comboPop{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
  30%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}
  70%{opacity:1; transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0; transform:translate(-50%,-60%) scale(1);}
}

#board.shake{animation:shakeBoard .35s ease;}
@keyframes shakeBoard{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,4,20,.72);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:20px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:linear-gradient(160deg,#2c1a4d,#1c0f36);
  border:1px solid var(--panel-line);
  border-radius:24px; padding:28px 24px; text-align:center;
  max-width:340px; width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.modal h2{font-size:24px; margin-bottom:6px;}
.modal .stars-big{font-size:34px; margin:14px 0; letter-spacing:6px;}
.modal .score-line{color:var(--text-dim); font-size:14px; margin-bottom:18px;}
.modal-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

/* ---------- MISC ---------- */
.hidden{display:none !important;}

/* pouring candy anim jar keyframes generated inline via style per element */
@keyframes pour{
  0%{transform:translate(0,-10px) rotate(0deg); opacity:0;}
  15%{opacity:1;}
  100%{transform:translate(var(--dx,0px), 130px) rotate(200deg); opacity:0;}
}
</style>
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="brand">🍬 Candy Blast</div>
    <div class="credit">Ide: Chilmar • Creator: Claude</div>
  </div>

  <!-- HOME -->
  <div id="home-screen" class="screen active">
    <div class="jar-wrap" id="jarWrap"></div>
    <h1 style="font-size:26px;">Candy Blast</h1>
    <div class="tagline">Cocokkan 3 permen atau lebih, kumpulkan skor, dan taklukkan setiap level sebelum langkahmu habis!</div>
    <button class="big-btn" onclick="goLevels()">MAIN</button>
    <button class="ghost-btn" onclick="showHow()">Cara Bermain</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levels-screen" class="screen">
    <h2>Pilih Level</h2>
    <div class="sub">Selesaikan level untuk membuka level berikutnya</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="ghost-btn" style="margin-top:14px;" onclick="goHome()">← Kembali ke Menu</button>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="screen">
    <div class="hud">
      <div class="hud-btn" onclick="confirmExit()">✕</div>
      <div class="hud-stat">
        <div class="lbl">Skor</div>
        <div class="val" id="scoreVal">0</div>
      </div>
      <div class="hud-stat moves">
        <div class="lbl">Langkah</div>
        <div class="val" id="movesVal">0</div>
      </div>
      <div class="hud-btn" onclick="restartLevel()">↻</div>
    </div>
    <div class="goal-bar-wrap">
      <div class="goal-top"><span id="goalLevelLabel">Level 1</span><span id="goalTargetLabel">Target: 0</span></div>
      <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
    </div>
    <div id="board"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================
   CANDY BLAST — match-3 game engine
   Ide: Chilmar • Creator: Claude
   ========================================================= */

const CANDY_COLORS = [
  {key:'red', color:'var(--red)'},
  {key:'orange', color:'var(--orange)'},
  {key:'yellow', color:'var(--yellow)'},
  {key:'green', color:'var(--green)'},
  {key:'blue', color:'var(--blue)'},
  {key:'purple', color:'var(--purple)'},
];

const LEVELS = [
  {id:1, target:800,  moves:22, colors:4, size:7},
  {id:2, target:1400, moves:22, colors:4, size:7},
  {id:3, target:2200, moves:20, colors:5, size:7},
  {id:4, target:3200, moves:20, colors:5, size:8},
  {id:5, target:4500, moves:20, colors:5, size:8},
  {id:6, target:6000, moves:18, colors:6, size:8},
  {id:7, target:8000, moves:18, colors:6, size:8},
  {id:8, target:10500,moves:18, colors:6, size:8},
  {id:9, target:13500,moves:17, colors:6, size:8},
  {id:10,target:17000,moves:16, colors:6, size:8},
];

// session progress (in-memory only)
let progress = {unlocked:1, stars:{}}; // stars: {levelId: 1-3}

let state = null; // current game state

/* ---------------- NAVIGATION ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){ showScreen('home-screen'); }
function goLevels(){ renderLevelGrid(); showScreen('levels-screen'); }

function showHow(){
  openModal(`
    <h2>Cara Bermain</h2>
    <div style="text-align:left; font-size:14px; color:var(--text-dim); line-height:1.6; margin:14px 0;">
      🍬 Ketuk sebuah permen, lalu ketuk permen di sebelahnya untuk menukar posisi.<br><br>
      ✨ Susun 3 permen sewarna sejajar (horizontal/vertikal) untuk meledakkannya.<br><br>
      🌈 Cocokkan 4 permen → tercipta permen <b>Bergaris</b> yang meledakkan satu baris/kolom.<br><br>
      💥 Cocokkan 5 permen → tercipta <b>Bom Warna</b> yang meledakkan semua permen sewarna.<br><br>
      🎯 Capai target skor sebelum langkah habis untuk menang!
    </div>
    <div class="modal-btns"><button class="big-btn" onclick="closeModal()">MENGERTI</button></div>
  `);
}

/* ---------------- JAR ANIMATION (home) ---------------- */
function initJar(){
  const wrap = document.getElementById('jarWrap');
  wrap.innerHTML='';
  for(let i=0;i<12;i++){
    const c = document.createElement('div');
    c.className='jar-candy';
    const col = CANDY_COLORS[i % CANDY_COLORS.length];
    c.style.background = `radial-gradient(circle at 32% 28%, #fff8, ${col.color})`;
    c.style.left = (10 + Math.random()*110) + 'px';
    c.style.top = '0px';
    c.style.setProperty('--dx', (Math.random()*40-20)+'px');
    c.style.animationDelay = (i*0.22) + 's';
    wrap.appendChild(c);
  }
}

/* ---------------- LEVEL GRID ---------------- */
function renderLevelGrid(){
  const grid = document.getElementById('levelGrid');
  grid.innerHTML='';
  LEVELS.forEach(lv=>{
    const node = document.createElement('div');
    const locked = lv.id > progress.unlocked;
    node.className = 'level-node' + (locked?' locked':'') + (lv.id===progress.unlocked?' active-node':'');
    const st = progress.stars[lv.id] || 0;
    node.innerHTML = `<div class="num">${lv.id}</div><div class="stars">${starRow(st)}</div>`;
    if(!locked) node.onclick = ()=>startLevel(lv.id);
    grid.appendChild(node);
  });
}
function starRow(n){
  let s='';
  for(let i=0;i<3;i++) s += (i<n?'⭐':'<span style="opacity:.25">⭐</span>');
  return s;
}

/* ---------------- GAME SETUP ---------------- */
function startLevel(id){
  const lv = LEVELS.find(l=>l.id===id);
  const size = lv.size;
  state = {
    level: lv,
    size,
    grid: [],           // grid[r][c] = {color, kind, id}
    score: 0,
    moves: lv.moves,
    selected: null,
    busy: false,
    uidCounter: 1,
  };
  showScreen('game-screen');
  document.getElementById('goalLevelLabel').textContent = 'Level ' + lv.id;
  document.getElementById('goalTargetLabel').textContent = 'Target: ' + lv.target;
  buildBoardDOM();
  fillInitialGrid();
  updateHUD();
}
function restartLevel(){
  if(state) startLevel(state.level.id);
}
function confirmExit(){
  openModal(`
    <h2>Keluar dari Level?</h2>
    <div class="score-line">Progres level ini akan hilang.</div>
    <div class="modal-btns">
      <button class="ghost-btn" onclick="closeModal()">Batal</button>
      <button class="big-btn" onclick="closeModal(); goLevels();">Keluar</button>
    </div>
  `);
}

/* ---------------- BOARD DOM ---------------- */
const BOARD_PAD = 8, GAP = 4;
let CELL = 0;

function buildBoardDOM(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const size = state.size;
  const maxBoardWidth = Math.min(440, window.innerWidth - 32);
  CELL = Math.floor((maxBoardWidth - BOARD_PAD*2 - GAP*(size-1)) / size);
  const boardPx = CELL*size + GAP*(size-1) + BOARD_PAD*2;
  board.style.width = boardPx + 'px';
  board.style.height = boardPx + 'px';
  board.style.gridTemplateColumns = `repeat(${size}, ${CELL}px)`;
  board.style.gridTemplateRows = `repeat(${size}, ${CELL}px)`;
  for(let i=0;i<size*size;i++){
    const cell = document.createElement('div');
    cell.className='cell';
    board.appendChild(cell);
  }
}

function cellPos(r,c){
  return {
    left: BOARD_PAD + c*(CELL+GAP),
    top: BOARD_PAD + r*(CELL+GAP),
  };
}

function randColorKey(){
  const n = state.level.colors;
  return CANDY_COLORS[Math.floor(Math.random()*n)].key;
}
function colorHex(key){
  return CANDY_COLORS.find(c=>c.key===key).color;
}

function fillInitialGrid(){
  const size = state.size;
  state.grid = [];
  for(let r=0;r<size;r++){
    const row=[];
    for(let c=0;c<size;c++){
      let color;
      let tries=0;
      do{
        color = randColorKey();
        tries++;
      } while(tries<20 && wouldMatchAt(row, r, c, color));
      row.push(makeCandy(color,'normal'));
    }
    state.grid.push(row);
  }
  renderAllCandies();
}
function wouldMatchAt(row, r, c, color){
  if(c>=2 && row[c-1] && row[c-1].color===color && row[c-2] && row[c-2].color===color) return true;
  if(r>=2 && state.grid[r-1] && state.grid[r-1][c] && state.grid[r-1][c].color===color &&
     state.grid[r-2] && state.grid[r-2][c] && state.grid[r-2][c].color===color) return true;
  return false;
}
function makeCandy(color, kind){
  return {color, kind, uid: state.uidCounter++, el:null};
}

function renderAllCandies(){
  const board = document.getElementById('board');
  document.querySelectorAll('.candy').forEach(e=>e.remove());
  for(let r=0;r<state.size;r++){
    for(let c=0;c<state.size;c++){
      const candy = state.grid[r][c];
      if(candy) createCandyEl(candy, r, c, board, false);
    }
  }
}

function createCandyEl(candy, r, c, board, animateIn){
  const el = document.createElement('div');
  el.className = 'candy';
  if(candy.kind==='striped-h' || candy.kind==='striped-v') el.classList.add('striped');
  if(candy.kind==='bomb') el.classList.add('bomb');
  el.style.width = (CELL-6)+'px';
  el.style.height = (CELL-6)+'px';
  el.style.margin = '3px';
  const pos = cellPos(r,c);
  el.style.left = pos.left+'px';
  el.style.top = animateIn ? (pos.top - (CELL+GAP)*3) + 'px' : pos.top+'px';
  const base = colorHex(candy.color);
  el.style.background = `radial-gradient(circle at 32% 26%, #ffffffcc, ${base} 55%, ${base})`;
  el.innerHTML = '<div class="shine"></div>';
  el.dataset.uid = candy.uid;
  el.onclick = ()=>handleCandyElClick(candy.uid);
  candy.el = el;
  board.appendChild(el);
  if(animateIn){
    requestAnimationFrame(()=>{
      el.style.top = pos.top+'px';
    });
  }
  return el;
}

/* ---------------- INTERACTION ---------------- */
// Always resolve a candy's CURRENT grid position by its unique id before acting on a click.
// This avoids stale coordinates after the candy has fallen/moved during cascades.
function findCandyPositionByUid(uid){
  for(let r=0;r<state.size;r++){
    for(let c=0;c<state.size;c++){
      const candy = state.grid[r][c];
      if(candy && candy.uid===uid) return {r,c};
    }
  }
  return null;
}
function handleCandyElClick(uid){
  if(state.busy) return;
  const pos = findCandyPositionByUid(uid);
  if(!pos) return;
  onCandyClick(pos.r, pos.c);
}
function onCandyClick(r,c){
  if(state.busy) return;
  const sel = state.selected;
  if(!sel){
    state.selected = {r,c};
    state.grid[r][c].el.classList.add('selected');
    return;
  }
  if(sel.r===r && sel.c===c){
    state.grid[r][c].el.classList.remove('selected');
    state.selected = null;
    return;
  }
  const isAdjacent = (Math.abs(sel.r-r)+Math.abs(sel.c-c))===1;
  state.grid[sel.r][sel.c].el.classList.remove('selected');
  if(!isAdjacent){
    state.selected = {r,c};
    state.grid[r][c].el.classList.add('selected');
    return;
  }
  state.selected = null;
  attemptSwap(sel.r, sel.c, r, c);
}

function attemptSwap(r1,c1,r2,c2){
  state.busy = true;
  swapGridCells(r1,c1,r2,c2);
  animateSwapVisual(r1,c1,r2,c2, ()=>{
    const matches = findAllMatches();
    if(matches.length===0){
      // check for special-candy combos (bomb/striped adjacency) even without normal match
      const special = checkSpecialInteraction(r1,c1,r2,c2);
      if(special){
        state.moves--;
        updateHUD();
        resolveSpecialInteraction(r1,c1,r2,c2, ()=>{
          afterCascade();
        });
      } else {
        // invalid swap: revert
        swapGridCells(r1,c1,r2,c2);
        animateSwapVisual(r1,c1,r2,c2, ()=>{
          shakeBoard();
          state.busy = false;
        });
      }
    } else {
      state.moves--;
      updateHUD();
      processMatches(1, ()=>{ afterCascade(); });
    }
  });
}

function swapGridCells(r1,c1,r2,c2){
  const tmp = state.grid[r1][c1];
  state.grid[r1][c1] = state.grid[r2][c2];
  state.grid[r2][c2] = tmp;
}

function animateSwapVisual(r1,c1,r2,c2, cb){
  const a = state.grid[r1][c1], b = state.grid[r2][c2];
  const posA = cellPos(r1,c1), posB = cellPos(r2,c2);
  if(a && a.el){ a.el.style.left=posA.left+'px'; a.el.style.top=posA.top+'px'; }
  if(b && b.el){ b.el.style.left=posB.left+'px'; b.el.style.top=posB.top+'px'; }
  setTimeout(cb, 190);
}

function shakeBoard(){
  const board = document.getElementById('board');
  board.classList.add('shake');
  setTimeout(()=>board.classList.remove('shake'), 350);
}

/* Direct combining of two special candies when swapped together */
function checkSpecialInteraction(r1,c1,r2,c2){
  const a = state.grid[r1][c1], b = state.grid[r2][c2];
  if(!a || !b) return false;
  const aSpecial = a.kind!=='normal', bSpecial = b.kind!=='normal';
  return aSpecial && bSpecial;
}
function resolveSpecialInteraction(r1,c1,r2,c2, cb){
  // Combine: clear a whole row+col cross, or if both bombs clear entire board section
  const toClear = new Set();
  const size = state.size;
  const a = state.grid[r1][c1], b = state.grid[r2][c2];
  if(a.kind==='bomb' || b.kind==='bomb'){
    // clear 3 random rows worth (big blast)
    for(let i=0;i<size;i++){ toClear.add(r1+'_'+i); toClear.add(i+'_'+c1); toClear.add(r2+'_'+i); toClear.add(i+'_'+c2); }
  } else {
    for(let i=0;i<size;i++){ toClear.add(r1+'_'+i); toClear.add(i+'_'+c1); }
  }
  const coords = Array.from(toClear).map(s=>{const [r,c]=s.split('_').map(Number); return {r,c};});
  clearCoords(coords, ()=>{ dropAndRefill(cb); });
}

/* ---------------- MATCH DETECTION ---------------- */
function findAllMatches(){
  const size = state.size;
  const matched = new Set();
  const lines = []; // store line groups for special-candy creation

  // horizontal
  for(let r=0;r<size;r++){
    let run=[0];
    for(let c=1;c<=size;c++){
      const prev = state.grid[r][c-1];
      const cur = c<size ? state.grid[r][c] : null;
      if(cur && prev && cur.color===prev.color){
        run.push(c);
      } else {
        if(run.length>=3){
          lines.push({dir:'h', r, cs:[...run]});
          run.forEach(cc=>matched.add(r+'_'+cc));
        }
        run=[c];
      }
    }
  }
  // vertical
  for(let c=0;c<size;c++){
    let run=[0];
    for(let r=1;r<=size;r++){
      const prev = state.grid[r-1] ? state.grid[r-1][c] : null;
      const cur = r<size ? state.grid[r][c] : null;
      if(cur && prev && cur.color===prev.color){
        run.push(r);
      } else {
        if(run.length>=3){
          lines.push({dir:'v', c, rs:[...run]});
          run.forEach(rr=>matched.add(rr+'_'+c));
        }
        run=[r];
      }
    }
  }
  if(matched.size===0) return [];
  const coords = Array.from(matched).map(s=>{const [r,c]=s.split('_').map(Number); return {r,c};});
  return {coords, lines};
}

/* ---------------- PROCESS MATCHES (with cascade) ---------------- */
function processMatches(comboLevel, done){
  const result = findAllMatches();
  if(!result || result.length===0 || !result.coords || result.coords.length===0){
    done();
    return;
  }
  const {coords, lines} = result;

  // determine special candy creations: pick center of lines with length>=4
  const creations = [];
  lines.forEach(line=>{
    const len = line.dir==='h' ? line.cs.length : line.rs.length;
    if(len>=5){
      const mid = line.dir==='h' ? Math.floor(line.cs.length/2) : Math.floor(line.rs.length/2);
      const r = line.dir==='h' ? line.r : line.rs[mid];
      const c = line.dir==='h' ? line.cs[mid] : line.c;
      creations.push({r,c,kind:'bomb'});
    } else if(len===4){
      const mid = line.dir==='h' ? Math.floor(line.cs.length/2) : Math.floor(line.rs.length/2);
      const r = line.dir==='h' ? line.r : line.rs[mid];
      const c = line.dir==='h' ? line.cs[mid] : line.c;
      creations.push({r,c,kind: line.dir==='h' ? 'striped-v' : 'striped-h'});
    }
  });

  // expand coords for any special candies already sitting inside the match (chain trigger)
  let expanded = expandForSpecials(coords);

  // score
  const base = 30;
  const gained = expanded.length * base * comboLevel;
  state.score += gained;
  updateHUD();
  showScorePop(expanded, gained, comboLevel);
  if(comboLevel>=2) showCombo(comboLevel);

  clearCoords(expanded, ()=>{
    // place special-candy creations on now-empty grid slots before drop
    const board = document.getElementById('board');
    creations.forEach(cr=>{
      if(cr.r>=0 && cr.r<state.size && cr.c>=0 && cr.c<state.size){
        const special = makeCandy(pickCreationColor(expanded), cr.kind);
        state.grid[cr.r][cr.c] = special;
        createCandyEl(special, cr.r, cr.c, board, false);
      }
    });
    dropAndRefill(()=>{
      processMatches(comboLevel+1, done);
    });
  });
}

function pickCreationColor(coords){
  if(coords.length===0) return randColorKey();
  return randColorKey();
}

// if a matched coordinate currently holds a striped/bomb candy, expand clearing to its effect area
function expandForSpecials(coords){
  const size = state.size;
  const set = new Set(coords.map(p=>p.r+'_'+p.c));
  let changed = true;
  let guard = 0;
  while(changed && guard<10){
    changed = false; guard++;
    const current = Array.from(set);
    current.forEach(key=>{
      const [r,c] = key.split('_').map(Number);
      const candy = state.grid[r] ? state.grid[r][c] : null;
      if(!candy) return;
      if(candy.kind==='striped-h'){
        for(let cc=0;cc<size;cc++){ const k=r+'_'+cc; if(!set.has(k)){set.add(k); changed=true;} }
      } else if(candy.kind==='striped-v'){
        for(let rr=0;rr<size;rr++){ const k=rr+'_'+c; if(!set.has(k)){set.add(k); changed=true;} }
      } else if(candy.kind==='bomb'){
        for(let rr=0;rr<size;rr++)for(let cc=0;cc<size;cc++){
          if(state.grid[rr][cc] && state.grid[rr][cc].color===candy.color){
            const k=rr+'_'+cc; if(!set.has(k)){set.add(k); changed=true;}
          }
        }
      }
    });
  }
  return Array.from(set).map(s=>{const [r,c]=s.split('_').map(Number); return {r,c};});
}

function clearCoords(coords, cb){
  coords.forEach(({r,c})=>{
    const candy = state.grid[r][c];
    if(candy && candy.el){
      candy.el.classList.add('pop');
    }
    state.grid[r][c] = null;
  });
  setTimeout(()=>{
    coords.forEach(({r,c})=>{
      const board = document.getElementById('board');
    });
    // remove popped DOM nodes
    document.querySelectorAll('.candy.pop').forEach(e=>e.remove());
    cb();
  }, 200);
}

function dropAndRefill(cb){
  const size = state.size;
  const board = document.getElementById('board');
  for(let c=0;c<size;c++){
    let pointer = size-1;
    for(let r=size-1;r>=0;r--){
      if(state.grid[r][c]){
        if(pointer!==r){
          state.grid[pointer][c] = state.grid[r][c];
          state.grid[r][c] = null;
          const pos = cellPos(pointer,c);
          state.grid[pointer][c].el.style.top = pos.top+'px';
        }
        pointer--;
      }
    }
    for(let r=pointer;r>=0;r--){
      const color = randColorKey();
      const candy = makeCandy(color,'normal');
      state.grid[r][c] = candy;
      createCandyEl(candy, r, c, board, true);
    }
  }
  setTimeout(cb, 260);
}

function afterCascade(){
  state.busy = false;
  checkGoal();
}

/* ---------------- FEEDBACK FX ---------------- */
function showScorePop(coords, total, comboLevel){
  if(coords.length===0) return;
  const board = document.getElementById('board');
  const mid = coords[Math.floor(coords.length/2)];
  const pos = cellPos(mid.r, mid.c);
  const pop = document.createElement('div');
  pop.className='score-pop';
  pop.style.left = (pos.left + CELL/2 - 14) + 'px';
  pop.style.top = pos.top + 'px';
  pop.textContent = '+'+total;
  board.appendChild(pop);
  setTimeout(()=>pop.remove(), 700);
}
function showCombo(level){
  const board = document.getElementById('board');
  const banner = document.createElement('div');
  banner.className='combo-banner';
  const labels = {2:'Combo x2!',3:'Combo x3! 🔥',4:'Manis Sekali! x4',5:'LUAR BIASA! x5'};
  banner.textContent = labels[level] || ('Combo x'+level+'!');
  board.appendChild(banner);
  requestAnimationFrame(()=>banner.classList.add('show'));
  setTimeout(()=>banner.remove(), 650);
}

/* ---------------- HUD & GOAL ---------------- */
function updateHUD(){
  document.getElementById('scoreVal').textContent = state.score;
  document.getElementById('movesVal').textContent = Math.max(0,state.moves);
  const pct = Math.min(100, Math.round(state.score / state.level.target * 100));
  document.getElementById('goalFill').style.width = pct+'%';
}

function checkGoal(){
  if(state.score >= state.level.target){
    onLevelWin();
    return;
  }
  if(state.moves<=0){
    onLevelLose();
    return;
  }
  if(!hasAnyPossibleMove()){
    reshuffleBoard();
  }
}

function onLevelWin(){
  const ratio = state.score / state.level.target;
  let stars = 1;
  if(ratio>=1.6) stars=3; else if(ratio>=1.25) stars=2;
  progress.stars[state.level.id] = Math.max(progress.stars[state.level.id]||0, stars);
  if(state.level.id === progress.unlocked && progress.unlocked < LEVELS.length){
    progress.unlocked = state.level.id+1;
  }
  const isLast = state.level.id >= LEVELS.length;
  openModal(`
    <h2>🎉 Level Selesai!</h2>
    <div class="stars-big">${starRow(stars)}</div>
    <div class="score-line">Skor akhir: <b>${state.score}</b> / Target ${state.level.target}</div>
    <div class="modal-btns">
      <button class="ghost-btn" onclick="closeModal(); goLevels();">Peta Level</button>
      ${isLast ? '' : `<button class="big-btn" onclick="closeModal(); startLevel(${state.level.id+1});">Level Berikutnya</button>`}
    </div>
  `);
}
function onLevelLose(){
  openModal(`
    <h2>😢 Langkah Habis</h2>
    <div class="score-line">Skor kamu: <b>${state.score}</b> — butuh ${state.level.target} untuk menang.</div>
    <div class="modal-btns">
      <button class="ghost-btn" onclick="closeModal(); goLevels();">Peta Level</button>
      <button class="big-btn" onclick="closeModal(); restartLevel();">Coba Lagi</button>
    </div>
  `);
}

/* ---------------- HELPERS: possible move check + reshuffle ---------------- */
function hasAnyPossibleMove(){
  const size = state.size;
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      if(c<size-1 && testSwapCreatesMatch(r,c,r,c+1)) return true;
      if(r<size-1 && testSwapCreatesMatch(r,c,r+1,c)) return true;
    }
  }
  return false;
}
function testSwapCreatesMatch(r1,c1,r2,c2){
  swapGridCells(r1,c1,r2,c2);
  const result = findAllMatches();
  swapGridCells(r1,c1,r2,c2);
  return result && result.coords && result.coords.length>0;
}
function reshuffleBoard(){
  state.busy = true;
  const size = state.size;
  const colors = [];
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) colors.push(state.grid[r][c].color);
  colors.sort(()=>Math.random()-0.5);
  let idx=0;
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      state.grid[r][c].color = colors[idx++];
      const el = state.grid[r][c].el;
      const base = colorHex(state.grid[r][c].color);
      el.style.background = `radial-gradient(circle at 32% 26%, #ffffffcc, ${base} 55%, ${base})`;
    }
  }
  setTimeout(()=>{
    state.busy=false;
    if(!hasAnyPossibleMove()) reshuffleBoard();
  }, 150);
}

/* ---------------- MODAL ---------------- */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}

/* ---------------- INIT ---------------- */
initJar();
window.addEventListener('resize', ()=>{ if(state){ buildBoardDOM(); renderAllCandies(); } });
</script>
