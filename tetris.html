<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tetris</title>
<style>
  :root{
    --bg-1:#0f1220;
    --bg-2:#1a1f3a;
    --accent:#7c5cff;
    --accent-2:#38e0d8;
    --panel:#171b30;
    --panel-line:#2a2f52;
    --text:#eef0ff;
    --text-dim:#9aa0c4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    touch-action:none;
  }
  #app{
    display:flex; flex-direction:column; height:100dvh; height:100vh;
    max-width:480px; margin:0 auto;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px 4px;
  }
  header h1{
    font-size:18px; margin:0; font-weight:700; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #headerBtns{display:flex; gap:8px;}
  .iconbtn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--panel-line);
    background:var(--panel); color:var(--text); display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  main{
    flex:1; display:flex; gap:10px; padding:6px 10px; min-height:0;
  }
  #boardWrap{
    flex:1; display:flex; align-items:center; justify-content:center; min-width:0;
  }
  #boardOuter{
    position:relative;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  canvas#board{
    display:block; border-radius:8px; background:#0b0e1c;
  }
  #sidebar{
    width:88px; display:flex; flex-direction:column; gap:8px;
  }
  .panelBox{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:12px;
    padding:8px; text-align:center;
  }
  .panelBox .label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px;}
  .panelBox .value{ font-size:16px; font-weight:700; }
  canvas#next{ display:block; margin:0 auto; background:#0b0e1c; border-radius:6px; }
  canvas#hold{ display:block; margin:0 auto; background:#0b0e1c; border-radius:6px; }

  #controls{
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px;
  }
  .ctrlRow{ display:flex; gap:8px; justify-content:center; }
  .ctrlBtn{
    flex:1; max-width:80px; height:54px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:14px;
    color:var(--text); font-size:22px; display:flex; align-items:center; justify-content:center;
    active-opacity:.6;
  }
  .ctrlBtn:active{ background:var(--accent); border-color:var(--accent); }
  .ctrlBtn.wide{ max-width:160px; font-size:14px; font-weight:700; letter-spacing:.5px; }
  .ctrlBtn.drop{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:none; }

  #overlay{
    position:absolute; inset:0; background:rgba(6,7,16,.86);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    border-radius:14px; text-align:center; padding:20px;
  }
  #overlay.hidden{ display:none; }
  #overlay h2{ margin:0; font-size:22px; }
  #overlay p{ margin:0; color:var(--text-dim); font-size:13px; max-width:260px; }
  .primaryBtn{
    padding:12px 28px; border-radius:12px; border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0b0e1c; font-weight:800; font-size:15px;
  }
  #pauseBtnRow{ display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>TETRIS</h1>
    <div id="headerBtns">
      <button class="iconbtn" id="pauseBtn">⏸</button>
      <button class="iconbtn" id="restartBtn">⟲</button>
    </div>
  </header>

  <main>
    <div id="boardWrap">
      <div id="boardOuter">
        <canvas id="board"></canvas>
        <div id="overlay">
          <h2 id="overlayTitle">TETRIS</h2>
          <p id="overlayText">Ketuk mulai untuk bermain. Swipe kiri/kanan untuk geser, swipe bawah untuk hard drop, tap untuk putar.</p>
          <button class="primaryBtn" id="startBtn">MULAI</button>
        </div>
      </div>
    </div>
    <div id="sidebar">
      <div class="panelBox">
        <div class="label">Skor</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="panelBox">
        <div class="label">Level</div>
        <div class="value" id="levelVal">1</div>
      </div>
      <div class="panelBox">
        <div class="label">Baris</div>
        <div class="value" id="linesVal">0</div>
      </div>
      <div class="panelBox">
        <div class="label">Hold</div>
        <canvas id="hold" width="56" height="56"></canvas>
      </div>
      <div class="panelBox">
        <div class="label">Next</div>
        <canvas id="next" width="56" height="56"></canvas>
      </div>
    </div>
  </main>

  <div id="controls">
    <div class="ctrlRow">
      <button class="ctrlBtn" id="btnHold">HOLD</button>
      <button class="ctrlBtn" id="btnRotate">⟳</button>
      <button class="ctrlBtn drop" id="btnDrop">⬇︎⬇︎</button>
    </div>
    <div class="ctrlRow">
      <button class="ctrlBtn" id="btnLeft">◀</button>
      <button class="ctrlBtn" id="btnDown">▼</button>
      <button class="ctrlBtn" id="btnRight">▶</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const COLS = 10, ROWS = 20;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nextCtx = nextCanvas.getContext('2d');
  const holdCanvas = document.getElementById('hold');
  const holdCtx = holdCanvas.getContext('2d');

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  const scoreVal = document.getElementById('scoreVal');
  const levelVal = document.getElementById('levelVal');
  const linesVal = document.getElementById('linesVal');

  // ---- Sizing ----
  function fitCanvas(){
    const wrap = document.getElementById('boardWrap');
    const sidebarW = 88 + 10;
    const availW = wrap.clientWidth - 12;
    const availH = wrap.clientHeight - 12;
    let cell = Math.floor(Math.min(availW / COLS, availH / ROWS));
    cell = Math.max(14, cell);
    boardCanvas.width = cell * COLS;
    boardCanvas.height = cell * ROWS;
    boardCanvas.style.width = boardCanvas.width + 'px';
    boardCanvas.style.height = boardCanvas.height + 'px';
    CELL = cell;
    draw();
  }
  let CELL = 24;

  // ---- Pieces ----
  const COLORS = {
    I:'#38e0d8', O:'#ffd23f', T:'#b57cff', S:'#4ade80',
    Z:'#ff6767', J:'#5c8dff', L:'#ff9d4d'
  };
  const SHAPES = {
    I:[[0,1],[1,1],[2,1],[3,1]],
    O:[[1,0],[2,0],[1,1],[2,1]],
    T:[[1,0],[0,1],[1,1],[2,1]],
    S:[[1,0],[2,0],[0,1],[1,1]],
    Z:[[0,0],[1,0],[1,1],[2,1]],
    J:[[0,0],[0,1],[1,1],[2,1]],
    L:[[2,0],[0,1],[1,1],[2,1]]
  };
  const TYPES = Object.keys(SHAPES);

  function rotateCells(cells, cx, cy){
    // rotate 90 deg clockwise around pivot (cx,cy), using simple grid rotation
    return cells.map(([x,y])=>{
      const rx = cx - (y - cy);
      const ry = cy + (x - cx);
      return [Math.round(rx), Math.round(ry)];
    });
  }

  function pivotFor(type){
    if(type==='I') return [1.5,1.5];
    if(type==='O') return [1.5,0.5];
    return [1,1];
  }

  function newPiece(type){
    return {
      type,
      cells: SHAPES[type].map(c=>c.slice()),
      x:3, y:-1,
      color: COLORS[type]
    };
  }

  // 7-bag randomizer
  let bag = [];
  function refillBag(){
    bag = TYPES.slice();
    for(let i=bag.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [bag[i],bag[j]]=[bag[j],bag[i]];
    }
  }
  function nextType(){
    if(bag.length===0) refillBag();
    return bag.pop();
  }

  // ---- Game state ----
  let grid, current, nextPiece, holdPiece, canHold;
  let score, level, linesCleared;
  let dropInterval, dropTimer, lastTime;
  let running=false, paused=false, gameOver=false;
  let rafId=null;

  function emptyGrid(){
    return Array.from({length:ROWS},()=>Array(COLS).fill(null));
  }

  function resetGame(){
    grid = emptyGrid();
    bag = [];
    score=0; level=1; linesCleared=0;
    dropInterval = 900;
    holdPiece = null; canHold = true;
    current = newPiece(nextType());
    nextPiece = newPiece(nextType());
    updateHUD();
    gameOver=false;
  }

  function updateHUD(){
    scoreVal.textContent = score;
    levelVal.textContent = level;
    linesVal.textContent = linesCleared;
  }

  function collides(cells, ox, oy){
    for(const [cx,cy] of cells){
      const x = cx + ox, y = cy + oy;
      if(x<0||x>=COLS||y>=ROWS) return true;
      if(y>=0 && grid[y][x]) return true;
    }
    return false;
  }

  function merge(){
    for(const [cx,cy] of current.cells){
      const x = cx+current.x, y = cy+current.y;
      if(y>=0) grid[y][x] = current.color;
    }
  }

  function clearLines(){
    let cleared = 0;
    for(let y=ROWS-1;y>=0;y--){
      if(grid[y].every(c=>c)){
        grid.splice(y,1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if(cleared>0){
      const points = [0,100,300,500,800][cleared] * level;
      score += points;
      linesCleared += cleared;
      const newLevel = Math.floor(linesCleared/10)+1;
      if(newLevel !== level){
        level = newLevel;
        dropInterval = Math.max(120, 900 - (level-1)*70);
      }
      updateHUD();
    }
  }

  function spawnNext(){
    current = nextPiece;
    current.x = 3; current.y = -1;
    if(current.type==='I') current.x=3;
    if(current.type==='O') current.x=4;
    nextPiece = newPiece(nextType());
    canHold = true;
    if(collides(current.cells, current.x, current.y)){
      endGame();
    }
    drawNext();
  }

  function hardDrop(){
    if(!running||paused||gameOver) return;
    let dist=0;
    while(!collides(current.cells, current.x, current.y+1)){
      current.y++; dist++;
    }
    score += dist*2;
    lockPiece();
  }

  function lockPiece(){
    merge();
    clearLines();
    spawnNext();
    draw();
  }

  function softDrop(){
    if(!running||paused||gameOver) return;
    if(!collides(current.cells, current.x, current.y+1)){
      current.y++;
      score+=1; updateHUD();
    } else {
      lockPiece();
    }
    draw();
  }

  function move(dx){
    if(!running||paused||gameOver) return;
    if(!collides(current.cells, current.x+dx, current.y)){
      current.x += dx;
      draw();
    }
  }

  function rotate(){
    if(!running||paused||gameOver) return;
    if(current.type==='O') return;
    const [px,py] = pivotFor(current.type);
    const rotated = rotateCells(current.cells, px, py);
    // wall kicks: try offsets
    const kicks = [0,-1,1,-2,2];
    for(const k of kicks){
      if(!collides(rotated, current.x+k, current.y)){
        current.cells = rotated;
        current.x += k;
        draw();
        return;
      }
    }
  }

  function holdSwap(){
    if(!running||paused||gameOver||!canHold) return;
    canHold = false;
    if(holdPiece===null){
      holdPiece = newPiece(current.type);
      spawnNext();
    } else {
      const t = current.type;
      current = newPiece(holdPiece.type);
      current.x = current.type==='O' ? 4 : 3; current.y=-1;
      holdPiece = newPiece(t);
    }
    drawHold();
    draw();
  }

  function ghostY(){
    let gy = current.y;
    while(!collides(current.cells, current.x, gy+1)) gy++;
    return gy;
  }

  // ---- Drawing ----
  function roundCell(x,y,size,color,alpha){
    ctx.globalAlpha = alpha===undefined?1:alpha;
    ctx.fillStyle = color;
    const pad = 1.5;
    const r = 4;
    const px = x*size+pad, py=y*size+pad, s=size-pad*2;
    ctx.beginPath();
    ctx.moveTo(px+r,py);
    ctx.arcTo(px+s+px-px, py, px+s, py+s, r);
    ctx.fill();
    // simplified rounded rect
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(px,py,s,s,r) : ctx.rect(px,py,s,s);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.clearRect(0,0,boardCanvas.width, boardCanvas.height);
    // grid background lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for(let x=0;x<=COLS;x++){
      ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke();
    }
    for(let y=0;y<=ROWS;y++){
      ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke();
    }
    // placed blocks
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(grid[y][x]) roundCell(x,y,CELL,grid[y][x]);
      }
    }
    if(current && running && !gameOver){
      // ghost
      const gy = ghostY();
      for(const [cx,cy] of current.cells){
        const x = cx+current.x, y=cy+gy;
        if(y>=0) roundCell(x,y,CELL,current.color,0.22);
      }
      // current piece
      for(const [cx,cy] of current.cells){
        const x = cx+current.x, y=cy+current.y;
        if(y>=0) roundCell(x,y,CELL,current.color,1);
      }
    }
  }

  function drawMiniPiece(context, canvas, piece){
    context.clearRect(0,0,canvas.width, canvas.height);
    if(!piece) return;
    const cells = piece.cells;
    const xs = cells.map(c=>c[0]), ys = cells.map(c=>c[1]);
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const minY=Math.min(...ys), maxY=Math.max(...ys);
    const w = maxX-minX+1, h = maxY-minY+1;
    const size = Math.floor(Math.min((canvas.width-8)/w, (canvas.height-8)/h));
    const offX = (canvas.width - w*size)/2;
    const offY = (canvas.height - h*size)/2;
    context.fillStyle = piece.color;
    for(const [cx,cy] of cells){
      const x = (cx-minX)*size+offX, y=(cy-minY)*size+offY;
      context.beginPath();
      if(context.roundRect) context.roundRect(x+1,y+1,size-2,size-2,3);
      else context.rect(x+1,y+1,size-2,size-2);
      context.fill();
    }
  }
  function drawNext(){ drawMiniPiece(nextCtx, nextCanvas, nextPiece); }
  function drawHold(){ drawMiniPiece(holdCtx, holdCanvas, holdPiece); }

  // ---- Loop ----
  function loop(ts){
    if(!lastTime) lastTime = ts;
    const delta = ts - lastTime;
    lastTime = ts;
    if(running && !paused && !gameOver){
      dropTimer += delta;
      if(dropTimer > dropInterval){
        dropTimer = 0;
        if(!collides(current.cells, current.x, current.y+1)){
          current.y++;
        } else {
          lockPiece();
        }
        draw();
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  function startGame(){
    resetGame();
    running = true; paused=false; gameOver=false;
    dropTimer = 0; lastTime=0;
    overlay.classList.add('hidden');
    drawNext(); drawHold();
    draw();
  }

  function endGame(){
    gameOver = true; running=false;
    overlayTitle.textContent = 'GAME OVER';
    overlayText.textContent = 'Skor akhir: ' + score + '  •  Level ' + level + '  •  Baris ' + linesCleared;
    startBtn.textContent = 'MAIN LAGI';
    overlay.classList.remove('hidden');
  }

  function togglePause(){
    if(!running||gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    if(paused){
      overlayTitle.textContent = 'JEDA';
      overlayText.textContent = 'Ketuk lanjut untuk melanjutkan permainan.';
      startBtn.textContent = 'LANJUT';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  // ---- Buttons ----
  startBtn.addEventListener('click', ()=>{
    if(paused){ paused=false; pauseBtn.textContent='⏸'; overlay.classList.add('hidden'); return; }
    startGame();
  });
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', ()=>{ startGame(); });

  document.getElementById('btnLeft').addEventListener('click', ()=>move(-1));
  document.getElementById('btnRight').addEventListener('click', ()=>move(1));
  document.getElementById('btnDown').addEventListener('click', softDrop);
  document.getElementById('btnRotate').addEventListener('click', rotate);
  document.getElementById('btnDrop').addEventListener('click', hardDrop);
  document.getElementById('btnHold').addEventListener('click', holdSwap);

  // prevent double-tap zoom on buttons
  document.querySelectorAll('button').forEach(b=>{
    b.addEventListener('touchstart', (e)=>{ e.preventDefault(); b.click(); }, {passive:false});
  });

  // ---- Swipe / tap on board ----
  let touchStartX=0, touchStartY=0, touchStartT=0, touched=false;
  const SWIPE_THRESHOLD = 24;
  boardCanvas.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    touched=true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartT = Date.now();
  }, {passive:true});

  boardCanvas.addEventListener('touchmove', (e)=>{
    if(!touched||!running||paused||gameOver) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if(Math.abs(dx) > SWIPE_THRESHOLD){
      move(dx>0?1:-1);
      touchStartX = e.touches[0].clientX;
    }
    if(dy > SWIPE_THRESHOLD*1.6){
      softDrop();
      touchStartY = e.touches[0].clientY;
    }
  }, {passive:true});

  boardCanvas.addEventListener('touchend', (e)=>{
    if(!touched) return;
    touched=false;
    const dt = Date.now()-touchStartT;
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX-touchStartX, dy = endY-touchStartY;
    if(Math.abs(dx)<10 && Math.abs(dy)<10 && dt<250){
      rotate();
    } else if(dy > 60 && Math.abs(dy) > Math.abs(dx)){
      hardDrop();
    }
  }, {passive:true});

  // ---- Keyboard (desktop testing) ----
  document.addEventListener('keydown', (e)=>{
    if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
    if(e.key==='ArrowLeft') move(-1);
    else if(e.key==='ArrowRight') move(1);
    else if(e.key==='ArrowDown') softDrop();
    else if(e.key==='ArrowUp') rotate();
    else if(e.key===' ') hardDrop();
    else if(e.key==='c'||e.key==='C') holdSwap();
    else if(e.key==='p'||e.key==='P') togglePause();
  });

  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,200));

  // init
  resetGame();
  fitCanvas();
  drawNext(); drawHold();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
