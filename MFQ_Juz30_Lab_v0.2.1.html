 h3{margin:2px 0;font-size:17px}.meta{font-size:12px;color:var(--muted);line-height:1.45}.arrow{border:0;background:#edf4f1;color:var(--brand);border-radius:13px;width:38px;height:38px;font-size:19px}.progress-line{height:7px;border-radius:9px;background:#e8ebe8;overflow:hidden;margin-top:9px}.progress-line i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:.2s}.btn{border:0;border-radius:14px;padding:12px 14px;background:var(--brand);color:white;font-weight:800}.btn.alt{background:#edf1ee;color:var(--ink)}.btn.gold{background:var(--gold);color:#2f2a1d}.btn.danger{background:#f4e7e4;color:var(--danger)}.btn.full{width:100%}.btn.big{padding:15px;font-size:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;color:var(--ink)}.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}.back{border:0;background:transparent;color:var(--brand);font-weight:800;padding:8px 0}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow:auto;padding:9px 0 10px;background:linear-gradient(var(--bg) 72%,rgba(245,243,235,0));scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:12px}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.notice{font-size:12px;line-height:1.55;color:#66756f;background:#f0f2ed;border-radius:13px;padding:10px 12px}.source{font-size:11px;line-height:1.55;color:var(--muted);padding:6px 4px 20px}.official{border-left:4px solid var(--gold)}.official-label{font-size:11px;font-weight:850;color:#7c632e;text-transform:uppercase;letter-spacing:.05em}.anchor-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.mini{background:#f3f5ef;border-radius:15px;padding:11px}.mini b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}.quote{font-size:14px;line-height:1.58;margin:9px 0 0}.startbox{padding:18px;border:1px solid rgba(212,169,79,.35);background:linear-gradient(145deg,#fffdf7,#fff7df)}.startbox h3{margin:0 0 6px}.startbox p{margin:0 0 13px;font-size:13px;color:var(--muted);line-height:1.5}.station{display:grid;grid-template-columns:54px 1fr;gap:12px;position:relative}.station-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:var(--soft)}.station.soft .station-icon{background:var(--soft)}.station.sand .station-icon{background:var(--sand)}.station.sky .station-icon{background:var(--sky)}.station.rose .station-icon{background:var(--rose)}.station.green .station-icon{background:var(--green)}.station.violet .station-icon{background:var(--violet)}.station h3{font-size:15px;margin:1px 0 5px}.range{font-size:11px;font-weight:850;color:var(--brand);text-transform:uppercase;letter-spacing:.03em}.scene{font-size:13px;line-height:1.55;color:#50645c;margin:6px 0}.cue{font-size:12px;line-height:1.5;background:rgba(23,111,91,.06);border-radius:11px;padding:8px 9px}.triggers{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.trigger{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;font-size:15px;direction:rtl}.arabic{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;font-size:31px;line-height:1.9;text-align:right;direction:rtl;color:#102f28}.latin{font-size:13px;line-height:1.55;font-style:italic;color:#34524a}.translation{font-size:13px;line-height:1.55;color:#66746f;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.footnote{font-size:11px;line-height:1.45;color:#7a6d54;margin-top:7px;background:#fbf4df;padding:8px;border-radius:10px}.ayah{padding:17px 15px}.ayah-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.anum{width:31px;height:31px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:850}.stage-tag{font-size:10px;border-radius:999px;padding:6px 8px;background:#f0f2ed;color:var(--muted);font-weight:750}.stage-tag.s3,.stage-tag.s4,.stage-tag.s5{background:var(--soft);color:var(--brand)}.guide-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}.guide-step{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:850}.guide-title{font-size:20px;margin:3px 0}.guide-box{background:linear-gradient(145deg,#fffdf8,#f6f3e8);border-radius:20px;padding:17px;margin:12px 0}.guide-box.covered{min-height:190px;display:grid;place-items:center;text-align:center;background:#eef3ef}.covered-icon{font-size:42px}.prompt{border-radius:18px;background:#f0f4ef;padding:16px;margin:13px 0;text-align:center}.prompt .arabic{text-align:center;font-size:27px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.answer{border-radius:16px;background:#fff8e7;border:1px solid #ecdfb7;padding:14px;margin-top:10px}.answer .arabic{text-align:center;font-size:28px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.stagebar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}.stagebar span{height:7px;border-radius:8px;background:#e5e9e6}.stagebar span.on{background:var(--brand)}.mastery-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.legend{font-size:10px;line-height:1.3;background:#f1f3ef;border-radius:11px;padding:8px}.legend b{display:block;color:var(--brand);font-size:12px}.verse-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.vcell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:850;background:#ecefeb;color:#6d7974}.vcell.s1{background:#f5ecd8}.vcell.s2{background:#e7f0f7}.vcell.s3{background:#dceee7;color:#176f5b}.vcell.s4{background:#c8e5da;color:#115545}.vcell.s5{background:#176f5b;color:#fff}.due-card{border-left:4px solid var(--gold)}.due-num{font-size:28px;font-weight:900;line-height:1}.cycle{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}.day{padding:8px 2px;border-radius:10px;text-align:center;background:#eef2ed;font-size:10px}.day strong{display:block;color:var(--brand);font-size:12px}.review-item{font-size:12px;background:#f2f4f0;border-radius:12px;padding:9px;margin:6px 0}.checkpoint{background:linear-gradient(145deg,#edf6f1,#fffdf8);border:1px solid #d5e8df}.success{font-size:42px;text-align:center;margin:8px}.muted{color:var(--muted)}.score{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}.danger-link{border:0;background:transparent;color:var(--danger);font-size:11px;text-decoration:underline}.empty{padding:22px;text-align:center;color:var(--muted)}
.howto{background:linear-gradient(145deg,#fffdf8,#f0f7f3)}.howto h2{margin:0 0 5px;font-size:18px}.howto-intro{font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 13px}.howto-grid{display:grid;gap:8px}.howto-step{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px}.howto-num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:900}.howto-step b{display:block;font-size:13px;margin:1px 0 3px}.howto-step p{margin:0;font-size:12px;line-height:1.45;color:#5f7069}.howto-tip{margin-top:11px;padding:10px 11px;border-radius:13px;background:#fff7df;border:1px solid #ecdfb7;font-size:12px;line-height:1.5;color:#6e5b2d}.mastery-mini{display:flex;gap:5px;overflow:auto;margin-top:10px;scrollbar-width:none}.mastery-mini span{white-space:nowrap;border-radius:999px;background:#eef2ed;padding:6px 8px;font-size:10px;color:#5e6d67}.mastery-mini span:last-child{background:var(--brand);color:#fff}

<script>
const SURAH = {"112":{"number":112,"name":"Al-Ikhlas","arabicName":"الإخلاص","level":"Level 1","difficulty":"Proof of Concept","objectEmoji":"🦕","mfq":{"code":"DDN","object":"Dinosaurus","scene":"Dinosaurus berdiri sendiri dengan hati yang tulus dan ikhlas.","story":"Dinosaurus menolong makhluk lain dengan tulus tanpa mengharapkan pujian. Keikhlasan itu mengingatkan Surah Al-Ikhlas.","meaning":"Ikhlas"},"chunks":[{"range":[1,2],"title":"Allah Maha Esa & tempat bergantung","cue":"Esa → tempat bergantung","memoryEmoji":"☝️","memoryScene":"Dinosaurus melihat tanda angka 1 yang sangat jelas, lalu sebuah tempat bergantung yang kokoh. Ingat: Maha Esa → tempat bergantung.","memoryColor":"soft"},{"range":[3,4],"title":"Tidak beranak & tidak ada yang setara","cue":"Tidak beranak → tidak setara","memoryEmoji":"🔗","memoryScene":"Dinosaurus melihat rantai keturunan yang berhenti dan dua bentuk yang tidak pernah memiliki pasangan yang setara. Ingat: tidak beranak/diperanakkan → tidak ada yang setara.","memoryColor":"sand"}],"verses":[{"n":1,"a":"قُلْ هُوَ اللّٰهُ اَحَدٌۚ","l":"Qul huwallāhu aḥad(un).","t":"Katakanlah (Nabi Muhammad), “Dialah Allah Yang Maha Esa."},{"n":2,"a":"اَللّٰهُ الصَّمَدُۚ","l":"Allāhuṣ-ṣamad(u).","t":"Allah tempat meminta segala sesuatu."},{"n":3,"a":"لَمْ يَلِدْ وَلَمْ يُوْلَدْۙ","l":"Lam yalid wa lam yūlad.","t":"Dia tidak beranak dan tidak pula diperanakkan"},{"n":4,"a":"وَلَمْ يَكُنْ لَّهٗ كُفُوًا اَحَدٌ ࣖ","l":"Wa lam yakul lahū kufuwan aḥad(un).","t":"serta tidak ada sesuatu pun yang setara dengan-Nya.”"}]},"93":{"number":93,"name":"Ad-Duha","arabicName":"الضحى","level":"Level 2","difficulty":"Surah Sedang","objectEmoji":"🖼️","mfq":{"code":"GM","object":"Gambar","scene":"Gambar disinari cahaya matahari pagi hingga tampak terang dan jelas.","story":"Gambar itu menjadi terang dan jelas ketika disinari matahari pagi. Waktu duha tersebut mengingatkan Surah Ad-Duha.","meaning":"Duha"},"chunks":[{"range":[1,5],"title":"Duha, malam, penghiburan & janji","cue":"Duha → malam → tidak ditinggalkan → akhirat → karunia","memoryEmoji":"🌅","memoryScene":"Gambar diterangi duha, lalu suasana berubah menjadi malam yang tenang. Gambar tetap tergantung—tidak ditinggalkan—kemudian tampak panah menuju masa depan dan sebuah karunia.","memoryColor":"soft"},{"range":[6,8],"title":"Tiga nikmat: perlindungan, petunjuk, kecukupan","cue":"Yatim → petunjuk → kecukupan","memoryEmoji":"🛤️","memoryScene":"Gambar berubah menjadi tiga bingkai: seorang yatim mendapat perlindungan, jalan yang membingungkan mendapat petunjuk, dan kebutuhan berubah menjadi kecukupan.","memoryColor":"sky"},{"range":[9,11],"title":"Tiga respons: yatim, peminta, syukur","cue":"Jangan sewenang-wenang → jangan menghardik → ceritakan nikmat","memoryEmoji":"🤲","memoryScene":"Gambar menampilkan tiga tindakan: menjaga anak yatim, tidak menghardik orang yang meminta, lalu menceritakan nikmat dengan syukur.","memoryColor":"sand"}],"verses":[{"n":1,"a":"وَالضُّحٰىۙ","l":"Waḍ-ḍuḥā.","t":"Demi waktu duha"},{"n":2,"a":"وَالَّيْلِ اِذَا سَجٰىۙ","l":"Wal-laili iżā sajā.","t":"dan demi waktu malam apabila telah sunyi,"},{"n":3,"a":"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلٰىۗ","l":"Mā wadda‘aka rabbuka wa mā qalā.","t":"Tuhanmu (Nabi Muhammad) tidak meninggalkan dan tidak (pula) membencimu."},{"n":4,"a":"وَلَلْاٰخِرَةُ خَيْرٌ لَّكَ مِنَ الْاُوْلٰىۗ","l":"Wa lal-ākhiratu khairul laka minal-ūlā.","t":"Sungguh, akhirat itu lebih baik bagimu daripada yang permulaan (dunia)."},{"n":5,"a":"وَلَسَوْفَ يُعْطِيْكَ رَبُّكَ فَتَرْضٰىۗ","l":"Wa lasaufa yu‘ṭīka rabbuka fa tarḍā.","t":"Sungguh, kelak (di akhirat nanti) Tuhanmu pasti memberikan karunia-Nya kepadamu sehingga engkau rida."},{"n":6,"a":"اَلَمْ يَجِدْكَ يَتِيْمًا فَاٰوٰىۖ","l":"Alam yajidka yatīman fa āwā.","t":"Bukankah Dia mendapatimu sebagai seorang yatim, lalu Dia melindungi(-mu);"},{"n":7,"a":"وَوَجَدَكَ ضَاۤلًّا فَهَدٰىۖ","l":"Wa wajadaka ḍāllan fa hadā.","t":"mendapatimu sebagai seorang yang tidak tahu (tentang syariat), lalu Dia memberimu petunjuk (wahyu);"},{"n":8,"a":"وَوَجَدَكَ عَاۤىِٕلًا فَاَغْنٰىۗ","l":"Wa wajadaka ‘ā'ilan fa agnā.","t":"dan mendapatimu sebagai seorang yang fakir, lalu Dia memberimu kecukupan?"},{"n":9,"a":"فَاَمَّا الْيَتِيْمَ فَلَا تَقْهَرْۗ","l":"Fa ammal-yatīma falā taqhar.","t":"Terhadap anak yatim, janganlah engkau berlaku sewenang-wenang."},{"n":10,"a":"وَاَمَّا السَّاۤىِٕلَ فَلَا تَنْهَرْ","l":"Wa ammas-sā'ila falā tanhar.","t":"Terhadap orang yang meminta-minta, janganlah engkau menghardik."},{"n":11,"a":"وَاَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ ࣖ","l":"Wa ammā bini‘mati rabbika fa ḥaddiṡ.","t":"Terhadap nikmat Tuhanmu, nyatakanlah (dengan bersyukur)."}]},"78":{"number":78,"name":"An-Naba","arabicName":"النبأ","level":"Level 3","difficulty":"Stress Test","objectEmoji":"🧪","mfq":{"code":"TB","object":"Tabung","scene":"Tabung berdiri tegak di dalam laboratorium.","story":"Tabung itu mengeluarkan suara keras seperti sebuah berita besar. Berita tersebut mengingatkan Surah An-Naba.","meaning":"Berita Besar"},"chunks":[{"range":[1,5],"title":"Berita besar & kepastian","cue":"Bertanya → berita besar → berselisih → kelak tahu","memoryEmoji":"📣","memoryScene":"Tabung mengeluarkan bunyi seperti pengumuman besar. Orang-orang bertanya dan berselisih, lalu dua kali muncul tanda: “kelak akan mengetahui”.","memoryColor":"soft"},{"range":[6,16],"title":"Tanda-tanda penciptaan","cue":"Bumi → gunung → pasangan → tidur → malam → siang → langit → matahari → hujan → tumbuhan → kebun","memoryEmoji":"🌍","memoryScene":"Dari tabung muncul panorama berurutan: bumi, gunung, pasangan, tidur, malam, siang, tujuh langit, matahari, hujan, tumbuhan, lalu kebun rindang.","memoryColor":"sky"},{"range":[17,20],"title":"Hari Keputusan","cue":"Waktu ditetapkan → sangkakala → langit terbuka → gunung fatamorgana","memoryEmoji":"📯","memoryScene":"Tabung menjadi penanda waktu. Sangkakala ditiup, langit terbuka seperti pintu-pintu, dan gunung bergerak hingga tampak seperti fatamorgana.","memoryColor":"sand"},{"range":[21,30],"title":"Jahanam & balasan","cue":"Jahanam → pelampau batas → lama → panas → balasan → hisab → dusta → catatan → azab","memoryEmoji":"🔥","memoryScene":"Tabung melewati gerbang peringatan: Jahanam, pelampau batas, masa yang lama, panas, balasan, hisab, pendustaan, catatan, lalu azab.","memoryColor":"rose"},{"range":[31,36],"title":"Kemenangan orang bertakwa","cue":"Kemenangan → kebun → pasangan → gelas → tanpa dusta → pemberian Tuhan","memoryEmoji":"🌿","memoryScene":"Tabung keluar menuju taman: kemenangan, kebun dan anggur, pasangan, gelas penuh, tanpa ucapan sia-sia, lalu pemberian dari Tuhan.","memoryColor":"green"},{"range":[37,40],"title":"Kekuasaan Allah & hari yang benar","cue":"Tuhan langit-bumi → saf malaikat → hari hak → peringatan terakhir","memoryEmoji":"⚖️","memoryScene":"Tabung berhenti pada pemandangan langit dan bumi. Malaikat berbaris, hari yang pasti datang ditegaskan, lalu peringatan terakhir menutup perjalanan.","memoryColor":"violet"}],"verses":[{"n":1,"a":"عَمَّ يَتَسَاۤءَلُوْنَۚ ","l":"‘Amma yatasā'alūn(a).","t":"Tentang apakah mereka saling bertanya?"},{"n":2,"a":"عَنِ النَّبَاِ الْعَظِيْمِۙ ","l":"‘Anin naba'il-‘aẓīm(i).","t":"Tentang berita yang besar (hari Kebangkitan)"},{"n":3,"a":"الَّذِيْ هُمْ فِيْهِ مُخْتَلِفُوْنَۗ ","l":"Allażī hum fīhi mukhtalifūn(a).","t":"yang dalam hal itu mereka berselisih."},{"n":4,"a":"كَلَّا سَيَعْلَمُوْنَۙ ","l":"Kallā saya‘lamūn(a).","t":"Sekali-kali tidak! Kelak mereka akan mengetahui."},{"n":5,"a":"ثُمَّ كَلَّا سَيَعْلَمُوْنَ","l":"Ṡumma kallā saya‘lamūn(a).","t":"Sekali lagi, tidak! Kelak mereka akan mengetahui. "},{"n":6,"a":"اَلَمْ نَجْعَلِ الْاَرْضَ مِهٰدًاۙ","l":"Alam naj‘alil-arḍa mihādā(n).","t":"Bukankah Kami telah menjadikan bumi sebagai hamparan "},{"n":7,"a":"وَّالْجِبَالَ اَوْتَادًاۖ","l":"Wal-jibāla autādā(n).","t":"dan gunung-gunung sebagai pasak?"},{"n":8,"a":"وَّخَلَقْنٰكُمْ اَزْوَاجًاۙ ","l":"Wa khalaqnākum azwājā(n).","t":"Kami menciptakan kamu berpasang-pasangan."},{"n":9,"a":"وَّجَعَلْنَا نَوْمَكُمْ سُبَاتًاۙ ","l":"Wa ja‘alnā naumakum subātā(n).","t":"Kami menjadikan tidurmu untuk beristirahat."},{"n":10,"a":"وَّجَعَلْنَا الَّيْلَ لِبَاسًاۙ ","l":"Wa ja‘alnal-laila libāsā(n).","t":"Kami menjadikan malam sebagai pakaian.742)","note":"742) Malam disebut sebagai pakaian karena kegelapannya menutupi alam sebagaimana pakaian menutupi tubuh manusia."},{"n":11,"a":"وَّجَعَلْنَا النَّهَارَ مَعَاشًاۚ","l":"Wa ja‘alnan-nahāra ma‘āsyā(n).","t":"Kami menjadikan siang untuk mencari penghidupan."},{"n":12,"a":"وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًاۙ ","l":"Wa banainā fauqakum sab‘an syidādā(n).","t":"Kami membangun tujuh (langit) yang kukuh di atasmu."},{"n":13,"a":"وَّجَعَلْنَا سِرَاجًا وَّهَّاجًاۖ","l":"Wa ja‘alnā sirājaw wahhājā(n).","t":"Kami menjadikan pelita yang terang-benderang (matahari)."},{"n":14,"a":"وَّاَنْزَلْنَا مِنَ الْمُعْصِرٰتِ مَاۤءً ثَجَّاجًاۙ","l":"Wa anzalnā minal-mu‘ṣirāti mā'an ṡajjājā(n).","t":"Kami menurunkan dari awan air hujan yang tercurah dengan deras "},{"n":15,"a":"لِّنُخْرِجَ بِهٖ حَبًّا وَّنَبَاتًاۙ","l":"Linukhrija bihī ḥabbaw wa nabātā(n).","t":"agar Kami menumbuhkan dengannya biji-bijian, tanam-tanaman,"},{"n":16,"a":"وَّجَنّٰتٍ اَلْفَافًاۗ","l":"Wa jannātin alfāfā(n).","t":"dan kebun-kebun yang rindang."},{"n":17,"a":"اِنَّ يَوْمَ الْفَصْلِ كَانَ مِيْقَاتًاۙ","l":"Inna yaumal-faṣli kāna mīqātā(n).","t":"Sesungguhnya hari Keputusan itu adalah waktu yang telah ditetapkan,"},{"n":18,"a":"يَّوْمَ يُنْفَخُ فِى الصُّوْرِ فَتَأْتُوْنَ اَفْوَاجًاۙ","l":"Yauma yunfakhu fiṣ-ṣūri fa ta'tūna afwājā(n).","t":"(yaitu) hari (ketika) sangkakala ditiup, lalu kamu datang berbondong-bondong."},{"n":19,"a":"وَّفُتِحَتِ السَّمَاۤءُ فَكَانَتْ اَبْوَابًاۙ","l":"Wa futiḥatis-samā'u fa kānat abwābā(n).","t":"Langit pun dibuka. Maka, terdapatlah beberapa pintu."},{"n":20,"a":"وَّسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًاۗ","l":"Wa suyyiratil-jibālu fa kānat sarābā(n).","t":"Gunung-gunung pun dijalankan. Maka, ia menjadi (seperti) fatamorgana."},{"n":21,"a":"اِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًاۙ","l":"Inna jahannama kānat mirṣādā(n).","t":"Sesungguhnya (neraka) Jahanam itu (merupakan) tempat mengintai (bagi penjaga neraka) "},{"n":22,"a":"لِّلطّٰغِيْنَ مَاٰبًاۙ","l":"Liṭ-ṭāgīna ma'ābā(n).","t":"(dan) menjadi tempat kembali bagi orang-orang yang melampaui batas."},{"n":23,"a":"لّٰبِثِيْنَ فِيْهَآ اَحْقَابًاۚ","l":"Lābiṡīna fīhā aḥqābā(n).","t":"Mereka tinggal di sana dalam masa yang lama."},{"n":24,"a":"لَا يَذُوْقُوْنَ فِيْهَا بَرْدًا وَّلَا شَرَابًاۙ","l":"Lā yażūqūna fīhā bardaw wa lā syarābā(n).","t":"Mereka tidak merasakan kesejukan di dalamnya dan tidak (pula mendapat) minuman,"},{"n":25,"a":"اِلَّا حَمِيْمًا وَّغَسَّاقًاۙ","l":"Illā ḥamīmaw wa gassāqā(n).","t":"selain air yang mendidih dan nanah,"},{"n":26,"a":"جَزَاۤءً وِّفَاقًاۗ","l":"Jazā'aw wifāqā(n).","t":"sebagai pembalasan yang setimpal."},{"n":27,"a":"اِنَّهُمْ كَانُوْا لَا يَرْجُوْنَ حِسَابًاۙ","l":"Innahum kānū lā yarjūna ḥisābā(n).","t":"Sesungguhnya mereka tidak pernah mengharapkan perhitungan."},{"n":28,"a":"وَّكَذَّبُوْا بِاٰيٰتِنَا كِذَّابًاۗ","l":"Wa każżabū bi'āyātinā kiżżābā(n).","t":"Mereka benar-benar mendustakan ayat-ayat Kami."},{"n":29,"a":"وَكُلَّ شَيْءٍ اَحْصَيْنٰهُ كِتٰبًاۙ","l":"Wa kulla syai'in aḥṣaināhu kitābā(n).","t":"Segala sesuatu telah Kami catat dalam kitab (catatan amal manusia). "},{"n":30,"a":"فَذُوْقُوْا فَلَنْ نَّزِيْدَكُمْ اِلَّا عَذَابًا ࣖ","l":"Fa żūqū falan nazīdakum illā ‘ażābā(n)","t":"Oleh karena itu, rasakanlah! Tidak akan Kami tambahkan kepadamu, kecuali azab."},{"n":31,"a":"اِنَّ لِلْمُتَّقِيْنَ مَفَازًاۙ","l":"Inna lil-muttaqīna mafāzā(n).","t":"Sesungguhnya bagi orang-orang yang bertakwa (ada) kemenangan (surga),"},{"n":32,"a":"حَدَاۤىِٕقَ وَاَعْنَابًاۙ","l":"Ḥadā'iqa wa a‘nābā(n).","t":"(yaitu) kebun-kebun, buah anggur,"},{"n":33,"a":"وَّكَوَاعِبَ اَتْرَابًاۙ","l":"Wa kawā‘iba atrābā(n).","t":"gadis-gadis molek yang sebaya,"},{"n":34,"a":"وَّكَأْسًا دِهَاقًاۗ","l":"Wa ka'san dihāqā(n).","t":"dan gelas-gelas yang penuh (berisi minuman)."},{"n":35,"a":"لَا يَسْمَعُوْنَ فِيْهَا لَغْوًا وَّلَا كِذّٰبًا","l":"Lā yasma‘ūna fīhā lagwaw wa lā kiżżābā(n).","t":"Di sana mereka tidak mendengar percakapan yang sia-sia dan tidak pula (perkataan) dusta."},{"n":36,"a":"جَزَاۤءً مِّنْ رَّبِّكَ عَطَاۤءً حِسَابًاۙ","l":"Jazā'am mir rabbika ‘aṭā'an ḥisābā(n).","t":"(Hal itu) sebagai balasan (dan) pemberian yang banyak dari Tuhanmu,"},{"n":37,"a":"رَّبِّ السَّمٰوٰتِ وَالْاَرْضِ وَمَا بَيْنَهُمَا الرَّحْمٰنِ لَا يَمْلِكُوْنَ مِنْهُ خِطَابًاۚ ","l":"Rabbis-samāwāti wal-arḍi wa mā bainahumar-raḥmāni lā yamlikūna minhu khiṭābā(n).","t":"(yaitu) Tuhan (pemelihara) langit, bumi, dan apa yang ada di antara keduanya, Yang Maha Pengasih. Mereka tidak memiliki (hak) berbicara dengan-Nya."},{"n":38,"a":"يَوْمَ يَقُوْمُ الرُّوْحُ وَالْمَلٰۤىِٕكَةُ صَفًّاۙ  لَّا يَتَكَلَّمُوْنَ اِلَّا مَنْ اَذِنَ لَهُ الرَّحْمٰنُ وَقَالَ صَوَابًا","l":"Yauma yaqūmur-rūḥu wal-malā'ikatu ṣaffā(n), lā yatakallamūna illā man ażina lahur-raḥmānu wa qāla ṣawābā(n).","t":"Pada hari ketika Rūḥ743) dan malaikat berdiri bersaf-saf. Mereka tidak berbicara, kecuali yang diizinkan oleh Tuhan Yang Maha Pengasih dan dia mengatakan yang benar.","note":"743) Para ahli tafsir berbeda pendapat mengenai maksud rūḥ pada ayat ini. Ada yang memahaminya sebagai Jibril, tentara Allah, atau malaikat yang diserahi tugas mengurus arwah dan sejenisnya."},{"n":39,"a":"ذٰلِكَ الْيَوْمُ الْحَقُّۚ فَمَنْ شَاۤءَ اتَّخَذَ اِلٰى رَبِّهٖ مَاٰبًا","l":"Żālikal-yaumul-ḥaqq(u), faman syā'attakhaża ilā rabbihī ma'ābā(n).","t":"Itulah hari yang hak (pasti terjadi). Siapa yang menghendaki (keselamatan) niscaya menempuh jalan kembali kepada Tuhannya (dengan beramal saleh)."},{"n":40,"a":"اِنَّآ اَنْذَرْنٰكُمْ عَذَابًا قَرِيْبًا ەۙ يَّوْمَ يَنْظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُوْلُ الْكٰفِرُ يٰلَيْتَنِيْ كُنْتُ تُرٰبًا ࣖ","l":"Innā anżarnākum ‘ażāban qarībā(n), yauma yanẓurul-mar'u mā qaddamat yadāhu wa yaqūlul-kāfiru yā laitanī kuntu turābā(n).","t":"Sesungguhnya Kami telah memperingatkan kamu akan azab yang dekat pada hari (ketika) manusia melihat apa yang telah diperbuat oleh kedua tangannya dan orang kafir berkata, “Oh, seandainya saja aku menjadi tanah.”"}]}};
const KEYS={mastery:'mfq30_mastery_v02',prefs:'mfq30_prefs_v02',migrated:'mfq30_migrated_v02'};
const REVIEW_DAYS=[1,3,7,14,30];

function load(k,d){try{let x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let prefs=load(KEYS.prefs,load('mfq30_prefs_v01',{latin:true,translation:true}));
function migrateV01(){if(load(KEYS.migrated,false))return;let old=load('mfq30_progress_v01',{}),m=load(KEYS.mastery,{});Object.keys(old).forEach(k=>{if(old[k]&&!m[k])m[k]={stage:2}});save(KEYS.mastery,m);save(KEYS.migrated,true)}
migrateV01();
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(dateStr,n){let [y,m,d]=dateStr.split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function mastery(){return load(KEYS.mastery,{})}
function rec(sn,an){return mastery()[sn+'-'+an]||{stage:0}}
function setRec(sn,an,obj){let m=mastery(),k=sn+'-'+an;m[k]=Object.assign({},m[k]||{stage:0},obj);save(KEYS.mastery,m)}
function ensureSchedule(r){if((r.stage||0)>=3&&!r.masteredAt){r.masteredAt=today();r.reviewIndex=0;r.nextReview=addDays(r.masteredAt,REVIEW_DAYS[0])}return r}
function setStage(sn,an,stage){let r=rec(sn,an);r.stage=Math.max(r.stage||0,stage);r=ensureSchedule(r);setRec(sn,an,r)}
function reviewPass(sn,an){let r=ensureSchedule(rec(sn,an));r.stage=Math.max(r.stage||0,5);r.lastReview=today();let idx=Number.isInteger(r.reviewIndex)?r.reviewIndex:0;idx++;r.reviewIndex=idx;r.nextReview=idx<REVIEW_DAYS.length?addDays(r.masteredAt,REVIEW_DAYS[idx]):null;setRec(sn,an,r)}
function reviewFail(sn,an){let r=ensureSchedule(rec(sn,an));r.lastReview=today();r.nextReview=addDays(today(),1);setRec(sn,an,r)}
function dueItems(sn=null){let out=[];Object.values(SURAH).forEach(s=>{if(sn&&s.number!=sn)return;s.verses.forEach(v=>{let r=rec(s.number,v.n);if((r.stage||0)>=3&&r.nextReview&&r.nextReview<=today())out.push({sn:s.number,an:v.n,due:r.nextReview})})});return out}
function masteryPct(sn){let s=SURAH[sn],sum=s.verses.reduce((a,v)=>a+(rec(sn,v.n).stage||0),0);return Math.round(sum/(s.verses.length*5)*100)}
function strongCount(sn){return SURAH[sn].verses.filter(v=>(rec(sn,v.n).stage||0)>=5).length}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function arabicTrigger(a,n=2){return a.trim().split(/\s+/).slice(0,n).join(' ')}
function tailArabic(a,n=3){let w=a.trim().split(/\s+/);return w.slice(-Math.min(n,w.length)).join(' ')}
function rand(max){return Math.floor(Math.random()*max)}
function header(back=false,title='MFQ Juz 30 Lab'){return `<div class="header">${back?'<button class="back" onclick="goHome()">← Beranda</button>':'<div class="logo">MFQ</div>'}<div><h1>${title}</h1><div class="sub">Eksperimen hafalan • Qur’an Kemenag RI • v0.2.1</div></div></div>`}
function sourceBlock(){return `<div class="source"><b>Baseline Qur’an:</b> Kementerian Agama Republik Indonesia. Teks Arab, transliterasi Latin, dan terjemahan dipertahankan dari baseline v0.1. <b>MFQ Official Anchor:</b> MFQ v3.2 FINAL. Memory Journey/Station, Arabic Trigger, latihan, dan sistem mastery adalah lapisan eksperimen dan tidak mengubah data resmi MFQ.<br><br>Audio belum diaktifkan pada v0.2 agar prototipe tetap ringan. Validasi akhir langsung terhadap sumber resmi Kemenag tetap wajib sebelum distribusi publik.</div>`}
function home(){let order=[112,93,78],due=dueItems();return `${header()}<section class="card hero"><span class="badge">MFQ MEMORY JOURNEY • v0.2</span><h2>Aplikasi membimbing cara menghafal.</h2><p>Bukan hanya membaca ayat. Mulai dari jangkar MFQ, masuk ke Memory Station, hafalkan ayat bertahap, sambungkan, lalu uji recall dan murajaah.</p><div class="flow"><span>Object</span><span>→ Journey</span><span>→ Ayat</span><span>→ Chain</span><span>→ Recall</span><span>→ Cycle</span></div></section>
<section class="card howto"><span class="badge">CARA MENGGUNAKAN</span><h2 style="margin-top:8px">Mulai dari sini 👇</h2><p class="howto-intro">Tidak perlu mempelajari semua menu. Ikuti alur ini; aplikasi akan mengurangi bantuan sedikit demi sedikit sampai ayat dapat dilafalkan tanpa melihat.</p><div class="howto-grid">
<div class="howto-step"><div class="howto-num">1</div><div><b>Pilih surah</b><p>Untuk percobaan pertama, mulai dari <b>Al-Ikhlas</b>. Setelah membuka surah, tekan <b>Mulai / Lanjut Menghafal</b>.</p></div></div>
<div class="howto-step"><div class="howto-num">2</div><div><b>Kenali jangkar MFQ & Memory Station</b><p>Lihat Object MFQ sebagai pintu masuk surah, lalu pahami Station sebagai “alamat mental” kelompok ayat yang sedang dihafal.</p></div></div>
<div class="howto-step"><div class="howto-num">3</div><div><b>Ikuti latihan terpandu</b><p>Baca ayat → coba dengan bantuan → tutup teks → ucapkan tanpa melihat. Jangan buru-buru naik tahap bila masih ragu.</p></div></div>
<div class="howto-step"><div class="howto-num">4</div><div><b>Sambungkan ayat</b><p>Gunakan <b>Chain & Ayat Bridge</b>: setelah hafal satu ayat, langsung latih hubungan akhir ayat sebelumnya dengan awal ayat berikutnya.</p></div></div>
<div class="howto-step"><div class="howto-num">5</div><div><b>Uji Recall</b><p>Coba mulai bukan hanya dari ayat pertama. Aplikasi menguji <b>Forward, Position, dan Bridge Recall</b> agar hafalan tidak bergantung pada satu jalur.</p></div></div>
<div class="howto-step"><div class="howto-num">6</div><div><b>Lakukan murajaah saat muncul di Beranda</b><p>Bila ada kartu <b>Murajaah Hari Ini</b>, kerjakan terlebih dahulu. Jadwal pengulangan mengikuti siklus H0 → H1 → H3 → H7 → H14 → H30.</p></div></div>
</div><div class="mastery-mini"><span>Baru</span><span>Dibaca</span><span>Dengan bantuan</span><span>Tanpa melihat</span><span>Lulus Bridge</span><span>Hafal kuat</span></div><div class="howto-tip"><b>Prinsip penting:</b> gunakan <b>Latin dan arti hanya sebagai bantuan</b>. Saat mulai lancar, gunakan <b>Mode Fokus</b> agar perhatian kembali ke teks Arab dan sambungan ayat.</div></section>
${due.length?`<section class="card due-card"><div class="toprow"><div><div class="meta">MURAJAAH HARI INI</div><div class="due-num">${due.length}</div><div class="meta">ayat sudah jatuh tempo</div></div><button class="btn gold" onclick="startReview()">Mulai Murajaah</button></div></section>`:`<section class="card"><div class="toprow"><div><b>Murajaah hari ini</b><div class="meta">Belum ada ayat yang jatuh tempo.</div></div><span class="badge">✓</span></div></section>`}
<div class="section-title"><h2>3 Surah Eksperimen</h2><small>4 → 11 → 40 ayat</small></div><div class="surah-list">${order.map(n=>surahCard(SURAH[n])).join('')}</div>
<section class="card"><div class="section-title" style="margin:0 0 6px"><h2>Cycle Murajaah</h2><small>otomatis</small></div><div class="cycle">${[0,1,3,7,14,30].map(d=>`<div class="day"><strong>H${d}</strong>${d===0?'Hafal':'Ulang'}</div>`).join('')}</div><p class="notice" style="margin:12px 0 0">Setelah ayat mampu dilafalkan tanpa melihat, aplikasi menjadwalkan pengulangan berikutnya. Progress v0.1 yang pernah ditandai “Hafal” dimigrasikan secara konservatif menjadi tahap <b>Dengan bantuan</b>, bukan langsung dianggap hafal kuat.</p></section>${sourceBlock()}`}
function surahCard(s){let p=masteryPct(s.number);return `<section class="card surah-card"><div class="obj">${s.objectEmoji}</div><div onclick="openSurah(${s.number})"><span class="badge">${s.level}</span><h3>${s.name} <small class="muted">${s.number}</small></h3><div class="meta">${s.verses.length} ayat • MFQ ${s.mfq.object} (${s.mfq.code}) • ${strongCount(s.number)} hafal kuat</div><div class="progress-line"><i style="width:${p}%"></i></div></div><button class="arrow" onclick="openSurah(${s.number})" aria-label="Buka">›</button></section>`}
function goHome(){route={screen:'home',surah:null,tab:'journey'};guideState=null;reviewState=null;window.scrollTo(0,0);render()}
function openSurah(n){route={screen:'surah',surah:n,tab:'journey'};window.scrollTo(0,0);render()}
function setTab(t){route.tab=t;render();setTimeout(()=>window.scrollTo({top:80,behavior:'smooth'}),0)}
function tabs(){let ts=[['journey','Memory Journey'],['ayat','Ayat'],['bridge','Bridge'],['recall','Recall'],['progress','Progress']];return `<div class="tabs">${ts.map(([k,l])=>`<button class="tab ${route.tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`}
function nextGuideAyah(sn){let s=SURAH[sn],v=s.verses.find(x=>(rec(sn,x.n).stage||0)<3);if(v)return v.n;v=s.verses.find(x=>(rec(sn,x.n).stage||0)<5);return v?v.n:1}
function surahView(){let s=SURAH[route.surah],p=masteryPct(s.number),next=nextGuideAyah(s.number);return `${header(true)}<section class="card hero"><div class="toprow"><span class="badge">${s.level} • ${s.difficulty}</span><span style="font-size:12px">${p}% mastery</span></div><h2>${s.name} <span style="opacity:.55">${s.number}</span></h2><p>${s.verses.length} ayat • Jangkar MFQ: ${s.objectEmoji} ${s.mfq.object} • ${strongCount(s.number)} ayat hafal kuat</p></section>
<section class="card startbox"><h3>▶ Mulai / Lanjut Menghafal</h3><p>Aplikasi akan membawa langkah demi langkah dari ayat ${next}: lihat & baca → kurangi bantuan → recall → sambungkan.</p><button class="btn full big" onclick="startGuide(${s.number})">Mulai dari ayat ${next}</button></section>${tabs()}${tabContent(s)}${sourceBlock()}`}
function tabContent(s){if(route.tab==='journey')return journey(s);if(route.tab==='ayat')return ayatList(s);if(route.tab==='bridge')return bridge(s);if(route.tab==='recall')return recallView(s);return progressView(s)}
function journey(s){return `<section class="card official"><div class="official-label">MFQ Official Anchor • v3.2 FINAL</div><div class="anchor-grid"><div class="mini"><b>MFQ Code</b>${s.mfq.code}</div><div class="mini"><b>Official Object</b>${s.objectEmoji} ${s.mfq.object}</div><div class="mini"><b>Official Meaning</b>${s.mfq.meaning}</div><div class="mini"><b>Surah</b>${s.number}. ${s.name}</div></div><p class="quote"><b>Official Scene:</b> ${esc(s.mfq.scene)}</p><p class="quote"><b>Official Story:</b> ${esc(s.mfq.story)}</p></section>
<div class="notice" style="margin-bottom:10px"><b>Memory Journey Eksperimen:</b> Official Object menjadi jangkar masuk. Setiap kelompok ayat diberi “station” visual agar pengguna punya alamat mental. Station ini <b>bukan</b> pengganti Official Scene/Story MFQ.</div>${s.chunks.map((c,i)=>stationCard(s,c,i)).join('')}`}
function stationCard(s,c,i){let vs=s.verses.filter(v=>v.n>=c.range[0]&&v.n<=c.range[1]);return `<section class="card station ${c.memoryColor||'soft'}"><div class="station-icon">${c.memoryEmoji||'🧠'}</div><div><div class="range">Station ${i+1} • Ayat ${c.range[0]}–${c.range[1]}</div><h3>${esc(c.title)}</h3><div class="scene">${esc(c.memoryScene)}</div><div class="cue"><b>Rantai makna:</b> ${esc(c.cue)}</div><div class="triggers">${vs.map(v=>`<span class="trigger" title="Ayat ${v.n}">${v.n} · ${esc(arabicTrigger(v.a,2))}</span>`).join('')}</div><button class="chip" style="margin-top:10px" onclick="startGuide(${s.number},${c.range[0]})">Mulai station ini →</button></div></section>`}
function prefsBar(){return `<div class="toolbar" style="margin-bottom:11px"><button class="chip ${prefs.latin?'active':''}" onclick="togglePref('latin')">Latin ${prefs.latin?'✓':''}</button><button class="chip ${prefs.translation?'active':''}" onclick="togglePref('translation')">Arti ${prefs.translation?'✓':''}</button><button class="chip" onclick="focusMode()">Mode Fokus</button></div>`}
function togglePref(k){prefs[k]=!prefs[k];save(KEYS.prefs,prefs);render()}
function focusMode(){prefs={latin:false,translation:false};save(KEYS.prefs,prefs);render()}
function ayatList(s){return `${prefsBar()}<div class="notice" style="margin-bottom:10px">Daftar ayat untuk referensi. Untuk proses hafalan utama gunakan tombol <b>Mulai/Lanjut Menghafal</b>, agar bantuan dikurangi bertahap.</div>${s.verses.map(v=>ayahCard(s,v)).join('')}`}
function ayahCard(s,v){let st=rec(s.number,v.n).stage||0;return `<article class="card ayah"><div class="ayah-head"><span class="anum">${v.n}</span><span class="stage-tag s${st}">${STAGE_LABEL[st]}</span></div><div class="arabic">${esc(v.a)}</div><div class="latin ${prefs.latin?'':'hidden'}">${esc(v.l)}</div><div class="translation ${prefs.translation?'':'hidden'}">${esc(v.t)}</div>${v.note&&prefs.translation?`<div class="footnote">${esc(v.note)}</div>`:''}</article>`}
function stationFor(s,an){let idx=s.chunks.findIndex(c=>an>=c.range[0]&&an<=c.range[1]);return {idx:Math.max(0,idx),c:s.chunks[Math.max(0,idx)]}}
function startGuide(sn,an=null){let s=SURAH[sn];guideState={sn:Number(sn),an:an||nextGuideAyah(sn),phase:'read',revealed:false};route={screen:'guide',surah:Number(sn),tab:'journey'};window.scrollTo(0,0);render()}
function guidePhase(p){guideState.phase=p;guideState.revealed=false;render()}
function guideAdvance(){let s=SURAH[guideState.sn],cur=guideState.an;if(cur>=s.verses.length){route={screen:'surah',surah:s.number,tab:'progress'};guideState=null;render();return}guideState={sn:s.number,an:cur+1,phase:'read',revealed:false};render()}
function guideView(){let s=SURAH[guideState.sn],v=s.verses[guideState.an-1],sf=stationFor(s,v.n),c=sf.c,st=rec(s.number,v.n).stage||0;let body='';if(guideState.phase==='read'){body=`<div class="guide-step">Langkah 1 • Lihat & baca</div><h2 class="guide-title">Kenali ayat ${v.n}</h2><div class="guide-box"><div class="arabic">${esc(v.a)}</div><div class="latin">${esc(v.l)}</div><div class="translation">${esc(v.t)}</div></div><div class="notice">Baca perlahan <b>3 kali</b>. Latin adalah bantuan, bukan pengganti belajar bacaan yang benar.</div><button class="btn full big" style="margin-top:12px" onclick="setStage(${s.number},${v.n},1);guidePhase('assist')">Sudah dibaca 3× →</button>`}
else if(guideState.phase==='assist'){body=`<div class="guide-step">Langkah 2 • Kurangi bantuan</div><h2 class="guide-title">Ayat ${v.n} dengan teks Arab</h2><div class="guide-box"><div class="arabic">${esc(v.a)}</div></div><div class="cue"><b>Arabic Trigger:</b> <span class="arabic" style="font-size:24px;text-align:left;display:inline">${esc(arabicTrigger(v.a,2))}</span></div><p class="hint">Baca lagi 3×. Perhatikan bunyi awal ayat sebagai pemicu, bukan sebagai mnemonic pengganti lafaz.</p><button class="btn full big" onclick="setStage(${s.number},${v.n},2);guidePhase('recall')">Sekarang coba tanpa melihat →</button>`}
else if(guideState.phase==='recall'){body=`<div class="guide-step">Langkah 3 • Recall</div><h2 class="guide-title">Ucapkan ayat ${v.n} tanpa melihat</h2><div class="guide-box covered"><div><div class="covered-icon">🧠</div><div class="hint">Pemicu awal</div><div class="arabic" style="font-size:26px;text-align:center">${esc(arabicTrigger(v.a,2))}</div></div></div>${guideState.revealed?`<div class="answer"><div class="arabic">${esc(v.a)}</div><div class="latin">${esc(v.l)}</div></div><div class="controls"><button class="btn alt" onclick="guidePhase('assist')">Belum lancar</button><button class="btn" onclick="setStage(${s.number},${v.n},3);${v.n>c.range[0]?"guidePhase('chain')":"guideAdvance()"}">Bisa tanpa melihat ✓</button></div>`:`<button class="btn gold full" onclick="guideState.revealed=true;render()">Tampilkan untuk cek</button>`}`}
else{let prev=s.verses[v.n-2];body=`<div class="guide-step">Langkah 4 • Chain & Bridge</div><h2 class="guide-title">Sambungkan ayat ${v.n-1} → ${v.n}</h2><div class="prompt"><div class="hint">Akhir ayat ${v.n-1}</div><div class="arabic">${esc(tailArabic(prev.a))}</div><div class="hint">Lanjutkan ayat berikutnya, lalu ulang dari ayat ${c.range[0]} sampai ${v.n} tanpa melihat.</div></div>${guideState.revealed?`<div class="answer"><div class="arabic">${esc(v.a)}</div></div><div class="controls"><button class="btn alt" onclick="guidePhase('recall')">Ulangi</button><button class="btn" onclick="setStage(${s.number},${v.n},4);guideAdvance()">Bridge & chain lancar ✓</button></div>`:`<button class="btn gold full" onclick="guideState.revealed=true;render()">Cek ayat ${v.n}</button>`}`}
return `${header(true,'Mode Menghafal')}<section class="card checkpoint"><div class="guide-head"><div class="station-icon">${c.memoryEmoji}</div><div><div class="range">Station ${sf.idx+1} • Ayat ${c.range[0]}–${c.range[1]}</div><b>${esc(c.title)}</b></div></div><div class="scene">${esc(c.memoryScene)}</div></section><section class="card">${body}<div class="stagebar">${[1,2,3,4,5].map(x=>`<span class="${st>=x?'on':''}"></span>`).join('')}</div><div class="score">Status ayat ${v.n}: ${STAGE_LABEL[rec(s.number,v.n).stage||0]}</div></section><button class="back" onclick="openSurah(${s.number})">← Keluar dari mode menghafal</button>${sourceBlock()}`}
function bridgeCandidates(s){let arr=[];for(let n=2;n<=s.verses.length;n++){let boundary=s.chunks.some(c=>c.range[0]===n);arr.push(n);if(boundary){arr.push(n,n)}}return arr}
function bridgeQuestion(s,newQ=false){let k='b'+s.number;if(newQ||!practiceState[k]){let c=bridgeCandidates(s);practiceState[k]=c[rand(c.length)]}let n=practiceState[k];return {prev:s.verses[n-2],next:s.verses[n-1],boundary:s.chunks.some(c=>c.range[0]===n)}}
function bridge(s){let q=bridgeQuestion(s);return `${prefsBar()}<section class="card"><span class="badge">AYAT BRIDGE ${q.boundary?'• BATAS STATION':''}</span><h3>Apa awal ayat berikutnya?</h3><div class="prompt"><div class="hint">Akhir ayat ${q.prev.n}</div><div class="arabic">${esc(tailArabic(q.prev.a))}</div></div><div id="bridgeAns" class="answer hidden"><div class="arabic">${esc(q.next.a)}</div><div class="latin ${prefs.latin?'':'hidden'}">${esc(q.next.l)}</div></div><button class="btn gold full" onclick="document.getElementById('bridgeAns').classList.remove('hidden')">Cek Jawaban</button><div class="controls" style="margin-top:8px"><button class="btn alt" onclick="newBridge(${s.number})">Belum / soal baru</button><button class="btn" onclick="bridgePass(${s.number},${q.next.n})">Bisa menyambung ✓</button></div><p class="score">Batas antar-station muncul lebih sering karena biasanya di situlah posisi mudah terputus.</p></section>`}
function newBridge(sn){bridgeQuestion(SURAH[sn],true);render()}
function bridgePass(sn,an){setStage(sn,an,4);bridgeQuestion(SURAH[sn],true);render()}
function recallQuestion(s,newQ=false){let k='r'+s.number;if(newQ||!practiceState[k]){let modes=['forward','position','bridge'],mode=modes[rand(modes.length)],n=1+rand(s.verses.length);if(mode==='bridge'&&n===1)n=2;practiceState[k]={mode,n}}return practiceState[k]}
function recallView(s){let q=recallQuestion(s),v=s.verses[q.n-1],sf=stationFor(s,v.n),prev=s.verses[Math.max(0,v.n-2)],title,prompt;if(q.mode==='forward'){title='Forward Recall';prompt=`<div class="hint">Mulai dari ayat ${v.n}. Pemicu awal:</div><div class="arabic">${esc(arabicTrigger(v.a,2))}</div><div class="hint">Lafalkan ayat ini lalu teruskan sejauh yang mampu.</div>`}else if(q.mode==='position'){title='Position Recall';prompt=`<div class="hint">Station ${sf.idx+1}: <b>${esc(sf.c.title)}</b><br>Ayat ${v.n} berada di station ini. Ucapkan ayatnya tanpa melihat.</div>`}else{title='Bridge Recall';prompt=`<div class="hint">Setelah akhir ayat ${prev.n}:</div><div class="arabic">${esc(tailArabic(prev.a))}</div><div class="hint">Lanjutkan ayat berikutnya.</div>`}return `${prefsBar()}<section class="card"><span class="badge">3-MODE RECALL</span><h3>${title}</h3><div class="prompt">${prompt}</div><div id="recallAns" class="answer hidden"><div class="arabic">${esc(v.a)}</div><div class="latin ${prefs.latin?'':'hidden'}">${esc(v.l)}</div></div><button class="btn gold full" onclick="document.getElementById('recallAns').classList.remove('hidden')">Cek Jawaban</button><div class="controls" style="margin-top:8px"><button class="btn alt" onclick="newRecall(${s.number})">Belum lancar</button><button class="btn" onclick="recallPass(${s.number},${v.n})">Lancar ✓</button></div><p class="score">Tidak ada tes dari terjemahan. Recall sekarang menguji posisi, pemicu lafaz, dan sambungan ayat.</p></section>`}
function newRecall(sn){recallQuestion(SURAH[sn],true);render()}
function recallPass(sn,an){setStage(sn,an,5);recallQuestion(SURAH[sn],true);render()}
function progressView(s){let due=dueItems(s.number);return `<section class="card"><div class="toprow"><div><b>Mastery ${masteryPct(s.number)}%</b><div class="meta">${strongCount(s.number)} dari ${s.verses.length} ayat hafal kuat</div></div>${due.length?`<button class="btn gold" onclick="startReview(${s.number})">Murajaah ${due.length}</button>`:'<span class="badge">Tidak ada due</span>'}</div><div class="verse-grid" style="margin-top:14px">${s.verses.map(v=>{let st=rec(s.number,v.n).stage||0;return `<div class="vcell s${st}" title="Ayat ${v.n}: ${STAGE_LABEL[st]}">${v.n}</div>`}).join('')}</div></section>
<section class="card"><h3 style="margin-top:0">Tahap penguasaan</h3><div class="mastery-legend">${[0,1,2,3,4,5].map(i=>`<div class="legend"><b>${i}</b>${STAGE_LABEL[i]}</div>`).join('')}</div><p class="notice" style="margin-top:12px">Tahap 3 memulai jadwal murajaah. Tahap 4 berarti sambungan ayat sudah lolos Bridge. Tahap 5 diperoleh dari Recall.</p></section>
<section class="card"><h3 style="margin-top:0">Jadwal ayat yang sudah mulai dikuasai</h3>${s.verses.filter(v=>(rec(s.number,v.n).stage||0)>=3).map(v=>{let r=rec(s.number,v.n);return `<div class="review-item">Ayat ${v.n} • ${STAGE_LABEL[r.stage]} • ${r.nextReview?'ulang '+r.nextReview:'cycle selesai ✓'}</div>`}).join('')||'<div class="empty">Belum ada ayat yang masuk siklus murajaah.</div>'}<button class="danger-link" onclick="resetSurah(${s.number})">Reset progress surah ini</button></section>`}
function resetSurah(sn){if(!confirm('Reset seluruh progress surah ini?'))return;let m=mastery();Object.keys(m).filter(k=>k.startsWith(sn+'-')).forEach(k=>delete m[k]);save(KEYS.mastery,m);render()}
function startReview(sn=null){let q=dueItems(sn);if(!q.length){alert('Belum ada murajaah yang jatuh tempo.');return}reviewState={queue:q,idx:0,revealed:false,mode:'position'};route={screen:'review',surah:sn||null,tab:'progress'};window.scrollTo(0,0);render()}
function reviewCurrent(){return reviewState.queue[reviewState.idx]}
function reviewAnswer(ok){let q=reviewCurrent();ok?reviewPass(q.sn,q.an):reviewFail(q.sn,q.an);reviewState.idx++;reviewState.revealed=false;if(reviewState.idx>=reviewState.queue.length){reviewState.done=true}else{reviewState.mode=['position','bridge','trigger'][rand(3)]}render()}
function reviewView(){if(reviewState.done)return `${header(true,'Murajaah')}<section class="card checkpoint"><div class="success">✓</div><h2 style="text-align:center">Murajaah selesai</h2><p class="hint" style="text-align:center">Ayat yang lancar sudah dijadwalkan ke siklus berikutnya. Yang belum lancar akan muncul kembali lebih cepat.</p><button class="btn full" onclick="goHome()">Kembali ke Beranda</button></section>`;let q=reviewCurrent(),s=SURAH[q.sn],v=s.verses[q.an-1],sf=stationFor(s,v.n),prev=s.verses[Math.max(0,v.n-2)],prompt;if(reviewState.mode==='bridge'&&v.n>1)prompt=`<div class="hint">Sambungkan setelah akhir ayat ${v.n-1}</div><div class="arabic">${esc(tailArabic(prev.a))}</div>`;else if(reviewState.mode==='trigger')prompt=`<div class="hint">Pemicu awal ayat ${v.n}</div><div class="arabic">${esc(arabicTrigger(v.a,2))}</div>`;else prompt=`<div class="hint">${s.name} • Station ${sf.idx+1}: <b>${esc(sf.c.title)}</b><br>Ucapkan ayat ${v.n} tanpa melihat.</div>`;return `${header(true,'Murajaah')}<section class="card"><div class="toprow"><span class="badge">${reviewState.idx+1}/${reviewState.queue.length}</span><span class="meta">${s.name} • ayat ${v.n}</span></div><div class="prompt">${prompt}</div>${reviewState.revealed?`<div class="answer"><div class="arabic">${esc(v.a)}</div><div class="latin">${esc(v.l)}</div></div><div class="controls" style="margin-top:8px"><button class="btn alt" onclick="reviewAnswer(false)">Belum lancar</button><button class="btn" onclick="reviewAnswer(true)">Lancar ✓</button></div>`:`<button class="btn gold full" onclick="reviewState.revealed=true;render()">Cek Jawaban</button>`}</section><p class="notice">Murajaah memakai Position/Trigger/Bridge secara acak. Tujuannya agar hafalan tidak hanya kuat bila dimulai dari ayat pertama.</p>`}
function render(){let app=document.getElementById('app');if(route.screen==='home')app.innerHTML=home();else if(route.screen==='surah')app.innerHTML=surahView();else if(route.screen==='guide')app.innerHTML=guideView();else app.innerHTML=reviewView()}
render();
</script></body></html>
