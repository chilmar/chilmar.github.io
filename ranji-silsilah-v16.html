<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ranji Rumah Gadang Panca — Silsilah Keluarga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#1a1512; --surface:#221b16; --surface2:#2b221b; --border:#3c3126;
  --gold:#c9a24b; --gold-soft:#e6cd93; --brick:#9a4c34; --brick-soft:#c96b4d;
  --text:#ede4d3; --text-muted:#a99b84; --danger:#c15b48; --ok:#7a9a6b;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:90px;}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
::selection{background:var(--gold); color:#1a1512;}

/* HEADER */
header.top{
  position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:22px 18px 10px;
}
.brandrow{display:flex; align-items:center; gap:12px;}
.gunungan{width:34px; height:34px; flex-shrink:0;}
.brandrow h1{font-size:1.5rem; font-weight:600; margin:0; letter-spacing:0.3px; color:var(--gold-soft);}
.brandrow .sub{font-size:0.78rem; color:var(--text-muted); margin-top:1px;}
.statline{margin-top:10px; font-size:0.78rem; color:var(--text-muted); display:flex; gap:14px;}
.statline b{color:var(--gold);}

/* SEARCH + TABS */
.controls{padding:14px 18px 4px;}
.searchbar{position:relative;}
.searchbar input{
  width:100%; padding:11px 14px 11px 38px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:0.92rem; font-family:inherit;
}
.searchbar input:focus{outline:none; border-color:var(--gold);}
.searchbar svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:0.5;}
.tabs{display:flex; gap:8px; margin-top:12px;}
.tab{flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:0.82rem; font-weight:600;
  color:var(--text-muted); background:var(--surface); border:1px solid var(--border); cursor:pointer;}
.tab.active{color:#1a1512; background:var(--gold); border-color:var(--gold);}
.menubtn{width:38px; height:38px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}

.controls-row{display:flex; gap:8px; align-items:center;}

/* CONTENT */
main{padding:16px 18px 10px;}
.empty{text-align:center; padding:60px 20px; color:var(--text-muted);}
.empty .gunungan{width:64px; height:64px; margin:0 auto 14px; opacity:0.4;}
.empty h3{color:var(--gold-soft); font-weight:500; margin:0 0 6px;}
.empty p{font-size:0.85rem; margin:0 0 18px; line-height:1.5;}

.gen-label{display:flex; align-items:center; gap:8px; margin:22px 0 10px;}
.gen-label:first-child{margin-top:0;}
.gen-label .line{flex:1; height:1px; background:var(--border);}
.gen-label span{font-size:0.72rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); white-space:nowrap;}

.tree-node{position:relative; margin-left:0;}
.tree-children{margin-left:22px; padding-left:14px; border-left:1px dashed var(--border);}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:11px 12px; margin-bottom:8px; display:flex; align-items:center; gap:11px; cursor:pointer;
  transition:border-color 0.15s;
}
.card:active{border-color:var(--gold);}
.avatar{width:44px; height:44px; border-radius:50%; flex-shrink:0; object-fit:cover;
  background:var(--surface2); display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-weight:600; color:var(--gold); font-size:1.05rem; border:1px solid var(--border);}
.card .info{min-width:0; flex:1;}
.card .name{font-family:'Fraunces',serif; font-weight:500; font-size:1rem; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .name .nick{color:var(--gold); font-style:italic; font-weight:400; font-size:0.88em;}
.card .meta{font-size:0.74rem; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .deceased{opacity:0.55;}
.spouse-pill{font-size:0.7rem; color:var(--brick-soft); margin-top:2px;}
.life-pill{font-size:0.72rem; color:var(--text-muted); margin-top:1px;}

.listview .card{margin-bottom:8px;}

/* FAB */
.fab{
  position:fixed; right:18px; bottom:22px; width:56px; height:56px; border-radius:50%;
  background:var(--gold); color:#1a1512; border:none; font-size:1.6rem; display:flex; align-items:center;
  justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.4); cursor:pointer; z-index:30;
}

/* SHEET / MODAL */
.overlay{position:fixed; inset:0; background:rgba(10,8,6,0.72); z-index:50; display:none; align-items:flex-end;}
.overlay.show{display:flex;}
.sheet{
  background:var(--bg); width:100%; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0;
  border-top:1px solid var(--border); padding:16px 18px 26px; animation:slideup 0.22s ease-out;
}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
.sheet-title{font-family:'Fraunces',serif; font-size:1.25rem; font-weight:600; color:var(--gold-soft); margin:0 0 4px;}
.sheet-close{position:absolute; right:16px; top:14px; width:32px; height:32px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border); color:var(--text); display:flex; align-items:center;
  justify-content:center; cursor:pointer;}

/* DETAIL */
.detail-head{display:flex; flex-direction:column; align-items:center; text-align:center; padding:6px 0 18px;}
.detail-avatar{width:88px; height:88px; border-radius:50%; object-fit:cover; background:var(--surface2);
  border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-weight:600; font-size:2rem; color:var(--gold); margin-bottom:12px;}
.detail-name{font-family:'Fraunces',serif; font-size:1.4rem; font-weight:600;}
.detail-date{font-size:0.82rem; color:var(--text-muted); margin-top:2px;}
.detail-nick{color:var(--gold); font-style:italic; font-size:0.95rem; margin-top:2px;}
.detail-life{color:var(--text-muted); font-size:0.82rem; margin-top:4px;}

.info-grid{margin:16px 0; display:flex; flex-direction:column; gap:0;}
.info-row{display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--border); font-size:0.86rem;}
.info-row:last-child{border-bottom:none;}
.info-row .lbl{color:var(--text-muted); flex-shrink:0;}
.info-row .val{text-align:right; color:var(--text);}

.rel-section{margin-top:6px;}
.rel-section h4{font-size:0.72rem; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin:16px 0 8px;}
.rel-list{display:flex; flex-wrap:wrap; gap:8px;}
.rel-chip{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:6px 12px 6px 6px;
  display:flex; align-items:center; gap:7px; font-size:0.8rem; cursor:pointer;}
.rel-chip .mini{width:22px; height:22px; border-radius:50%; background:var(--surface2); display:flex; align-items:center;
  justify-content:center; font-family:'Fraunces',serif; font-size:0.7rem; color:var(--gold);}

.detail-actions{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; padding:12px; border-radius:11px; border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-weight:600; font-size:0.85rem; cursor:pointer; font-family:inherit;}
.btn.primary{background:var(--gold); color:#1a1512; border-color:var(--gold);}
.btn.danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn.ghost{background:transparent;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:6px; letter-spacing:0.3px;}
.field label .req{color:var(--brick-soft);}
.field input[type=text], .field input[type=date], .field textarea, .field select{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-family:inherit; font-size:0.9rem;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.photo-pick{display:flex; align-items:center; gap:14px;}
.photo-preview{width:64px; height:64px; border-radius:50%; object-fit:cover; background:var(--surface2);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:0.7rem; text-align:center;}
.filebtn{padding:9px 14px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); color:var(--text);
  font-size:0.8rem; cursor:pointer;}
.hint{font-size:0.72rem; color:var(--text-muted); margin-top:4px; line-height:1.4;}

/* MENU SHEET LIST */
.menu-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer; font-size:0.9rem;}
.menu-item:last-child{border-bottom:none;}
.menu-item svg{width:18px; height:18px; opacity:0.7; flex-shrink:0;}
.menu-item.danger{color:var(--danger);}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--surface2);
  border:1px solid var(--gold); color:var(--text); padding:12px 20px; border-radius:14px; font-size:0.86rem; font-weight:600;
  z-index:80; opacity:0; transition:opacity 0.25s, transform 0.25s; pointer-events:none; white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.toast.success{border-color:#5fae6e; background:#1c2e1f; color:#c9f0d0;}
.toast.error{border-color:var(--danger); background:#2e1c1c; color:#f0c9c9;}

footer.credit{text-align:center; font-size:0.68rem; color:var(--text-muted); padding:20px 0 4px; opacity:0.6;}
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <svg class="gunungan" viewBox="0 0 100 100"><path d="M50 6 L62 30 L78 24 L74 46 L92 50 L74 58 L82 80 L58 70 L54 92 L46 92 L42 70 L18 80 L26 58 L8 50 L26 46 L22 24 L38 30 Z" fill="none" stroke="#c9a24b" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <div>
      <h1>Ranji Rumah Gadang Panca</h1>
      <div class="sub">Silsilah Keluarga</div>
    </div>
  </div>
  <div class="statline" id="statline"><span><b id="statCount">0</b> orang</span><span><b id="statGen">0</b> generasi</span></div>
</header>

<div class="controls">
  <div class="searchbar" id="searchbarWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Cari nama atau panggilan...">
  </div>
  <div class="controls-row" style="margin-top:12px;">
    <div class="tabs" style="flex:1;">
      <div class="tab active" data-view="tree">Pohon</div>
      <div class="tab" data-view="list">Daftar</div>
      <div class="tab" data-view="guide">Panduan</div>
    </div>
    <button class="menubtn" id="menuBtn" title="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg>
    </button>
  </div>
  <div class="controls-row" id="genFilterWrap" style="margin-top:8px;">
    <select id="genFilter" style="flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--border);
      background:var(--surface); color:var(--text); font-size:0.85rem; font-family:inherit;">
      <option value="">Semua Generasi</option>
    </select>
  </div>
</div>

<main id="mainContent"></main>

<button class="fab" id="fabAdd" title="Tambah orang">+</button>

<!-- DETAIL SHEET -->
<div class="overlay" id="detailOverlay">
  <div class="sheet" style="position:relative;">
    <button class="sheet-close" id="detailClose">✕</button>
    <div class="sheet-handle"></div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- FORM SHEET -->
<div class="overlay" id="formOverlay">
  <div class="sheet" style="position:relative;">
    <button class="sheet-close" id="formClose">✕</button>
    <div class="sheet-handle"></div>
    <h3 class="sheet-title" id="formTitle">Tambah Orang</h3>
    <div style="height:8px;"></div>
    <form id="personForm">
      <div class="field">
        <label>Nama <span class="req">*wajib</span></label>
        <input type="text" id="f_name" required>
      </div>
      <div class="field">
        <label>Foto</label>
        <div class="photo-pick">
          <div class="photo-preview" id="photoPreview">Tidak ada</div>
          <input type="file" id="f_photo" accept="image/*" style="display:none;">
          <label for="f_photo" class="filebtn">Pilih foto</label>
          <button type="button" class="filebtn" id="removePhoto" style="display:none;">Hapus</button>
        </div>
      </div>
      <div class="field">
        <label>Tanggal Lahir <span style="color:var(--text-muted); font-weight:400;">(semua boleh kosong; boleh isi tahun saja, atau bulan+tahun saja)</span></label>
        <div style="display:flex; gap:6px;">
          <select id="f_birth_day" style="flex:1;"><option value="">Tgl</option></select>
          <select id="f_birth_month" style="flex:1.4;"><option value="">Bulan</option></select>
          <input type="number" id="f_birth_year" placeholder="Tahun" style="flex:1;" min="1800" max="2200">
        </div>
      </div>
      <div class="field">
        <label>Tanggal Wafat <span style="color:var(--text-muted); font-weight:400;">(kosongkan kalau masih hidup)</span></label>
        <div style="display:flex; gap:6px;">
          <select id="f_death_day" style="flex:1;"><option value="">Tgl</option></select>
          <select id="f_death_month" style="flex:1.4;"><option value="">Bulan</option></select>
          <input type="number" id="f_death_year" placeholder="Tahun" style="flex:1;" min="1800" max="2200">
        </div>
      </div>
      <div class="field">
        <label>Ayah</label>
        <select id="f_father"><option value="">— Tidak diketahui —</option></select>
      </div>
      <div class="field">
        <label>Ibu</label>
        <select id="f_mother"><option value="">— Tidak diketahui —</option></select>
      </div>
      <div class="field">
        <label>Pasangan (suami/istri) — bisa lebih dari satu</label>
        <div id="spouseList" style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
          <select id="f_spouse_add" style="flex:1;"><option value="">— Pilih untuk ditambahkan —</option></select>
          <button type="button" class="btn ghost" id="btnAddSpouse" style="white-space:nowrap; padding:0 14px;">+ Tambah</button>
        </div>
        <button type="button" class="filebtn" id="btnToggleNewSpouse" style="margin-top:8px;">+ Orang baru (belum ada di data)</button>
        <div id="newSpouseBox" style="display:none; margin-top:8px; padding:10px; border:1px dashed var(--border); border-radius:10px;">
          <div class="field" style="margin-bottom:8px;">
            <label>Nama pasangan baru</label>
            <input type="text" id="f_new_spouse_name" placeholder="Nama lengkap">
          </div>
          <div class="field" style="margin-bottom:8px;">
            <label>Foto (opsional)</label>
            <div class="photo-pick">
              <div class="photo-preview" id="newSpousePhotoPreview">Tidak ada</div>
              <input type="file" id="f_new_spouse_photo" accept="image/*" style="display:none;">
              <label for="f_new_spouse_photo" class="filebtn">Pilih foto</label>
              <button type="button" class="filebtn" id="removeNewSpousePhoto" style="display:none;">Hapus</button>
            </div>
          </div>
          <button type="button" class="btn ghost" id="btnCreateNewSpouse" style="width:100%;">Buat &amp; Tambahkan sebagai Pasangan</button>
        </div>
      </div>
      <div class="detail-actions">
        <button type="button" class="btn ghost" id="formCancel">Batal</button>
        <button type="submit" class="btn primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- MENU SHEET -->
<div class="overlay" id="menuOverlay">
  <div class="sheet" style="position:relative;">
    <button class="sheet-close" id="menuClose">✕</button>
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">Menu Data</h3>
    <div style="height:6px;"></div>
    <div class="menu-item" id="menuImportJson">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Impor dari JSON (backup lengkap)
    </div>
    <div class="menu-item" id="menuImportCsv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Impor dari CSV / Excel
    </div>
    <div class="menu-item" id="menuTemplate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Unduh template CSV
    </div>
    <div class="menu-item" id="menuExportJson">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Ekspor semua data (JSON)
    </div>
    <div class="menu-item danger" id="menuClearAll">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      Hapus semua data
    </div>
    <input type="file" id="jsonFileInput" accept=".json" style="display:none;">
    <input type="file" id="csvFileInput" accept=".csv" style="display:none;">
  </div>
</div>

<div class="toast" id="toast"></div>

<footer class="credit">Ide: Chilmar • Creator: Claude</footer>

<script>
(function(){
  const STORE_KEY = 'ranji-people';

  // ---------- STORAGE ADAPTER ----------
  // window.storage cuma tersedia kalau file ini dibuka lewat Claude
  // (claude.ai / app Claude). Kalau file di-download lalu dibuka langsung
  // di browser (klik dua kali dari folder), window.storage tidak ada —
  // maka dipakai localStorage bawaan browser sebagai cadangan, supaya
  // data (termasuk foto) tetap tersimpan di perangkat itu.
  const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  const storageAPI = hasClaudeStorage ? window.storage : {
    async get(key){
      try{
        const raw = localStorage.getItem('ranji_local_'+key);
        return raw ? { key, value: raw } : null;
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        localStorage.setItem('ranji_local_'+key, value);
        return { key, value };
      }catch(e){ return null; }
    }
  };
  let people = [];
  let currentView = 'tree';
  let editingId = null;
  let currentGenFilter = '';

  // Data awal Rumah Gadang Panca, hasil digitisasi dari file Excel
  // "Gen_I_-_VII_KEL_RG.xlsx" (Gen I - Gen VII, 232 anggota garis keturunan
  // + 84 pasangan yang menikah masuk). Hanya dipakai untuk mengisi data

  function migratePeople(list){
    // konversi data lama (spouseId tunggal) menjadi spouseIds (array),
    // supaya mendukung lebih dari satu pernikahan tanpa kehilangan data lama.
    list.forEach(p=>{
      if(!Array.isArray(p.spouseIds)){
        p.spouseIds = p.spouseId ? [p.spouseId] : [];
      }
      if(p.spouseId !== undefined) delete p.spouseId;
    });
    // pastikan tautan pasangan dua arah (kalau A punya B tapi B tidak punya A)
    list.forEach(p=>{
      p.spouseIds.forEach(sid=>{
        const sp = list.find(x=>x.id===sid);
        if(sp && !sp.spouseIds.includes(p.id)) sp.spouseIds.push(p.id);
      });
    });
    return list;
  }
  async function loadData(){
    try{
      const res = await storageAPI.get(STORE_KEY, false);
      people = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ people = []; }
    if(!people.length && SEED_PEOPLE.length){
      people = JSON.parse(JSON.stringify(SEED_PEOPLE));
      migratePeople(people);
      try{ await storageAPI.set(STORE_KEY, JSON.stringify(people), false); }catch(e){}
    } else if(people.length){
      const before = JSON.stringify(people);
      migratePeople(people);
      if(JSON.stringify(people) !== before){
        try{ await storageAPI.set(STORE_KEY, JSON.stringify(people), false); }catch(e){}
      }
    }
    render();
  }
  async function saveData(){
    // Mengembalikan true/false supaya pemanggil TAHU apakah penyimpanan

    // dibaca ulang (verifikasi) supaya benar-benar yakin datanya masuk,

      const res = await storageAPI.set(STORE_KEY, payload, false);
      if(!res){ showToast('Gagal menyimpan data — coba lagi', 'error'); return false; }
    }catch(e){
      showToast('Gagal menyimpan data — coba lagi', 'error');
      return false;
    }
    // verifikasi: baca ulang, pastikan benar-benar tersimpan dan sesuai
    try{
      const check = await storageAPI.get(STORE_KEY, false);
      if(!check || check.value !== payload){
        showToast('Tersimpan tapi verifikasi gagal — coba muat ulang halaman untuk memastikan', 'error');
        return false;
      }
    }catch(e){
      showToast('Tersimpan tapi tidak bisa diverifikasi — coba muat ulang halaman untuk memastikan', 'error');
      return false;
    }
    return true;
  }

  // ---------- HELPERS ----------
  function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function getP(id){ return people.find(p=>p.id===id); }
  function initials(name){
    return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }
  const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  // fmtDate menerima format fleksibel: "YYYY", "YYYY-MM", atau "YYYY-MM-DD"
  // (presisi tanggal boleh berbeda-beda per orang, karena tanggal/bulan opsional).
  function fmtDate(d){
    if(!d) return '';
    const m = String(d).match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/);
    if(!m) return d; // format tak dikenal, tampilkan apa adanya
    const [, y, mo, day] = m;
    if(day && mo) return `${parseInt(day,10)} ${BULAN_SINGKAT[parseInt(mo,10)-1]} ${y}`;
    if(mo) return `${BULAN_ID[parseInt(mo,10)-1]} ${y}`;
    return y;
  }
  function extractYear(d){
    if(!d) return null;
    const m = String(d).match(/^(\d{4})/);
    return m ? parseInt(m[1],10) : null;
  }
  function extractParts(d){
    if(!d) return { day:'', month:'', year:'' };
    const m = String(d).match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/);
    if(!m) return { day:'', month:'', year:'' };
    return { year: m[1], month: m[2]||'', day: m[3]||'' };
  }
  function buildDateStr(day, month, year){
    if(!year) return '';
    if(month && day) return `${year}-${month}-${day}`;
    if(month) return `${year}-${month}`;
    return `${year}`;
  }
  function lifespanStr(p){
    const by = extractYear(p.birthDate);
    const dy = extractYear(p.deathDate);
    if(by && dy) return by+' – '+dy;
    if(by) return 'lahir '+by;
    if(dy) return 'wafat '+dy;
    return '';
  }
  function children(id){ return people.filter(p=>p.fatherId===id || p.motherId===id); }
  function spousePeople(p){ return (p.spouseIds||[]).map(id=>getP(id)).filter(Boolean); }
  function spousePerson(p){ const arr = spousePeople(p); return arr.length ? arr[0] : null; }
  function showToast(msg, type){
    const t = document.getElementById('toast');
    const icon = type==='success' ? '✓ ' : type==='error' ? '⚠ ' : '';
    t.textContent = icon + msg;
    t.className = 'toast show' + (type ? ' '+type : '');
    clearTimeout(t._to);
    const duration = type ? 3500 : 2200;
    t._to = setTimeout(()=>t.classList.remove('show'), duration);
  }

  function computeGeneration(id, memo, guard){
    guard = guard || new Set();
    if(memo.has(id)) return memo.get(id);
    if(guard.has(id)) return 0; // cycle guard
    guard.add(id);
    const p = getP(id);
    if(!p){ memo.set(id,0); return 0; }
    if(!p.fatherId && !p.motherId){
      // Tidak diketahui orang tuanya. Jika ini pasangan yang menikah masuk,
      // samakan generasinya dengan pasangan (suami/istri), bukan otomatis Generasi 1.
      const spIds = (p.spouseIds||[]).filter(sid=>getP(sid) && !guard.has(sid));
      if(spIds.length){
        const g = computeGeneration(spIds[0], memo, guard);
        memo.set(id, g);
        return g;
      }
      memo.set(id,0); return 0;
    }
    let g = 0;
    if(p.fatherId && getP(p.fatherId)) g = Math.max(g, computeGeneration(p.fatherId, memo, guard)+1);
    if(p.motherId && getP(p.motherId)) g = Math.max(g, computeGeneration(p.motherId, memo, guard)+1);
    memo.set(id, g);
    return g;
  }

  // ---------- RENDER ----------
  function render(){
    updateStats();
    populateGenFilter();
    const main = document.getElementById('mainContent');
    const searchWrap = document.getElementById('searchbarWrap');
    const genWrap = document.getElementById('genFilterWrap');

    if(currentView === 'guide'){
      searchWrap.style.display = 'none';
      genWrap.style.display = 'none';
      main.innerHTML = guideHtml();
      return;
    }
    searchWrap.style.display = '';
    genWrap.style.display = '';

    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if(people.length===0){
      main.innerHTML = emptyStateHtml();
      return;
    }
    if(q){
      renderSearchResults(q);
      return;
    }
    if(currentGenFilter !== ''){
      main.innerHTML = genFilteredHtml(parseInt(currentGenFilter,10));
      attachCardHandlers();
      return;
    }
    main.innerHTML = currentView==='tree' ? treeViewHtml() : listViewHtml();
    attachCardHandlers();
  }

  function populateGenFilter(){
    const sel = document.getElementById('genFilter');
    if(!sel) return;
    const memo = new Map();
    let maxGen = 0;
    people.forEach(p=> maxGen = Math.max(maxGen, computeGeneration(p.id, memo)));
    const prev = currentGenFilter;
    const needed = people.length ? maxGen+1 : 0;
    if(sel.dataset.built === String(needed)) { sel.value = prev; return; }
    let opts = '<option value="">Semua Generasi</option>';
    for(let g=0; g<needed; g++){ opts += `<option value="${g}">Generasi ${g+1}</option>`; }
    sel.innerHTML = opts;
    sel.dataset.built = String(needed);
    sel.value = prev;
  }

  function genFilteredHtml(gen){
    const memo = new Map();
    const list = people
      .filter(p => !p.marriedIn && computeGeneration(p.id, memo) === gen)
      .sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'id'));
    if(!list.length) return emptyStateHtml();
    let html = `<div class="gen-label"><span>Generasi ${gen+1} · ${list.length} orang</span><div class="line"></div></div>`;
    html += `<div class="listview">${list.map(cardHtml).join('')}</div>`;
    return html;
  }

  function updateStats(){
    document.getElementById('statCount').textContent = people.length;
    if(people.length===0){ document.getElementById('statGen').textContent = 0; return; }
    const memo = new Map();
    let maxGen = 0;
    people.forEach(p=> maxGen = Math.max(maxGen, computeGeneration(p.id, memo)));
    document.getElementById('statGen').textContent = maxGen+1;
  }

  function emptyStateHtml(){
    return `<div class="empty">
      <svg class="gunungan" viewBox="0 0 100 100"><path d="M50 6 L62 30 L78 24 L74 46 L92 50 L74 58 L82 80 L58 70 L54 92 L46 92 L42 70 L18 80 L26 58 L8 50 L26 46 L22 24 L38 30 Z" fill="none" stroke="#c9a24b" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <h3>Belum ada silsilah</h3>
      <p>Mulai dengan menambahkan anggota keluarga secara manual,<br>atau impor data dari file JSON / CSV lewat menu.</p>
    </div>`;
  }

  function cardHtml(p){
    const avatar = p.photo
      ? `<img class="avatar" src="${p.photo}">`
      : `<div class="avatar">${initials(p.name)}</div>`;
    const spouses = spousePeople(p);
    const spousePills = spouses.map(sp=>`<div class="spouse-pill">⚭ ${escapeHtml(sp.name)}</div>`).join('');
    const life = lifespanStr(p);
    const lifeHtml = life ? `<div class="life-pill">${escapeHtml(life)}</div>` : '';
    return `<div class="card" data-id="${p.id}">
      ${avatar}
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        ${lifeHtml}
        ${spousePills}
      </div>
    </div>`;
  }

  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function treeViewHtml(){
    // roots = anggota garis keturunan RG yang tidak diketahui orang tuanya
    // (mis. Halimah). Pasangan yang menikah masuk (marriedIn) tidak dianggap
    // akar pohon sendiri — mereka tampil menempel di kartu pasangannya.
    const isRoot = p => !p.fatherId && !p.motherId && !p.marriedIn;
    const roots = people.filter(isRoot);
    const shown = new Set();
    let html = '';
    roots.forEach(r=>{
      if(shown.has(r.id)) return;
      html += renderNode(r, shown, 0);
    });
    // sisa: kerabat/pasangan yang tautannya tidak lengkap (mis. pernikahan
    // sebelumnya yang datanya minim) — tetap ditampilkan agar tidak hilang.
    const leftovers = people.filter(p=>!shown.has(p.id));
    if(leftovers.length){
      html += `<div class="gen-label"><span>Pasangan / kerabat lain (data terbatas)</span><div class="line"></div></div>`;
      leftovers.forEach(p=>{ html += renderNode(p, shown, 0); });
    }
    return html || emptyStateHtml();
  }

  function renderNode(p, shown, depth){
    if(shown.has(p.id)) return '';
    shown.add(p.id);
    spousePeople(p).forEach(sp=> shown.add(sp.id));
    let html = cardHtml(p);
    const kids = children(p.id);
    if(kids.length){
      html += `<div class="tree-children">`;
      kids.forEach(k=>{ html += renderNode(k, shown, depth+1); });
      html += `</div>`;
    }
    return `<div class="tree-node">${html}</div>`;
  }

  function listViewHtml(){
    const memo = new Map();
    const sorted = people
      .filter(p => !p.marriedIn)
      .sort((a,b)=>{
        const ga = computeGeneration(a.id, memo), gb = computeGeneration(b.id, memo);
        if(ga!==gb) return ga-gb;
        return (a.name||'').localeCompare(b.name||'', 'id');
      });
    let html = ''; let lastGen = null;
    sorted.forEach(p=>{
      const g = computeGeneration(p.id, memo);
      if(g!==lastGen){ html += `<div class="gen-label"><span>Generasi ${g+1}</span><div class="line"></div></div>`; lastGen = g; }
      html += cardHtml(p);
    });
    return `<div class="listview">${html}</div>`;
  }

  function renderSearchResults(q){
    const memo = new Map();
    let results = people.filter(p =>
      (p.name||'').toLowerCase().includes(q) || (p.nickname||'').toLowerCase().includes(q)
    );
    if(currentGenFilter !== ''){
      const gen = parseInt(currentGenFilter,10);
      results = results.filter(p => computeGeneration(p.id, memo) === gen);
    }
    const main = document.getElementById('mainContent');
    main.innerHTML = results.length
      ? results.map(cardHtml).join('')
      : `<div class="empty"><h3>Tidak ditemukan</h3><p>Coba kata kunci lain.</p></div>`;
    attachCardHandlers();
  }

  function attachCardHandlers(){
    document.querySelectorAll('.card').forEach(el=>{
      el.addEventListener('click', ()=> openDetail(el.dataset.id));
    });
  }

  // ---------- DETAIL SHEET ----------
  function openDetail(id){
    const p = getP(id);
    if(!p) return;
    const father = p.fatherId ? getP(p.fatherId) : null;
    const mother = p.motherId ? getP(p.motherId) : null;
    const spouses = spousePeople(p);
    const kids = children(p.id);
    const siblings = people.filter(s => s.id!==p.id && ((p.fatherId && s.fatherId===p.fatherId) || (p.motherId && s.motherId===p.motherId)));

    const avatar = p.photo ? `<img class="detail-avatar" src="${p.photo}">` : `<div class="detail-avatar">${initials(p.name)}</div>`;

    function chip(rel){ return rel ? `<div class="rel-chip" data-id="${rel.id}"><span class="mini">${initials(rel.name)}</span>${escapeHtml(rel.name)}</div>` : ''; }

    let relHtml = '';
    if(father || mother){
      relHtml += `<div class="rel-section"><h4>Orang Tua</h4><div class="rel-list">${chip(father) || '<span style="color:var(--text-muted);font-size:0.82rem;">Ayah tidak diketahui</span>'}${chip(mother) || (father?'':'<span style="color:var(--text-muted);font-size:0.82rem;">Ibu tidak diketahui</span>')}</div></div>`;
    }
    if(spouses.length){
      const label = spouses.length>1 ? `Pasangan (${spouses.length})` : 'Pasangan';
      relHtml += `<div class="rel-section"><h4>${label}</h4><div class="rel-list">${spouses.map(chip).join('')}</div></div>`;
    }
    if(siblings.length){
      relHtml += `<div class="rel-section"><h4>Saudara Kandung</h4><div class="rel-list">${siblings.map(chip).join('')}</div></div>`;
    }
    if(kids.length){
      relHtml += `<div class="rel-section"><h4>Anak (${kids.length})</h4><div class="rel-list">${kids.map(chip).join('')}</div></div>`;
    }

    // baris tanggal lahir/wafat lengkap (tanggal-bulan-tahun kalau tersedia,
    // fallback ke tahun saja kalau datanya cuma tahun)
    let dateLine = '';
    if(p.birthDate || p.deathDate){
      const b = p.birthDate ? fmtDate(p.birthDate) : '';
      const d = p.deathDate ? fmtDate(p.deathDate) : '';
      if(b && d) dateLine = `Lahir ${b} · Wafat ${d}`;
      else if(b) dateLine = `Lahir ${b}`;
      else if(d) dateLine = `Wafat ${d}`;
    }
    const dateHtml = dateLine ? `<div class="detail-date">${escapeHtml(dateLine)}</div>` : '';

    document.getElementById('detailBody').innerHTML = `
      <div class="detail-head">
        ${avatar}
        <div class="detail-name">${escapeHtml(p.name)}</div>
        ${dateHtml}
      </div>
      ${relHtml}
      <div class="detail-actions">
        <button class="btn ghost" id="btnAddChild" style="flex:1;">+ Tambah Anak</button>
      </div>
      <div class="detail-actions">
        <button class="btn danger" id="btnDeletePerson">Hapus</button>
        <button class="btn primary" id="btnEditPerson">Edit</button>
      </div>
    `;
    document.getElementById('detailBody').querySelectorAll('.rel-chip').forEach(el=>{
      el.addEventListener('click', ()=> openDetail(el.dataset.id));
    });
    document.getElementById('btnEditPerson').addEventListener('click', ()=>{ closeOverlay('detailOverlay'); openForm(p.id); });
    document.getElementById('btnDeletePerson').addEventListener('click', ()=> deletePersonConfirm(p.id));
    document.getElementById('btnAddChild').addEventListener('click', ()=>{
      closeOverlay('detailOverlay');
      // Tentukan Ayah/Ibu yang mau di-preset. Kalau gender diketahui, jelas.
      // Kalau tidak diketahui, coba tebak dari anak yang sudah ada (bukti
      // nyata, bukan tebakan buta) — kalau tetap tidak jelas, biarkan
      // kosong supaya tidak salah isi.
      let presetFatherId = null, presetMotherId = null;
      if(p.gender === 'L') presetFatherId = p.id;
      else if(p.gender === 'P') presetMotherId = p.id;
      else if(kids.length){
        if(kids[0].fatherId === p.id) presetFatherId = p.id;
        else if(kids[0].motherId === p.id) presetMotherId = p.id;
      }
      openForm(null, { fatherId: presetFatherId, motherId: presetMotherId });
    });
    openOverlay('detailOverlay');
  }
  function rowHtml(lbl,val){ return `<div class="info-row"><span class="lbl">${lbl}</span><span class="val">${escapeHtml(val)}</span></div>`; }

  async function deletePersonConfirm(id){
    const p = getP(id);
    if(!confirm(`Hapus "${p.name}" dari silsilah? Data anak akan tetap ada tapi tautan ke orang tua ini akan dihapus.`)) return;
    people.forEach(x=>{
      if(x.fatherId===id) x.fatherId = null;
      if(x.motherId===id) x.motherId = null;
      if(Array.isArray(x.spouseIds) && x.spouseIds.includes(id)) x.spouseIds = x.spouseIds.filter(s=>s!==id);
    });
    people = people.filter(x=>x.id!==id);
    const ok = await saveData();
    closeOverlay('detailOverlay'); render();
    if(ok) showToast('Data berhasil dihapus', 'success');
  }

  // ---------- FORM ----------
  function populateSelects(excludeId){
    const opts = people.filter(p=>p.id!==excludeId)
      .sort((a,b)=>(a.name||'').localeCompare(b.name||'','id'))
      .map(p=>`<option value="${p.id}">${escapeHtml(p.name)}${p.nickname?' ('+escapeHtml(p.nickname)+')':''}</option>`).join('');
    ['f_father','f_mother'].forEach(id=>{
      const sel = document.getElementById(id);
      const placeholder = sel.options[0];
      sel.innerHTML = ''; sel.appendChild(placeholder);
      sel.insertAdjacentHTML('beforeend', opts);
    });
    refreshSpouseAddSelect();
  }

  let pendingSpouseIds = [];
  let pendingNewSpouseDrafts = []; // { tempId, name, photo }
  let newSpousePhotoPending = null;

  function refreshSpouseAddSelect(){
    const sel = document.getElementById('f_spouse_add');
    const opts = people.filter(p=>p.id!==editingId && !pendingSpouseIds.includes(p.id))
      .sort((a,b)=>(a.name||'').localeCompare(b.name||'','id'))
      .map(p=>`<option value="${p.id}">${escapeHtml(p.name)}${p.nickname?' ('+escapeHtml(p.nickname)+')':''}</option>`).join('');

  function renderSpouseList(){
    const wrap = document.getElementById('spouseList');
    if(!pendingSpouseIds.length && !pendingNewSpouseDrafts.length){
      wrap.innerHTML = `<div style="color:var(--text-muted); font-size:0.82rem;">Belum ada pasangan ditambahkan.</div>`;
      return;
    }
    const existingHtml = pendingSpouseIds.map(sid=>{
      const sp = getP(sid);

      return `<div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px;">

      </div>`;
    }).join('');
    const draftHtml = pendingNewSpouseDrafts.map(d=>{
      const avatar = d.photo
        ? `<img src="${d.photo}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;">`
        : '';
      return `<div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border:1px solid var(--gold); border-radius:10px; padding:8px 10px;">
        <span>${avatar}⚭ ${escapeHtml(d.name)} <span style="color:var(--gold); font-size:0.72rem;">· baru</span></span>

    wrap.querySelectorAll('.draft-spouse-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        pendingNewSpouseDrafts = pendingNewSpouseDrafts.filter(d=>d.tempId!==btn.dataset.tempid);
        renderSpouseList();
      });
    });
  }

  function updateNewSpousePhotoPreview(){
    const prev = document.getElementById('newSpousePhotoPreview');
    const rm = document.getElementById('removeNewSpousePhoto');
    if(newSpousePhotoPending){ prev.innerHTML = `<img src="${newSpousePhotoPending}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; rm.style.display='inline-block'; }
    else { prev.textContent = 'Tidak ada'; rm.style.display='none'; }
  }

  document.getElementById('btnToggleNewSpouse').addEventListener('click', ()=>{
    const box = document.getElementById('newSpouseBox');
    box.style.display = box.style.display==='none' ? 'block' : 'none';
  });

  document.getElementById('f_new_spouse_photo').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 200;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        newSpousePhotoPending = canvas.toDataURL('image/jpeg', 0.65);
        updateNewSpousePhotoPreview();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('removeNewSpousePhoto').addEventListener('click', ()=>{
    newSpousePhotoPending = null; updateNewSpousePhotoPreview();
    document.getElementById('f_new_spouse_photo').value = '';
  });

  document.getElementById('btnCreateNewSpouse').addEventListener('click', ()=>{
    const nameInput = document.getElementById('f_new_spouse_name');
    const name = nameInput.value.trim();
    if(!name){ showToast('Nama pasangan baru wajib diisi'); return; }
    pendingNewSpouseDrafts.push({ tempId: 'draft_'+uid(), name, photo: newSpousePhotoPending });
    nameInput.value = '';
    newSpousePhotoPending = null;
    document.getElementById('f_new_spouse_photo').value = '';
    updateNewSpousePhotoPreview();
    document.getElementById('newSpouseBox').style.display = 'none';
    renderSpouseList();
    showToast('Pasangan baru siap ditambahkan — jangan lupa Simpan di bawah');
  });

  document.getElementById('btnAddSpouse').addEventListener('click', ()=>{
    const sel = document.getElementById('f_spouse_add');
    const id = sel.value;
    if(!id) return;
    if(!pendingSpouseIds.includes(id)) pendingSpouseIds.push(id);
    renderSpouseList();
    refreshSpouseAddSelect();
  });

  let pendingPhoto = null;

  function openForm(id, presets){
    presets = presets || {};
    editingId = id || null;
    const p = id ? getP(id) : null;
    document.getElementById('formTitle').textContent = p ? 'Edit Orang' : (presets.fatherId || presets.motherId ? 'Tambah Anak' : 'Tambah Orang');
    pendingSpouseIds = p ? [...(p.spouseIds||[])] : [];
    pendingNewSpouseDrafts = [];
    newSpousePhotoPending = null;
    document.getElementById('f_new_spouse_name').value = '';
    document.getElementById('f_new_spouse_photo').value = '';
    document.getElementById('newSpouseBox').style.display = 'none';
    updateNewSpousePhotoPreview();
    populateSelects(id);
    document.getElementById('f_name').value = p ? p.name||'' : '';
    const bParts = extractParts(p ? p.birthDate : '');
    const dParts = extractParts(p ? p.deathDate : '');
    document.getElementById('f_birth_day').value = bParts.day;
    document.getElementById('f_birth_month').value = bParts.month;
    document.getElementById('f_birth_year').value = bParts.year;
    document.getElementById('f_death_day').value = dParts.day;
    document.getElementById('f_death_month').value = dParts.month;
    document.getElementById('f_death_year').value = dParts.year;
    document.getElementById('f_father').value = p ? p.fatherId||'' : (presets.fatherId||'');
    document.getElementById('f_mother').value = p ? p.motherId||'' : (presets.motherId||'');
    renderSpouseList();
    pendingPhoto = p ? p.photo||null : null;
    updatePhotoPreview();
    openOverlay('formOverlay');
  }

  function updatePhotoPreview(){
    const prev = document.getElementById('photoPreview');
    const rm = document.getElementById('removePhoto');
    if(pendingPhoto){ prev.innerHTML = `<img src="${pendingPhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; rm.style.display='inline-block'; }
    else { prev.textContent = 'Tidak ada'; rm.style.display='none'; }
  }

  document.getElementById('f_photo').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        // Kompresi ketat: foto cuma tampil sebagai avatar bulat kecil
        // (maks. 88px di halaman detail), jadi 200px + kualitas 65% sudah
        // lebih dari cukup jernih untuk layar HP, dengan ukuran file jauh
        // lebih hemat dibanding resolusi penuh.
        const maxW = 200;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        pendingPhoto = canvas.toDataURL('image/jpeg', 0.65);
        updatePhotoPreview();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('removePhoto').addEventListener('click', ()=>{ pendingPhoto=null; updatePhotoPreview(); document.getElementById('f_photo').value=''; });

  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(()=> reject(new Error(`${label} tidak merespons dalam ${ms/1000} detik`)), ms))
    ]);
  }

  document.getElementById('personForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('Nama wajib diisi'); return; }

    const submitBtn = document.querySelector('#personForm button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Menyimpan...';

    try{
      // Pengaman: kalau ada nama pasangan baru yang sudah diketik tapi
      // BELUM diklik "Buat & Tambahkan sebagai Pasangan", anggap saja
      // dia mau ditambahkan — supaya tidak hilang begitu saja kalau
      // langkah itu terlewat.
      const leftoverName = document.getElementById('f_new_spouse_name').value.trim();
      if(leftoverName){
        pendingNewSpouseDrafts.push({ tempId: 'draft_'+uid(), name: leftoverName, photo: newSpousePhotoPending });
        document.getElementById('f_new_spouse_name').value = '';
        newSpousePhotoPending = null;
      }

      // buat dulu orang baru dari draf pasangan (yang belum ada di data)
      const newSpouseIds = pendingNewSpouseDrafts.map(d=>{
        const np = {
          id: uid(), name: d.name, nickname:'', gender:'', birthDate:'', deathDate:'',
          fatherId: null, motherId: null, spouseIds: [], address:'', notes:'',
          photo: d.photo || null,
        };
        people.push(np);
        return np.id;
      });

      const data = {
        name,
        birthDate: buildDateStr(
          document.getElementById('f_birth_day').value,
          document.getElementById('f_birth_month').value,
          document.getElementById('f_birth_year').value.trim()
        ),
        deathDate: buildDateStr(
          document.getElementById('f_death_day').value,
          document.getElementById('f_death_month').value,
          document.getElementById('f_death_year').value.trim()
        ),
        fatherId: document.getElementById('f_father').value || null,
        motherId: document.getElementById('f_mother').value || null,
        spouseIds: [...pendingSpouseIds.filter(id=>id!==editingId), ...newSpouseIds],
        photo: pendingPhoto || null,
      };
      if(data.fatherId===editingId) data.fatherId=null;
      if(data.motherId===editingId) data.motherId=null;

      let selfId = editingId;
      if(editingId){
        const p = getP(editingId);
        Object.assign(p, data);
      } else {
        const np = { id: uid(), ...data };
        people.push(np);
        selfId = np.id;
      }
      // pastikan tautan pasangan dua arah untuk semua pasangan yang dipilih,
      // dan lepaskan tautan dari pasangan lama yang sudah dihapus dari daftar.
      people.forEach(x=>{
        if(x.id===selfId) return;
        const shouldLink = data.spouseIds.includes(x.id);
        const isLinked = Array.isArray(x.spouseIds) && x.spouseIds.includes(selfId);
        if(shouldLink && !isLinked){ x.spouseIds = [...(x.spouseIds||[]), selfId]; }
        else if(!shouldLink && isLinked){ x.spouseIds = x.spouseIds.filter(id=>id!==selfId); }
      });

      const ok = await withTimeout(saveData(), 8000, 'Penyimpanan');
      if(ok){
        closeOverlay('formOverlay');
        render();
        showToast('Data berhasil disimpan', 'success');
      } else {
        // gagal simpan: JANGAN tutup form, supaya input tidak hilang dan
        // orang bisa coba simpan ulang. Toast kegagalan sudah ditampilkan
        // oleh saveData().
        render();
      }
    }catch(err){
      // Pengaman terakhir: apa pun errornya, JANGAN gagal diam-diam.
      // Tampilkan pesannya supaya bisa dilacak, dan form tetap terbuka
      // supaya input tidak hilang.
      console.error('Gagal menyimpan orang:', err);
      showToast('Gagal menyimpan: ' + (err && err.message ? err.message : 'terjadi kesalahan tak terduga'), 'error');
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Simpan';
    }
  });

  // ---------- IMPORT / EXPORT ----------
  function exportJson(){
    const blob = new Blob([JSON.stringify(people, null, 2)], {type:'application/json'});
    downloadBlob(blob, 'ranji-silsilah.json');
  }
  function downloadTemplate(){
    const header = 'name,father_name,mother_name,spouse_name\n';
    const example1 = 'Siti Aminah,Kartono,Marsih,Slamet Riyadi\n';
    const example2 = 'Kartono,,,Marsih;Ratna Sari\n';
    const blob = new Blob([header+example1+example2], {type:'text/csv'});
    downloadBlob(blob, 'template-ranji.csv');
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importJsonFile(file){
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const incoming = JSON.parse(e.target.result);
        if(!Array.isArray(incoming)) throw new Error('format tidak sesuai');
        const idMap = {};
        incoming.forEach(raw=>{
          const existing = raw.id ? getP(raw.id) : null;
          if(existing){
            Object.assign(existing, raw);
            idMap[raw.id] = raw.id;
          } else {
            const newId = uid();
            idMap[raw.id || newId] = newId;
            people.push({...raw, id:newId});
          }
        });
        // remap father/mother/spouse ids for newly created ones referencing old ids not yet in idMap resolution pass
        people.forEach(p=>{
          if(p.fatherId && idMap[p.fatherId]) p.fatherId = idMap[p.fatherId];
          if(p.motherId && idMap[p.motherId]) p.motherId = idMap[p.motherId];
          if(Array.isArray(p.spouseIds)) p.spouseIds = p.spouseIds.map(sid=>idMap[sid]||sid);
        });
        migratePeople(people);
        const ok = await saveData(); render();
        if(ok) showToast(`Impor JSON berhasil (${incoming.length} data)`, 'success');
      }catch(err){ showToast('Gagal membaca file JSON', 'error'); }
    };
    reader.readAsText(file);
  }

  function findOrCreateByName(name){
    if(!name) return null;
    const trimmed = name.trim();
    if(!trimmed) return null;
    let existing = people.find(p=>(p.name||'').trim().toLowerCase()===trimmed.toLowerCase());
    if(existing) return existing.id;
    const np = { id: uid(), name: trimmed, nickname:'', gender:'', birthDate:'', deathDate:'', fatherId:null, motherId:null, spouseIds:[], address:'', notes:'' };
    people.push(np);
    return np.id;
  }

  function importCsvFile(file){
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete: async function(results){
        let count = 0;
        results.data.forEach(row=>{
          const name = (row.name||'').trim();
          if(!name) return;
          let existing = people.find(p=>(p.name||'').trim().toLowerCase()===name.toLowerCase());
          const rec = existing || { id: uid(), name };
          if(!existing) people.push(rec);
          if(row.father_name && row.father_name.trim()) rec.fatherId = findOrCreateByName(row.father_name);
          if(row.mother_name && row.mother_name.trim()) rec.motherId = findOrCreateByName(row.mother_name);
          if(row.spouse_name && row.spouse_name.trim()){
            if(!Array.isArray(rec.spouseIds)) rec.spouseIds = [];
            // dukung lebih dari satu pasangan: pisahkan dengan " ; " di kolom spouse_name
            row.spouse_name.split(';').map(s=>s.trim()).filter(Boolean).forEach(spouseName=>{
              const spId = findOrCreateByName(spouseName);
              if(!rec.spouseIds.includes(spId)) rec.spouseIds.push(spId);
              const sp = getP(spId);
              if(sp){ if(!Array.isArray(sp.spouseIds)) sp.spouseIds = []; if(!sp.spouseIds.includes(rec.id)) sp.spouseIds.push(rec.id); }
            });
          }
          count++;
        });
        const ok = await saveData(); render();
        if(ok) showToast(`Impor CSV berhasil (${count} baris)`, 'success');
      },
      error: function(){ showToast('Gagal membaca file CSV', 'error'); }
    });
  }

  async function clearAll(){
    if(!confirm('Yakin ingin menghapus SEMUA data silsilah? Tindakan ini tidak dapat dibatalkan. Disarankan ekspor data dulu.')) return;
    people = [];
    const ok = await saveData(); render();
    if(ok) showToast('Semua data berhasil dihapus', 'success');
  }

  // ---------- OVERLAY HELPERS ----------
  function openOverlay(id){ document.getElementById(id).classList.add('show'); }
  function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

  document.getElementById('detailClose').addEventListener('click', ()=>closeOverlay('detailOverlay'));
  document.getElementById('formClose').addEventListener('click', ()=>closeOverlay('formOverlay'));
  document.getElementById('formCancel').addEventListener('click', ()=>closeOverlay('formOverlay'));
  document.getElementById('menuClose').addEventListener('click', ()=>closeOverlay('menuOverlay'));
  ['detailOverlay','formOverlay','menuOverlay'].forEach(id=>{
    document.getElementById(id).addEventListener('click', (e)=>{ if(e.target.id===id) closeOverlay(id); });
  });

  document.getElementById('fabAdd').addEventListener('click', ()=> openForm(null));
  document.getElementById('menuBtn').addEventListener('click', ()=> openOverlay('menuOverlay'));

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentView = tab.dataset.view;
      render();
    });
  });
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('genFilter').addEventListener('change', (e)=>{ currentGenFilter = e.target.value; render(); });

  document.getElementById('menuImportJson').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); document.getElementById('jsonFileInput').click(); });
  document.getElementById('menuImportCsv').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); document.getElementById('csvFileInput').click(); });
  document.getElementById('menuTemplate').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); downloadTemplate(); });
  document.getElementById('menuExportJson').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); exportJson(); });
  document.getElementById('menuClearAll').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); clearAll(); });
  document.getElementById('jsonFileInput').addEventListener('change', (e)=>{ if(e.target.files[0]) importJsonFile(e.target.files[0]); e.target.value=''; });
  document.getElementById('csvFileInput').addEventListener('change', (e)=>{ if(e.target.files[0]) importCsvFile(e.target.files[0]); e.target.value=''; });

  function populateDateDropdowns(){
    ['f_birth_day','f_death_day'].forEach(id=>{
      const sel = document.getElementById(id);
      for(let d=1; d<=31; d++){
        const opt = document.createElement('option');
        opt.value = String(d).padStart(2,'0');
        opt.textContent = d;
        sel.appendChild(opt);
      }
    });
    ['f_birth_month','f_death_month'].forEach(id=>{
      const sel = document.getElementById(id);
      BULAN_ID.forEach((nama, i)=>{
        const opt = document.createElement('option');
        opt.value = String(i+1).padStart(2,'0');
        opt.textContent = nama;
        sel.appendChild(opt);
      });
    });
  }
  populateDateDropdowns();

  loadData();
})();
</script>
